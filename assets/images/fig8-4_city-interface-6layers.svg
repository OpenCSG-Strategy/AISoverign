<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图8-4 城市接口：六层生态与三次回流</title>
<desc>《AI主权》原创信息图，v0.1，2026-08-06。把"城市不是缩小的国家"画成国家 vs 城市 4 区别 + 6 层 AI 生态（能源/模型/主体/场景/反馈/责任）+ 3 次回流（资源/资产/价值）。数据来源：第八章正文 08.3，截至 2026-08-06。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:20px;font-weight:700}
.small{font-size:15px}
.tiny{font-size:13px}
.num{font-size:30px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图8-4　城市不是缩小的国家，而是 AI 生态的接口</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">国家定底线 — 城市接具体任务：六层并存，三次回流</text>

<!-- 左侧：国家 vs 城市 4 区别 -->
<g>
  <rect x="60" y="130" width="540" height="600" class="box muted"/>
  <text x="330" y="170" class="label" text-anchor="middle">国家 vs 城市 — 4 区别</text>

  <text x="80" y="215" class="label" fill="#1f4e79">① 法律授权</text>
  <text x="80" y="240" class="small">国家：出口许可 / 国际规则 / 长期投入</text>
  <text x="80" y="262" class="small">城市：本地数据授权 / 地方流程 / 行业准入</text>

  <text x="80" y="300" class="label" fill="#1f4e79">② 资源范围</text>
  <text x="80" y="325" class="small">国家：芯片 / 跨境算力 / 国家级云</text>
  <text x="80" y="347" class="small">城市：机房 / 社区算力 / 边缘节点</text>

  <text x="80" y="385" class="label" fill="#1f4e79">③ 抽象度</text>
  <text x="80" y="410" class="small">国家：技术资产 / 战略能力 / 行业份额</text>
  <text x="80" y="432" class="small">城市：方言 / 工厂 / 医院 / 道路 / 基层</text>

  <text x="80" y="470" class="label" fill="#1f4e79">④ 责任结构</text>
  <text x="80" y="495" class="small">国家：跨地区协调 / 国际承诺</text>
  <text x="80" y="517" class="small">城市：结果责任 / 申诉 / 替换 / 退出</text>

  <line x1="80" y1="555" x2="580" y2="555" class="thin"/>
  <text x="80" y="585" class="small" font-weight="700" fill="#1f4e79">→ 城市更像一组"接口"</text>
  <text x="80" y="610" class="small">把抽象能力接到具体任务：方言、设备、流程、</text>
  <text x="80" y="632" class="small">医院责任、道路条件、基层人员。</text>
  <text x="80" y="660" class="small">这个过程不是"部署"，而是重新定义</text>
  <text x="80" y="682" class="small">数据 / 评测 / 权限 / 结果责任。</text>
  <text x="80" y="710" class="tiny" font-style="italic">"六层不是城市超级大脑的上下游，需要允许多运营者 + 多社区 + 多路线并存"</text>
</g>

<!-- 右侧：6 层生态 + 3 次回流 -->
<g>
  <text x="640" y="170" class="label">六层 AI 生态 — 必须同时设计</text>

  <rect x="640" y="190" width="900" height="55" class="box warm"/>
  <text x="700" y="225" class="label">① 能源 + 网络 + 多元算力</text>
  <text x="1530" y="225" class="small" text-anchor="end">资源稳定 / 芯片切换后仍能运行</text>

  <rect x="640" y="255" width="900" height="55" class="box accent"/>
  <text x="700" y="290" class="label">② 模型 + 数据集 + 评测集 + 开发工具</text>
  <text x="1530" y="290" class="small" text-anchor="end">一次采购 → 后续可继续使用</text>

  <rect x="640" y="320" width="900" height="55" class="box green"/>
  <text x="700" y="355" class="label">③ 大学 + 企业 + 开源社区 + OPC + 专业服务者</text>
  <text x="1530" y="355" class="small" text-anchor="end">设施不会自己发现问题</text>

  <rect x="640" y="385" width="900" height="55" class="box warm"/>
  <text x="700" y="420" class="label">④ 真实场景 — 工厂 + 港口 + 医院 + 学校 + 交通 + 公共服务</text>
  <text x="1530" y="420" class="small" text-anchor="end">任务从这里进入</text>

  <rect x="640" y="450" width="900" height="55" class="box accent"/>
  <text x="700" y="485" class="label">⑤ 反馈 + 行业知识 + 收入</text>
  <text x="1530" y="485" class="small" text-anchor="end">决定生态能否反哺下一轮</text>

  <rect x="640" y="515" width="900" height="55" class="box red"/>
  <text x="700" y="550" class="label">⑥ 公共责任 — 数据边界 + 机器身份 + 审计 + 申诉 + 替换 + 分配</text>
  <text x="1530" y="550" class="small" text-anchor="end">没有这层 = 没有主权</text>

  <!-- 3 次回流 -->
  <line x1="640" y1="595" x2="1540" y2="595" class="line"/>
  <text x="1090" y="625" class="label" text-anchor="middle">判断生态是否成立 — 三次回流</text>

  <rect x="640" y="650" width="290" height="100" class="box green"/>
  <text x="785" y="685" class="label" text-anchor="middle">① 资源回流</text>
  <text x="785" y="710" class="small" text-anchor="middle">公共投入降低了</text>
  <text x="785" y="730" class="small" text-anchor="middle">科研 / 企业 / 开发者</text>
  <text x="785" y="748" class="small" text-anchor="middle">取得算力 + 模型的门槛</text>

  <rect x="945" y="650" width="290" height="100" class="box accent"/>
  <text x="1090" y="685" class="label" text-anchor="middle">② 资产回流</text>
  <text x="1090" y="710" class="small" text-anchor="middle">项目结束后是否留下</text>
  <text x="1090" y="730" class="small" text-anchor="middle">代码 / 模型适配 / 评测 /</text>
  <text x="1090" y="748" class="small" text-anchor="middle">数据产品 / 人才</text>

  <rect x="1250" y="650" width="290" height="100" class="box warm"/>
  <text x="1395" y="685" class="label" text-anchor="middle">③ 价值回流</text>
  <text x="1395" y="710" class="small" text-anchor="middle">产业收入 / 公共服务</text>
  <text x="1395" y="730" class="small" text-anchor="middle">改善 / 人才成长是否</text>
  <text x="1395" y="748" class="small" text-anchor="middle">支持新一轮建设</text>

  <text x="1090" y="780" class="small" text-anchor="middle" font-weight="700" fill="#1f4e79">只有第 1 层 = 城市得到机房 · 只有前 4 层 = 城市得到项目 · 6 层循环 = 生态意义的主权</text>
</g>

<!-- footer -->
<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 数据来源：第八章 03 节，截至 2026-08-06</text>
<text x="1540" y="880" class="tiny" text-anchor="end">《AI主权》</text>
</svg>
