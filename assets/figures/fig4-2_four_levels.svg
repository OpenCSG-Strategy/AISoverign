<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="520" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">从"读"到"代理"的四级授权</text>
<rect x="40" y="220" width="195" height="110" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="137" y="254" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">读</text>
<text x="137" y="284" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">看资料，不改任何东西</text>
<rect x="250" y="180" width="195" height="150" rx="4" fill="#eaeaea" stroke="#111" stroke-width="1.5"/>
<text x="347" y="214" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">建议</text>
<text x="347" y="244" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">提出下一步，由人决定</text>
<rect x="460" y="140" width="195" height="190" rx="4" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
<text x="557" y="174" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">代办</text>
<text x="557" y="204" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">在说清的范围内动手，</text>
<text x="557" y="224" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">关键节点回来确认</text>
<rect x="670" y="100" width="195" height="230" rx="4" fill="#a8a8a8" stroke="#111" stroke-width="1.5"/>
<text x="767" y="134" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">代理</text>
<text x="767" y="164" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">人只给目标，它自己拆步骤、</text>
<text x="767" y="184" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">挑工具，遇到异常才停下</text>
<line x1="40" y1="350" x2="860" y2="350" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="374" font-size="13" text-anchor="start" font-weight="normal" fill="#555">授权一级一级往上走，人交出去的决定越来越多 →</text>
<text x="40" y="418" font-size="16" text-anchor="start" font-weight="bold" fill="#111">动作越难撤回，授权就要离当下越近</text>
<rect x="40" y="435" width="185" height="62" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
<text x="132" y="460" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">读公开网页</text>
<text x="132" y="483" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">可以长期授权</text>
<line x1="227" y1="466" x2="248" y2="466" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="250" y="435" width="185" height="62" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
<text x="342" y="460" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">改草稿</text>
<text x="342" y="483" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">按项目授权</text>
<line x1="437" y1="466" x2="458" y2="466" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="460" y="435" width="185" height="62" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
<text x="552" y="460" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">对外发表声明</text>
<text x="552" y="483" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">每次确认</text>
<line x1="647" y1="466" x2="668" y2="466" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="670" y="435" width="185" height="62" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
<text x="762" y="460" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">给陌生人付款</text>
<text x="762" y="483" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">一次新的、具体的同意</text>
</svg>
