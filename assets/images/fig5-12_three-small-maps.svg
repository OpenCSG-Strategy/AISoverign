<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-12 一个人也在运行一张能力网络：3 张小图看清自己</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"个人能力网络"画成 3 张小图：① 资料图（数据在哪里 / 谁可读） ② 行动图（谁能建议 / 谁能创建 / 谁能发送/付款/删除/发布） ③ 替代图（某模型/平台/账户失效后谁一起停 / 最低接管）。数据来源：第五章 05.12 正文。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图5-12　一个人也在运行一张能力网络：3 张小图看清自己</text>
<text x="800" y="100" class="label" text-anchor="middle">一张纸画几个方框和箭头，就能暴露许多问题</text>

<!-- 3 张图 -->
<g>
  <rect x="60" y="140" width="460" height="600" class="box accent"/>
  <text x="290" y="180" class="label" text-anchor="middle">① 资料图</text>
  <text x="290" y="205" class="small" text-anchor="middle" fill="#1f4e79" font-weight="700">数据在哪里 / 谁能读</text>
  <line x1="100" y1="225" x2="480" y2="225" class="thin"/>

  <text x="100" y="260" class="num" text-anchor="start">·</text>
  <text x="140" y="260" class="small" text-anchor="start" fill="#1f4e79">客户材料</text>
  <text x="100" y="285" class="tiny" text-anchor="start" fill="#8795a1">在 CRM / 邮件 / 笔记</text>
  <text x="100" y="305" class="tiny" text-anchor="start" fill="#8795a1">研究助手 / 销售助手可读</text>

  <text x="100" y="340" class="num" text-anchor="start">·</text>
  <text x="140" y="340" class="small" text-anchor="start" fill="#1f4e79">私人记录</text>
  <text x="100" y="365" class="tiny" text-anchor="start" fill="#8795a1">日记 / 家庭 / 健康</text>
  <text x="100" y="385" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">只本人可读 → 不进入商业任务</text>

  <text x="100" y="420" class="num" text-anchor="start">·</text>
  <text x="140" y="420" class="small" text-anchor="start" fill="#1f4e79">公开研究</text>
  <text x="100" y="445" class="tiny" text-anchor="start" fill="#8795a1">订阅源 / 文件夹 / 网络笔记</text>
  <text x="100" y="465" class="tiny" text-anchor="start" fill="#8795a1">研究助手可读</text>

  <text x="100" y="500" class="num" text-anchor="start">·</text>
  <text x="140" y="500" class="small" text-anchor="start" fill="#1f4e79">财务数据</text>
  <text x="100" y="525" class="tiny" text-anchor="start" fill="#8795a1">银行接口 / 记账 / 票据</text>
  <text x="100" y="545" class="tiny" text-anchor="start" fill="#8795a1">财务助手可读 / 付款需确认</text>

  <text x="100" y="595" class="label" text-anchor="start" fill="#7c2d12">异常</text>
  <line x1="100" y1="615" x2="480" y2="615" class="thin"/>
  <text x="100" y="645" class="tiny" text-anchor="start" fill="#7c2d12">研究助手为什么能看见付款资料？</text>
  <text x="100" y="668" class="tiny" text-anchor="start" fill="#7c2d12">发布平台为什么保存客户通讯录？</text>

  <rect x="540" y="140" width="460" height="600" class="box warm"/>
  <text x="770" y="180" class="label" text-anchor="middle">② 行动图</text>
  <text x="770" y="205" class="small" text-anchor="middle" fill="#1f4e79" font-weight="700">谁能做什么</text>
  <line x1="580" y1="225" x2="960" y2="225" class="thin"/>

  <text x="580" y="260" class="num" text-anchor="start" fill="#1f4e79">只建议</text>
  <text x="700" y="260" class="small" text-anchor="start">研究助手 / 写作助手</text>
  <text x="580" y="283" class="tiny" text-anchor="start" fill="#8795a1">生成草稿 / 给方案</text>
  <text x="580" y="303" class="tiny" text-anchor="start" fill="#8795a1">不改现实</text>

  <text x="580" y="335" class="num" text-anchor="start" fill="#1f4e79">可创建草稿</text>
  <text x="720" y="335" class="small" text-anchor="start">项目助手 / 客户助手</text>
  <text x="580" y="358" class="tiny" text-anchor="start" fill="#8795a1">写邮件 / 写任务</text>
  <text x="580" y="378" class="tiny" text-anchor="start" fill="#8795a1">需本人确认才发</text>

  <text x="580" y="410" class="num" text-anchor="start" fill="#7c2d12">能发送 / 付款</text>
  <text x="720" y="410" class="small" text-anchor="start">财务助手</text>
  <text x="580" y="433" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">高影响动作 / 限额 + 留收据</text>

  <text x="580" y="465" class="num" text-anchor="start" fill="#7c2d12">能删除 / 发布</text>
  <text x="720" y="465" class="small" text-anchor="start">发布助手 / 整理助手</text>
  <text x="580" y="488" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不可逆 / 必须确认</text>

  <text x="580" y="538" class="label" text-anchor="start" fill="#7c2d12">异常</text>
  <line x1="580" y1="558" x2="960" y2="558" class="thin"/>
  <text x="580" y="588" class="tiny" text-anchor="start" fill="#7c2d12">"只建议"的助手为什么能直接发布？</text>
  <text x="580" y="611" class="tiny" text-anchor="start" fill="#7c2d12">"可创建草稿"的助手为什么有付款权？</text>
  <text x="580" y="634" class="tiny" text-anchor="start" fill="#7c2d12">一个停用的 Agent 为什么还有网盘权限？</text>

  <rect x="1020" y="140" width="500" height="600" class="box green"/>
  <text x="1270" y="180" class="label" text-anchor="middle">③ 替代图</text>
  <text x="1270" y="205" class="small" text-anchor="middle" fill="#1f4e79" font-weight="700">失效后谁来接</text>
  <line x1="1060" y1="225" x2="1500" y2="225" class="thin"/>

  <text x="1060" y="260" class="label" text-anchor="start">模型失效</text>
  <line x1="1060" y1="280" x2="1500" y2="280" class="thin"/>
  <text x="1060" y="310" class="small" text-anchor="start">哪些角色会一起停？</text>
  <text x="1060" y="333" class="small" text-anchor="start">研究 / 写作 / 摘要</text>
  <text x="1060" y="365" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">备选：另一款模型 / 离线</text>

  <text x="1060" y="405" class="label" text-anchor="start">平台失效</text>
  <line x1="1060" y1="425" x2="1500" y2="425" class="thin"/>
  <text x="1060" y="455" class="small" text-anchor="start">知识库 / 自动化 / 凭据</text>
  <text x="1060" y="478" class="small" text-anchor="start">客户关系 / 财务</text>
  <text x="1060" y="510" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">备选：自托管 / 另一供应商</text>

  <text x="1060" y="550" class="label" text-anchor="start">账户失效</text>
  <line x1="1060" y1="570" x2="1500" y2="570" class="thin"/>
  <text x="1060" y="600" class="small" text-anchor="start">封号 / 密码丢 / 设备坏</text>
  <text x="1060" y="623" class="small" text-anchor="start">创始人本人</text>
  <text x="1060" y="655" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">备选：应急访问 / 数字交接</text>

  <text x="1060" y="695" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">真实失败要多久才能恢复？</text>
  <text x="1060" y="718" class="tiny" text-anchor="start" fill="#8795a1">分钟 / 小时 / 数天 / 不可恢复</text>
</g>

<!-- 底部 -->
<rect x="60" y="770" width="1480" height="100" class="box muted"/>
<text x="800" y="810" class="label" text-anchor="middle">数字角色交接时也要留下 4 类东西：负责什么 / 未完成任务 / 使用了哪些资料规则 / 已执行和等待的外部动作</text>
<line x1="100" y1="830" x2="1500" y2="830" class="thin"/>
<text x="800" y="855" class="small" text-anchor="middle" fill="#7c2d12" font-weight="700">模型"思考过程"既不可靠也可能含敏感信息 → 清楚的业务状态比大段对话更有价值</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章 05.12 正文</text>
</svg>
