<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="430" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">主权从哪里来：六大基座</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">从物理资源到数字行动</text>
<rect x="40" y="100" width="120" height="120" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="100" y="152" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">能源</text>
<text x="100" y="184" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">电力与长期成本</text>
<line x1="161" y1="160" x2="179" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="180" y="100" width="120" height="120" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="240" y="152" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">算力</text>
<text x="240" y="184" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">芯片、云、集群</text>
<line x1="301" y1="160" x2="319" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="320" y="100" width="120" height="120" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="380" y="152" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">模型</text>
<text x="380" y="184" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">通用与专业智能</text>
<line x1="441" y1="160" x2="459" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="460" y="100" width="120" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="520" y="152" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">数据</text>
<text x="520" y="184" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">知识、反馈、评测</text>
<line x1="581" y1="160" x2="599" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="600" y="100" width="120" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="660" y="152" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">智能体</text>
<text x="660" y="184" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">身份、权限、刹车</text>
<line x1="721" y1="160" x2="739" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="740" y="100" width="120" height="120" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="800" y="152" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">协议与运行</text>
<text x="800" y="184" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">接口、控制面、退出</text>
<text x="40" y="258" font-size="13" text-anchor="start" font-weight="normal" fill="#555">灰色三块偏资源，白色三块偏行动；越往右，越接近“谁能让它停下来”</text>
<rect x="40" y="290" width="820" height="100" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="450" y="333" font-size="20" text-anchor="middle" font-weight="bold" fill="#111">AI 主权 ＝ 主权基座 × 主权能力 × 运行时控制</text>
<text x="450" y="366" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">有资产没能力，有能力没在运行中验证过，任何一项接近零，整体就接近零</text>
</svg>
