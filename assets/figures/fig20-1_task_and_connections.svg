<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="500" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">智能体按任务来管，连接按登记来管</text>
<rect x="40" y="90" width="270" height="280" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="40" y="90" width="270" height="40" rx="6" fill="#111"/>
<text x="175.0" y="115.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">一项任务</text>
<text x="56" y="158" font-size="14" text-anchor="start" font-weight="bold" fill="#111">谁发起，代表谁</text>
<text x="56" y="192" font-size="14" text-anchor="start" font-weight="bold" fill="#111">房卡</text>
<text x="56" y="212" font-size="12" text-anchor="start" font-weight="normal" fill="#555">能进哪个系统、做哪些操作、</text>
<text x="56" y="230" font-size="12" text-anchor="start" font-weight="normal" fill="#555">有效期到哪天、能不能转交</text>
<text x="56" y="262" font-size="14" text-anchor="start" font-weight="bold" fill="#111">任务单</text>
<text x="56" y="282" font-size="12" text-anchor="start" font-weight="normal" fill="#555">做到什么程度算完、谁验收、</text>
<text x="56" y="300" font-size="12" text-anchor="start" font-weight="normal" fill="#555">能用哪些工具、金额和次数上限</text>
<text x="56" y="332" font-size="14" text-anchor="start" font-weight="bold" fill="#111">停下找人</text>
<text x="56" y="352" font-size="12" text-anchor="start" font-weight="normal" fill="#555">碰到什么情况要回来问人</text>
<line x1="312" y1="230" x2="368" y2="230" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="220" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">领卡</text>
<rect x="370" y="180" width="170" height="100" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="455" y="214" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">智能体</text>
<text x="455" y="238" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">工作流里放确认点</text>
<text x="455" y="258" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">在沙箱里执行</text>
<rect x="610" y="100" width="110" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="665" y="133" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">MCP 网关</text>
<line x1="520" y1="178" x2="608" y2="140" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="560" y="148" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">MCP</text>
<rect x="770" y="90" width="90" height="36" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="815" y="113" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">工具</text>
<line x1="722" y1="128" x2="768" y2="108" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="770" y="134" width="90" height="36" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="815" y="157" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">数据源</text>
<line x1="722" y1="128" x2="768" y2="152" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="640" y="250" width="150" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="715" y="278" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">其他智能体</text>
<line x1="542" y1="260" x2="637" y2="270" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="637" y1="282" x2="542" y2="272" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="590" y="300" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">A2A</text>
<text x="590" y="316" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">分工、交接</text>
<rect x="370" y="330" width="490" height="40" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="615" y="355" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">登记每一根线：来源、版本、谁批准、哪些智能体能调、用谁的身份</text>
<text x="40" y="410" font-size="14" text-anchor="start" font-weight="bold" fill="#111">智能体的一生</text>
<rect x="40" y="424" width="128" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="104" y="449" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">登记上线</text>
<line x1="170" y1="444" x2="188" y2="444" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="190" y="424" width="128" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="254" y="449" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">运行和监控</text>
<line x1="320" y1="444" x2="338" y2="444" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="340" y="424" width="128" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="404" y="449" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">定期复审</text>
<line x1="470" y1="444" x2="488" y2="444" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="490" y="424" width="128" height="40" rx="6" fill="#bbb" stroke="#111" stroke-width="1.5"/>
<text x="554" y="449" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">退役</text>
<text x="640" y="438" font-size="12" text-anchor="start" font-weight="normal" fill="#555">撤销身份，关掉接口，</text>
<text x="640" y="456" font-size="12" text-anchor="start" font-weight="normal" fill="#555">解除下游依赖，把经验带回来</text>
</svg>
