<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="400" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一次合同审查要经过的五个环节</text>
<rect x="32" y="90" width="148" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="106.0" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 1 步</text>
<text x="106.0" y="142" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">备料</text>
<line x1="50" y1="156" x2="162" y2="156" stroke="#bbb" stroke-width="1"/>
<text x="106.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">合同、要求、</text>
<text x="106.0" y="200" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">对话、审查规则</text>
<text x="106.0" y="220" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">RAG 找相关材料</text>
<line x1="182" y1="165.0" x2="202" y2="165.0" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="205" y="90" width="148" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="279.0" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 2 步</text>
<text x="279.0" y="142" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">开机</text>
<line x1="223" y1="156" x2="335" y2="156" stroke="#bbb" stroke-width="1"/>
<text x="279.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">模型读材料，</text>
<text x="279.0" y="200" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">逐个 Token</text>
<text x="279.0" y="220" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">生成审查意见</text>
<line x1="355" y1="165.0" x2="375" y2="165.0" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="378" y="90" width="148" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="452.0" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 3 步</text>
<text x="452.0" y="142" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">厂房配合</text>
<line x1="396" y1="156" x2="508" y2="156" stroke="#bbb" stroke-width="1"/>
<text x="452.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">芯片、内存、</text>
<text x="452.0" y="200" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">网络、电力、</text>
<text x="452.0" y="220" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">冷却</text>
<line x1="528" y1="165.0" x2="548" y2="165.0" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="551" y="90" width="148" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="625.0" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 4 步</text>
<text x="625.0" y="142" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">排产</text>
<line x1="569" y1="156" x2="681" y2="156" stroke="#bbb" stroke-width="1"/>
<text x="625.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">谁先处理、</text>
<text x="625.0" y="200" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">哪些合批、</text>
<text x="625.0" y="220" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">是否交给小模型</text>
<line x1="701" y1="165.0" x2="721" y2="165.0" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="724" y="90" width="148" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="798.0" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 5 步</text>
<text x="798.0" y="142" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">验货</text>
<line x1="742" y1="156" x2="854" y2="156" stroke="#bbb" stroke-width="1"/>
<text x="798.0" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">事实核对、</text>
<text x="798.0" y="200" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">规则检查、</text>
<text x="798.0" y="220" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">必要时律师复核</text>
<rect x="24" y="80" width="856" height="170" rx="10" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="798.0" y1="250" x2="798.0" y2="298" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="723.0" y="300" width="150" height="46" rx="6" fill="#bbb" stroke="#111" stroke-width="1.5"/>
<text x="798.0" y="328" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">审查意见</text>
<text x="708.0" y="328" font-size="13" text-anchor="end" font-weight="normal" fill="#555">用户只看到这一段 →</text>
<text x="32" y="284" font-size="13" text-anchor="start" font-weight="normal" fill="#555">虚线框里的五步，用户看不到；它们可能分属五个不同的公司</text>
<text x="32" y="372" font-size="13" text-anchor="start" font-weight="normal" fill="#555">谁说了算：哪些材料进上下文，用哪个模型、在哪里运行，谁的请求排在前面，验货标准由谁定</text>
</svg>
