<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="460" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">作战手册：六个步骤，九十天</text>
<rect x="40" y="85" width="126" height="108" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="60" cy="105" r="11" fill="#111"/>
<text x="60" y="109.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="103" y="136" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">选任务</text>
<text x="103" y="160" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">先选任务，</text>
<text x="103" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">再选模型</text>
<line x1="167" y1="139" x2="177" y2="139" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="178" y="85" width="126" height="108" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="198" cy="105" r="11" fill="#111"/>
<text x="198" y="109.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="241" y="136" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">画任务图</text>
<text x="241" y="160" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">八类节点，</text>
<text x="241" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">每个节点标清</text>
<line x1="305" y1="139" x2="315" y2="139" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="316" y="85" width="126" height="108" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="336" cy="105" r="11" fill="#111"/>
<text x="336" y="109.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="379" y="136" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">最小控制面</text>
<text x="379" y="160" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">八组对应关系</text>
<text x="379" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">随时查得到</text>
<line x1="443" y1="139" x2="453" y2="139" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="454" y="85" width="126" height="108" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="474" cy="105" r="11" fill="#111"/>
<text x="474" y="109.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="517" y="136" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">评测代替演示</text>
<text x="517" y="160" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">六类测试，</text>
<text x="517" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">每次改动重跑</text>
<line x1="581" y1="139" x2="591" y2="139" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="592" y="85" width="126" height="108" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="612" cy="105" r="11" fill="#111"/>
<text x="612" y="109.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">5</text>
<text x="655" y="136" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">三本账</text>
<text x="655" y="160" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">每项任务成本</text>
<text x="655" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">每个验证结果成本</text>
<line x1="719" y1="139" x2="729" y2="139" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="730" y="85" width="126" height="108" rx="6" fill="#bbb" stroke="#111" stroke-width="1.5"/>
<circle cx="750" cy="105" r="11" fill="#111"/>
<text x="750" y="109.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">6</text>
<text x="793" y="136" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">设计退出</text>
<text x="793" y="160" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">第一天就画</text>
<text x="793" y="177" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">降级路径</text>
<path d="M796,195 V214 H103 V198" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="450" y="236" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">形成闭环：能交付、能衡量、能叫停、能替换</text>
<text x="40" y="278" font-size="14" text-anchor="start" font-weight="bold" fill="#111">九十天</text>
<rect x="42.0" y="292" width="122.15384615384616" height="40" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="103.07692307692308" y="318" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">发现</text>
<text x="103.07692307692308" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 1—2 周</text>
<text x="103.07692307692308" y="376" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">任务清单</text>
<text x="103.07692307692308" y="394" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">风险分级</text>
<text x="103.07692307692308" y="412" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">成本基线</text>
<rect x="168.15384615384616" y="292" width="248.3076923076923" height="40" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="1.5"/>
<text x="292.3076923076923" y="318" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">试点</text>
<text x="292.3076923076923" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 3—6 周</text>
<text x="292.3076923076923" y="376" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">三个最小可用版本</text>
<text x="292.3076923076923" y="394" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">黄金评测集、最小权限</text>
<rect x="420.46153846153845" y="292" width="248.30769230769226" height="40" rx="4" fill="#cccccc" stroke="#111" stroke-width="1.5"/>
<text x="544.6153846153845" y="318" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">生产</text>
<text x="544.6153846153845" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 7—10 周</text>
<text x="544.6153846153845" y="376" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">控制面、监控</text>
<text x="544.6153846153845" y="394" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">三本账、备用路径</text>
<rect x="672.7692307692307" y="292" width="185.23076923076928" height="40" rx="4" fill="#aaaaaa" stroke="#111" stroke-width="1.5"/>
<text x="765.3846153846154" y="318" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">推广</text>
<text x="765.3846153846154" y="352" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">第 11—13 周</text>
<text x="765.3846153846154" y="376" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">任务模板、资产沉淀</text>
<text x="765.3846153846154" y="394" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">治理规则</text>
<text x="40" y="444" font-size="13" text-anchor="start" font-weight="normal" fill="#555">九十天以后，公司层面的工作接着走第二十四章的一百八十天路线图</text>
</svg>
