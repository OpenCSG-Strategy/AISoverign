<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图2-0 第二章导读：模型走出工厂的四条扩散路径</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。第二章章序图：把"模型走出工厂"画成 4 条扩散路径 —— 同 1 个模型可以住在不同位置（云 / 蒸馏到端侧）、可以开不同接口（API / 权重 / 训练材料）、可以接入不同工具（聊天 / 知识库 / Agent）、可以组合不同主体（个人 / 部门 / 企业 / 政府）。理解这 4 条路径，才能回答"为什么能调用 ≠ 拥有 AI 能力"。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图2-0　第二章导读：模型走出工厂的四条扩散路径</text>
<text x="800" y="100" class="label" text-anchor="middle">同一个模型：可以住不同位置 / 开不同接口 / 接入不同工具 / 组合不同主体 —— 能力分配方式已经改变</text>

<!-- 中心：模型 -->
<rect x="660" y="380" width="280" height="140" class="box green"/>
<text x="800" y="425" class="label" text-anchor="middle">同一个模型</text>
<text x="800" y="455" class="small" text-anchor="middle" fill="#1f4e79" font-weight="700">训练完毕 · 权重 + 接口 + 文档</text>
<text x="800" y="485" class="small" text-anchor="middle">可以走 4 条路径</text>

<!-- 4 条路径 -->
<g>
  <!-- 1. 位置 -->
  <rect x="60" y="160" width="540" height="200" class="box accent"/>
  <text x="100" y="200" class="num" text-anchor="start">①</text>
  <text x="160" y="200" class="label" text-anchor="start">位置扩散</text>
  <line x1="100" y1="220" x2="560" y2="220" class="thin"/>
  <text x="100" y="250" class="small" text-anchor="start">云端公共模型 → 蒸馏 → 量化 → 端侧</text>
  <text x="100" y="280" class="small" text-anchor="start">· 手机 / 电脑 / 汽车 / IoT 设备</text>
  <text x="100" y="310" class="small" text-anchor="start">· 同一能力可在完全不同的物理形态</text>
  <text x="100" y="340" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">→ 02.1 / 02.5 移动 vs 工厂 + 本地 vs 云端</text>

  <!-- 2. 接口 -->
  <rect x="60" y="540" width="540" height="200" class="box warm"/>
  <text x="100" y="580" class="num" text-anchor="start">②</text>
  <text x="160" y="580" class="label" text-anchor="start">接口开放</text>
  <line x1="100" y1="600" x2="560" y2="600" class="thin"/>
  <text x="100" y="630" class="small" text-anchor="start">只开 API → 开权重 → 开训练材料</text>
  <text x="100" y="660" class="small" text-anchor="start">· 越往下游，能改的越多</text>
  <text x="100" y="690" class="small" text-anchor="start">· 越往下游，需要的能力也越多</text>
  <text x="100" y="720" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">→ 02.2 / 02.3 双前沿 + 能力谱系 + 开源</text>

  <!-- 3. 工具 -->
  <rect x="1000" y="160" width="540" height="200" class="box green"/>
  <text x="1040" y="200" class="num" text-anchor="start">③</text>
  <text x="1100" y="200" class="label" text-anchor="start">工具接入</text>
  <line x1="1040" y1="220" x2="1500" y2="220" class="thin"/>
  <text x="1040" y="250" class="small" text-anchor="start">聊天框 → 知识库 → 软件 API → Agent 循环</text>
  <text x="1040" y="280" class="small" text-anchor="start">· 模型是引擎，外面还有一整辆车</text>
  <text x="1040" y="310" class="small" text-anchor="start">· 工具组合决定可完成任务的边界</text>
  <text x="1040" y="340" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">→ 02.6 能力网络 / 02.7 从 Token 到行动</text>

  <!-- 4. 主体 -->
  <rect x="1000" y="540" width="540" height="200" class="box accent"/>
  <text x="1040" y="580" class="num" text-anchor="start">④</text>
  <text x="1100" y="580" class="label" text-anchor="start">主体组合</text>
  <line x1="1040" y1="600" x2="1500" y2="600" class="thin"/>
  <text x="1040" y="630" class="small" text-anchor="start">个人 → 部门 → 企业 → 行业 → 政府</text>
  <text x="1040" y="660" class="small" text-anchor="start">· 能力随主体放大</text>
  <text x="1040" y="690" class="small" text-anchor="start">· 责任链也随之变长</text>
  <text x="1040" y="720" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">→ 02.4 / 02.6 + 第二/三/四章 主体展开</text>
</g>

<!-- 中心到 4 个角的连接线 -->
<path d="M800,380 L420,360" class="thin"/>
<path d="M800,380 L420,640" class="thin"/>
<path d="M800,380 L1180,360" class="thin"/>
<path d="M800,380 L1180,640" class="thin"/>

<!-- 底部论断 -->
<rect x="60" y="770" width="1480" height="80" class="box muted"/>
<text x="800" y="805" class="label" text-anchor="middle" fill="#7c2d12">能调用某个模型 ≠ 拥有 AI 能力 —— 能力 = 4 条路径的实际展开</text>
<text x="800" y="833" class="small" text-anchor="middle">理解了 4 条路径，才能进入第三章：</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第二章章节导读</text>
</svg>
