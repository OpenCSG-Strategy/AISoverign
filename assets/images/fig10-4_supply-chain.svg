<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图10-4　开放供应链 5 项核验</text><text x="800" y="115" class="label" text-anchor="middle">下载一个开放模型，接入的是一整条供应链</text><rect x="60" y="180" width="270" height="100" class="box accent"/><text x="195.0" y="222" class="label" text-anchor="middle">① 发布者 + 许可证</text><text x="195.0" y="258" class="small" text-anchor="middle">可追溯 + 一致</text><rect x="350" y="180" width="270" height="100" class="box accent"/><text x="485.0" y="222" class="label" text-anchor="middle">② 哈希 + 版本</text><text x="485.0" y="258" class="small" text-anchor="middle">固定 hash + 锁版</text><rect x="640" y="180" width="270" height="100" class="box accent"/><text x="775.0" y="222" class="label" text-anchor="middle">③ 权重格式</text><text x="775.0" y="258" class="small" text-anchor="middle">safetensors / gguf</text><rect x="930" y="180" width="270" height="100" class="box accent"/><text x="1065.0" y="222" class="label" text-anchor="middle">④ 隔离首加载</text><text x="1065.0" y="258" class="small" text-anchor="middle">沙箱 + 最小权限</text><rect x="1220" y="180" width="270" height="100" class="box accent"/><text x="1355.0" y="222" class="label" text-anchor="middle">⑤ 依赖 + 漏洞</text><text x="1355.0" y="258" class="small" text-anchor="middle">来源 + 漏洞订阅</text><rect x="60" y="320" width="1480" height="110" class="box warm"/><text x="800.0" y="362" class="label" text-anchor="middle">评估不只看模型</text><text x="800.0" y="398" class="small" text-anchor="middle">还要看现实中获取算力、工具和专业材料的门槛——一个用于教育/文本的模型，与能帮助高风险操作的系统，需要不同发布判断</text><rect x="60" y="460" width="1480" height="90" class="box muted"/><text x="800.0" y="502" class="label" text-anchor="middle">与图3-9 作者身份链</text><text x="800.0" y="538" class="small" text-anchor="middle">下载者继承原作者的版本与许可责任——和「作者身份」一样，下载动作产生不可回避的责任归属</text><rect x="60" y="580" width="1480" height="200" class="box pink"/><text x="800.0" y="622" class="label" text-anchor="middle">5 项核验的典型失败</text><text x="800.0" y="658" class="small" text-anchor="middle">① 许可证二义性被忽略  ② 模型被无声升级  ③ Pickle 反序列化触发代码执行  ④ 漏洞未及时订阅  ⑤ 下载凭证被中间人劫持</text>
