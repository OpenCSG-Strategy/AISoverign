<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="640" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一个平均数怎样变成一笔债</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">澳大利亚"机器人追债"（Robodebt），二〇一五年起；左图为示意，不代表具体个案</text>
<line x1="60" y1="300" x2="420" y2="300" stroke="#111" stroke-width="1.5"/>
<line x1="60" y1="300" x2="60" y2="110" stroke="#111" stroke-width="1.5"/>
<rect x="184.0" y="156" width="22.0" height="144" rx="0" fill="#bbb" stroke="#111" stroke-width="1"/>
<rect x="214.0" y="156" width="22.0" height="144" rx="0" fill="#bbb" stroke="#111" stroke-width="1"/>
<rect x="244.0" y="156" width="22.0" height="144" rx="0" fill="#bbb" stroke="#111" stroke-width="1"/>
<line x1="60" y1="264.0" x2="420" y2="264.0" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
<text x="428" y="269.0" font-size="13" text-anchor="start" font-weight="bold" fill="#111">平均数</text>
<text x="240.0" y="322" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">每两周（一年）</text>
<text x="64" y="100" font-size="13" text-anchor="start" font-weight="normal" fill="#555">实际收入：季节工、临时工忽高忽低</text>
<text x="360" y="252.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">凭空造出的"收入"</text>
<text x="120" y="252.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">凭空造出的"收入"</text>
<rect x="520" y="82" width="340" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="690.0" y="110" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">税务部门记录的年度收入</text>
<line x1="690.0" y1="128" x2="690.0" y2="142" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="144" width="340" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="690.0" y="172" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">平均摊到每两周</text>
<line x1="690.0" y1="190" x2="690.0" y2="204" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="206" width="340" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="690.0" y="234" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">和申领人申报的收入对比</text>
<line x1="690.0" y1="252" x2="690.0" y2="266" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="268" width="340" height="44" rx="6" fill="#d4d4d4" stroke="#111" stroke-width="1.5"/>
<text x="690.0" y="296" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">推断"多领了补助"</text>
<line x1="690.0" y1="314" x2="690.0" y2="328" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="330" width="340" height="44" rx="6" fill="#d4d4d4" stroke="#111" stroke-width="1.5"/>
<text x="690.0" y="358" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">自动认定欠款，自动寄出催缴</text>
<line x1="690.0" y1="376" x2="690.0" y2="390" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="392" width="340" height="44" rx="6" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="690.0" y="420" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">当事人自己证明没有欠钱</text>
<text x="506" y="340" font-size="13" text-anchor="end" font-weight="normal" fill="#555">统计推断</text>
<text x="506" y="360" font-size="13" text-anchor="end" font-weight="normal" fill="#555">被当成事实执行 →</text>
<rect x="40" y="470" width="820" height="70" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="497" font-size="14" text-anchor="start" font-weight="bold" fill="#111">本该刹车却没起作用的地方</text>
<text x="60" y="523" font-size="13" text-anchor="start" font-weight="normal" fill="#111">人工核查退出了流程　·　异议没能及时让系统停下　·　法律上的质疑没有形成有效的刹车</text>
<text x="40" y="580" font-size="14" text-anchor="start" font-weight="bold" fill="#111">结果</text>
<text x="90" y="580" font-size="13" text-anchor="start" font-weight="normal" fill="#111">运行约五年，向数十万人发出债务通知；约四十七万笔后来被政府承认为非法提出；</text>
<text x="90" y="604" font-size="13" text-anchor="start" font-weight="normal" fill="#111">二〇二一年的和解退还、核销并赔偿约十八亿澳元</text>
</svg>
