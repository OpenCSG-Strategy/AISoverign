<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:34px;font-weight:700} .label{font-size:23px;font-weight:700} .small{font-size:18px} .tiny{font-size:15px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图2-1　一次请求，不等于一项任务</text><text x="800" y="115" class="label" text-anchor="middle">Request 只是入口；Task 还带着授权、工具、证据与补救路径</text><rect x="80" y="330" width="210" height="110" class="box accent"/><text x="185.0" y="372" class="label" text-anchor="middle">Request</text><text x="185.0" y="408" class="small" text-anchor="middle">一句输入</text><path d="M290,385 L415,385" class="line" marker-end="url(#arrow)"/><text x="352.5" y="373.0" class="tiny" text-anchor="middle">创建</text><rect x="420" y="300" width="250" height="170" class="box warm"/><text x="545.0" y="342" class="label" text-anchor="middle">Task</text><text x="545.0" y="378" class="small" text-anchor="middle">目标 · 状态 · 授权</text><path d="M670,345 L835,245" class="line" marker-end="url(#arrow)"/><text x="752.5" y="283.0" class="tiny" text-anchor="middle">执行</text><path d="M670,425 L835,525" class="line" marker-end="url(#arrow)"/><text x="752.5" y="463.0" class="tiny" text-anchor="middle">需批准</text><rect x="850" y="180" width="250" height="120" class="box green"/><text x="975.0" y="222" class="label" text-anchor="middle">运行中</text><text x="975.0" y="258" class="small" text-anchor="middle">调用工具 / 产生证据</text><rect x="850" y="465" width="250" height="120" class="box warm"/><text x="975.0" y="507" class="label" text-anchor="middle">等待批准</text><text x="975.0" y="543" class="small" text-anchor="middle">人或组织确认</text><path d="M1100,240 L1260,240" class="line" marker-end="url(#arrow)"/><text x="1180.0" y="228.0" class="tiny" text-anchor="middle">完成</text><path d="M1100,525 L1260,525" class="line" marker-end="url(#arrow)"/><text x="1180.0" y="513.0" class="tiny" text-anchor="middle">批准后继续</text><rect x="1270" y="180" width="230" height="120" class="box green"/><text x="1385.0" y="222" class="label" text-anchor="middle">完成</text><text x="1385.0" y="258" class="small" text-anchor="middle">结果可交付</text><rect x="1270" y="465" width="230" height="120" class="box muted"/><text x="1385.0" y="507" class="label" text-anchor="middle">失败 / 取消</text><text x="1385.0" y="543" class="small" text-anchor="middle">补救或退出</text><path d="M975,300 L975,465" class="line" marker-end="url(#arrow)"/><text x="975.0" y="370.5" class="tiny" text-anchor="middle">失败</text><text x="800" y="760" class="label" text-anchor="middle">可治理委托 = 任务边界清楚 + 状态可见 + 授权可撤 + 结果可复盘</text>
<text x="60" y="865" class="tiny">原创信息图 · v0.1 · 2026-08-03 · 适配单色印刷</text></svg>