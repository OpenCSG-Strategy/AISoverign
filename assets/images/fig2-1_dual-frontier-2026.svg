<rect x="800" y="580" width="350" height="240" class="box accent"/>
<text x="975" y="618" class="label" text-anchor="middle">Ministral 3</text>
<text x="975" y="645" class="tiny" text-anchor="middle">3B / 8B / 14B 端侧多模态</text>
<text x="975" y="695" class="num" text-anchor="middle">3B · 8B · 14B</text>
<text x="975" y="722" class="small" text-anchor="middle">稠密 + 图像理解</text>
<line x1="820" y1="745" x2="1130" y2="745" class="thin"/>
<text x="820" y="773" class="small">base / instruct / reasoning</text>
<text x="820" y="800" class="small">Apache 2.0 · 手机可跑</text>

<rect x="1170" y="580" width="370" height="240" class="box accent"/>
<text x="1355" y="618" class="label" text-anchor="middle">Apple 端侧基础模型</text>
<text x="1355" y="645" class="tiny" text-anchor="middle">摘要 / 实体抽取 / 短对话</text>
<text x="1355" y="695" class="num" text-anchor="middle">≈ 3B</text>
<text x="1355" y="722" class="small" text-anchor="middle">稀疏化 + 2-bit QAT</text>
<line x1="1190" y1="745" x2="1520" y2="745" class="thin"/>
<text x="1190" y="773" class="small">任务型能力切片</text>
<text x="1190" y="800" class="small">不搬云端通用模型进手机</text>

<text x="60" y="860" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 数据来源：Moonshot AI / Kimi K3 技术报告、DeepSeek V4 官方模型卡、Qwen3-ASR 论文、Gemma 3n 文档、Apple 端侧技术报告</text>
