<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图5-2　一套可搬走的个人智能栈</text><text x="800" y="115" class="label" text-anchor="middle">助手可以换,抽屉和笔记本还在;分层让每层都能被独立迁移</text><rect x="240" y="200" width="720" height="105" class="box accent"/><text x="600.0" y="242" class="label" text-anchor="middle">界面 / 行动权限</text><text x="600.0" y="278" class="small" text-anchor="middle">可拆卸,易更换</text><rect x="240" y="312" width="720" height="105" class="box muted"/><text x="600.0" y="354" class="label" text-anchor="middle">模型层</text><text x="600.0" y="390" class="small" text-anchor="middle">可替换的推理能力</text><rect x="240" y="424" width="720" height="105" class="box muted"/><text x="600.0" y="466" class="label" text-anchor="middle">工具 / 自动化</text><text x="600.0" y="502" class="small" text-anchor="middle">可调用的外部动作</text><rect x="240" y="536" width="720" height="105" class="box warm"/><text x="600.0" y="578" class="label" text-anchor="middle">身份 / 凭据</text><text x="600.0" y="614" class="small" text-anchor="middle">谁能用什么</text><rect x="240" y="648" width="720" height="105" class="box green"/><text x="600.0" y="690" class="label" text-anchor="middle">数据 / 记忆</text><text x="600.0" y="726" class="small" text-anchor="middle">原始资产与长期偏好</text><rect x="1060" y="640" width="200" height="120" class="box" fill="#1f4e79" stroke="#1f4e79" rx="18"/><text x="1160" y="695" class="label" text-anchor="middle">个人</text><text x="1160" y="725" class="tiny" text-anchor="middle">谁能换、谁能搬</text><path d="M960,517 L1060,680" class="line" marker-end="url(#arrow)"/><text x="990" y="590" class="tiny" text-anchor="middle">记忆</text><path d="M960,372 L1080,650" class="line" marker-end="url(#arrow)"/><text x="1010" y="510" class="tiny" text-anchor="middle">配置</text><path d="M960,300 L1090,640" class="line" marker-end="url(#arrow)"/><text x="1015" y="470" class="tiny" text-anchor="middle">凭据</text><path d="M960,228 L1100,630" class="line" marker-end="url(#arrow)"/><text x="1015" y="430" class="tiny" text-anchor="middle">记录</text><rect x="1300" y="200" width="260" height="60" class="box green"/><text x="1430.0" y="238.0" class="small" text-anchor="middle">导出自带</text><rect x="1300" y="280" width="260" height="60" class="box muted"/><text x="1430.0" y="318.0" class="small" text-anchor="middle">云服务可承担计算</text><rect x="1300" y="370" width="260" height="60" class="box" stroke="#8795a1" stroke-dasharray="6 4" fill="none" rx="14"/><text x="1430" y="408" class="small" text-anchor="middle">专有私有云等级</text><rect x="1300" y="445" width="260" height="60" class="box" stroke="#8795a1" stroke-dasharray="6 4" fill="none" rx="14"/><text x="1430" y="483" class="small" text-anchor="middle">平台绑定的内部关联</text><text x="1430" y="525" class="tiny" text-anchor="middle">(不可独立导出)</text><text x="60" y="800" class="small" text-anchor="start">实线 = 通用格式 / 可独立持有;虚线 = 平台绑定 / 不可独立导出</text>
