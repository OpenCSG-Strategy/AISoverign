<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="430" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一座城市的三种回流</text>
<rect x="330" y="70" width="240" height="54" rx="6" fill="#bbb" stroke="#111" stroke-width="1.5"/>
<text x="450" y="103" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">城市的 AI 公共投入</text>
<rect x="40" y="190" width="250" height="130" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="165.0" y="222" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">资源回流</text>
<text x="165.0" y="256" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">本地科研人员、企业和开发者</text>
<text x="165.0" y="277" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">更容易用上算力和模型，</text>
<text x="165.0" y="298" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">而不只是多一批闲置机柜</text>
<line x1="390" y1="126" x2="165.0" y2="187" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="325" y="190" width="250" height="130" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="450.0" y="222" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">资产回流</text>
<text x="450.0" y="256" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">项目结束后，留下本地能</text>
<text x="450.0" y="277" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">维护的代码、模型、测试集、</text>
<text x="450.0" y="298" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">数据产品和懂行的人</text>
<line x1="450" y1="126" x2="450.0" y2="187" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="610" y="190" width="250" height="130" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="735.0" y="222" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">价值回流</text>
<text x="735.0" y="256" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">产业收入、公共服务的改善、</text>
<text x="735.0" y="277" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">人才的成长，继续投进</text>
<text x="735.0" y="298" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">基础设施、教育科研和新企业</text>
<line x1="510" y1="126" x2="735.0" y2="187" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 860 255 L 880 255 L 880 97 L 574 97" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="872" y="150" font-size="13" text-anchor="end" font-weight="normal" fill="#555">再投入</text>
<text x="40" y="370" font-size="13" text-anchor="start" font-weight="normal" fill="#555">算力规模写得出一个大数字，却说明不了谁能用上、排多久的队、花了多少钱，</text>
<text x="40" y="392" font-size="13" text-anchor="start" font-weight="normal" fill="#555">更说明不了用完以后留下了什么</text>
</svg>
