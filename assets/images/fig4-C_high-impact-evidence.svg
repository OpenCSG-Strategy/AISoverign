<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">补图C　高影响决定的证据链</text><text x="800" y="115" class="label" text-anchor="middle">能解释结果，不等于能证明结果；受影响的人要有看见、纠正和申诉的路径</text><rect x="90" y="330" width="180" height="130" class="box accent"/><text x="180.0" y="372" class="label" text-anchor="middle">来源</text><text x="180.0" y="408" class="small" text-anchor="middle">原始材料</text><path d="M270,395 L295,395" class="line" marker-end="url(#arrow)"/><rect x="305" y="330" width="180" height="130" class="box accent"/><text x="395.0" y="372" class="label" text-anchor="middle">版本</text><text x="395.0" y="408" class="small" text-anchor="middle">模型 / 规则版本</text><path d="M485,395 L510,395" class="line" marker-end="url(#arrow)"/><rect x="520" y="330" width="180" height="130" class="box accent"/><text x="610.0" y="372" class="label" text-anchor="middle">推断</text><text x="610.0" y="408" class="small" text-anchor="middle">形成了什么判断</text><path d="M700,395 L725,395" class="line" marker-end="url(#arrow)"/><rect x="735" y="330" width="180" height="130" class="box accent"/><text x="825.0" y="372" class="label" text-anchor="middle">专业复核</text><text x="825.0" y="408" class="small" text-anchor="middle">谁检查过</text><path d="M915,395 L940,395" class="line" marker-end="url(#arrow)"/><rect x="950" y="330" width="180" height="130" class="box warm"/><text x="1040.0" y="372" class="label" text-anchor="middle">通知</text><text x="1040.0" y="408" class="small" text-anchor="middle">影响如何告知</text><path d="M1130,395 L1155,395" class="line" marker-end="url(#arrow)"/><rect x="1165" y="330" width="180" height="130" class="box warm"/><text x="1255.0" y="372" class="label" text-anchor="middle">申诉 / 纠正</text><text x="1255.0" y="408" class="small" text-anchor="middle">如何改结果</text><path d="M1345,395 L1370,395" class="line" marker-end="url(#arrow)"/><rect x="1380" y="330" width="180" height="130" class="box warm"/><text x="1470.0" y="372" class="label" text-anchor="middle">删除 / 保留</text><text x="1470.0" y="408" class="small" text-anchor="middle">证据留多久</text><text x="800" y="650" class="label" text-anchor="middle">关键缺口不是“有没有一个分数”，而是能否沿链条回到原始证据并改变结果</text><text x="800" y="730" class="small" text-anchor="middle">不保存无必要的完整思维轨迹；保存足以复盘行动、版本、来源和责任的证据</text>
