<text x="532" y="284" font-size="10" text-anchor="middle" font-weight="normal" fill="#555">沙箱</text>
<line x1="675" y1="236" x2="625" y2="268" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
