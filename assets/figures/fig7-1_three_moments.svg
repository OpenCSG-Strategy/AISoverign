<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="450" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">进入、使用、离开三个时刻</text>
<rect x="40" y="70" width="255" height="48" rx="6" fill="#111"/>
<text x="167.5" y="101" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">进入</text>
<line x1="298" y1="94" x2="322" y2="94" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="130" width="255" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="58" y="156" font-size="13" text-anchor="start" font-weight="normal" fill="#555">要做到</text>
<text x="58" y="186" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 知道自己接受了什么</text>
<text x="58" y="214" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 有没有别的选择</text>
<rect x="40" y="292" width="255" height="100" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="58" y="318" font-size="13" text-anchor="start" font-weight="normal" fill="#555">常见的坑</text>
<text x="58" y="344" font-size="14" text-anchor="start" font-weight="normal" fill="#111">免费试用把门槛降到零，</text>
<text x="58" y="366" font-size="14" text-anchor="start" font-weight="normal" fill="#111">退出代价写在很后面</text>
<rect x="325" y="70" width="255" height="48" rx="6" fill="#111"/>
<text x="452.5" y="101" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">使用</text>
<line x1="583" y1="94" x2="607" y2="94" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<rect x="325" y="130" width="255" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="343" y="156" font-size="13" text-anchor="start" font-weight="normal" fill="#555">要做到</text>
<text x="343" y="186" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 看得见系统在做什么</text>
<text x="343" y="214" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 能限制它的权力</text>
<text x="343" y="242" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 规则改变时能提出异议</text>
<rect x="325" y="292" width="255" height="100" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="343" y="318" font-size="13" text-anchor="start" font-weight="normal" fill="#555">常见的坑</text>
<text x="343" y="344" font-size="14" text-anchor="start" font-weight="normal" fill="#111">权限一次次扩大，</text>
<text x="343" y="366" font-size="14" text-anchor="start" font-weight="normal" fill="#111">只靠更新条款来通知</text>
<rect x="610" y="70" width="255" height="48" rx="6" fill="#111"/>
<text x="737.5" y="101" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">离开</text>
<rect x="610" y="130" width="255" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="628" y="156" font-size="13" text-anchor="start" font-weight="normal" fill="#555">要做到</text>
<text x="628" y="186" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 能带走自己的东西</text>
<text x="628" y="214" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 能恢复基本工作能力</text>
<text x="628" y="242" font-size="15" text-anchor="start" font-weight="normal" fill="#111">· 不因离开受不合理惩罚</text>
<rect x="610" y="292" width="255" height="100" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="628" y="318" font-size="13" text-anchor="start" font-weight="normal" fill="#555">常见的坑</text>
<text x="628" y="344" font-size="14" text-anchor="start" font-weight="normal" fill="#111">导出来的是一堆</text>
<text x="628" y="366" font-size="14" text-anchor="start" font-weight="normal" fill="#111">别处读不懂的文件</text>
<text x="40" y="430" font-size="13" text-anchor="start" font-weight="normal" fill="#555">离开也可能以另一种方式到来：系统自己坏了</text>
</svg>
