<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="450" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">买产品、买机器、拿图纸</text>
<rect x="40" y="85" width="255" height="260" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="229" y="98" width="32" height="28" rx="2" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="229" y1="108" x2="261" y2="108" stroke="#111" stroke-width="1.5"/>
<text x="62" y="118" font-size="20" text-anchor="start" font-weight="bold" fill="#111">买产品</text>
<text x="62" y="148" font-size="14" text-anchor="start" font-weight="normal" fill="#555">用云端接口（API）</text>
<line x1="62" y1="164" x2="273" y2="164" stroke="#555" stroke-width="1"/>
<text x="62" y="196" font-size="15" text-anchor="start" font-weight="normal" fill="#111">拿到的是结果</text>
<text x="62" y="224" font-size="15" text-anchor="start" font-weight="normal" fill="#111">设备在别人手里</text>
<text x="62" y="252" font-size="15" text-anchor="start" font-weight="normal" fill="#111">改价、换版本、调规则</text>
<text x="62" y="280" font-size="15" text-anchor="start" font-weight="normal" fill="#111">由对方决定</text>
<line x1="297" y1="215" x2="318" y2="215" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="320" y="85" width="255" height="260" rx="6" fill="#eeeeee" stroke="#111" stroke-width="1.5"/>
<rect x="505" y="98" width="40" height="28" rx="3" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="525" cy="112" r="7" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="342" y="118" font-size="20" text-anchor="start" font-weight="bold" fill="#111">买机器</text>
<text x="342" y="148" font-size="14" text-anchor="start" font-weight="normal" fill="#555">拿到开放权重</text>
<line x1="342" y1="164" x2="553" y2="164" stroke="#555" stroke-width="1"/>
<text x="342" y="196" font-size="15" text-anchor="start" font-weight="normal" fill="#111">可下载、运行、</text>
<text x="342" y="224" font-size="15" text-anchor="start" font-weight="normal" fill="#111">检查、改装</text>
<text x="342" y="252" font-size="15" text-anchor="start" font-weight="normal" fill="#111">未必知道怎么训练出来</text>
<text x="342" y="280" font-size="15" text-anchor="start" font-weight="normal" fill="#111">自己造不出第二台</text>
<line x1="577" y1="215" x2="598" y2="215" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="600" y="85" width="255" height="260" rx="6" fill="#d6d6d6" stroke="#111" stroke-width="1.5"/>
<rect x="785" y="98" width="40" height="28" rx="1" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="795" y1="98" x2="795" y2="126" stroke="#555" stroke-width="0.8"/>
<line x1="805" y1="98" x2="805" y2="126" stroke="#555" stroke-width="0.8"/>
<line x1="815" y1="98" x2="815" y2="126" stroke="#555" stroke-width="0.8"/>
<line x1="785" y1="112" x2="825" y2="112" stroke="#555" stroke-width="0.8"/>
<text x="622" y="118" font-size="20" text-anchor="start" font-weight="bold" fill="#111">拿图纸</text>
<text x="622" y="148" font-size="14" text-anchor="start" font-weight="normal" fill="#555">更完整的开源</text>
<line x1="622" y1="164" x2="833" y2="164" stroke="#555" stroke-width="1"/>
<text x="622" y="196" font-size="15" text-anchor="start" font-weight="normal" fill="#111">权重之外，还公开</text>
<text x="622" y="224" font-size="15" text-anchor="start" font-weight="normal" fill="#111">训练代码、数据说明</text>
<text x="622" y="252" font-size="15" text-anchor="start" font-weight="normal" fill="#111">和中间版本</text>
<text x="622" y="280" font-size="15" text-anchor="start" font-weight="normal" fill="#111">连图纸和工艺一起给你</text>
<line x1="40" y1="378" x2="855" y2="378" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="405" font-size="13" text-anchor="start" font-weight="normal" fill="#555">往右，拿到的越多，能做的越多 →</text>
<text x="40" y="428" font-size="13" text-anchor="start" font-weight="normal" fill="#555">开放把权利交给使用者，也把打补丁、查恶意代码、守许可证、故障恢复的责任一起交了过去</text>
</svg>
