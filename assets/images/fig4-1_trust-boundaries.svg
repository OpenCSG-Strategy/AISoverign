<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:34px;font-weight:700} .label{font-size:23px;font-weight:700} .small{font-size:18px} .tiny{font-size:15px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none} .redline{stroke:#b91c1c;stroke-width:4;stroke-dasharray:10 8;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图4-1　一项任务会跨过多个信任边界</text><text x="800" y="115" class="label" text-anchor="middle">学校用 AI 帮助分析作文,一次看似简单的批改已跨过五个边界</text><rect x="200" y="180" width="1340" height="110" class="box muted" rx="14"/><text x="230" y="225" class="label" text-anchor="start">成员(学生)</text><text x="230" y="260" class="tiny" text-anchor="start">原始与受影响方</text><rect x="200" y="298" width="1340" height="110" class="box green" rx="14"/><text x="230" y="343" class="label" text-anchor="start">组织(学校)</text><text x="230" y="378" class="tiny" text-anchor="start">受托关系中</text><rect x="200" y="416" width="1340" height="110" class="box accent" rx="14"/><text x="230" y="461" class="label" text-anchor="start">供应商(语言模型)</text><text x="230" y="496" class="tiny" text-anchor="start">数据流节点</text><rect x="200" y="534" width="1340" height="110" class="box accent" rx="14"/><text x="230" y="579" class="label" text-anchor="start">供应商(内容安全)</text><text x="230" y="614" class="tiny" text-anchor="start">数据流节点</text><rect x="200" y="652" width="1340" height="110" class="box warm" rx="14"/><text x="230" y="697" class="label" text-anchor="start">外部工具与门户</text><text x="230" y="732" class="tiny" text-anchor="start">行动渠道</text><text x="380" y="165" class="label" text-anchor="middle">数据</text><text x="670" y="165" class="label" text-anchor="middle">权限</text><text x="960" y="165" class="label" text-anchor="middle">推断</text><text x="1250" y="165" class="label" text-anchor="middle">责任</text><path d="M540,290 L540,400" class="line" marker-end="url(#arrow)"/><text x="560" y="350" class="tiny" text-anchor="start">提交作文</text><path d="M830,400 L830,510" class="line" marker-end="url(#arrow)"/><text x="850" y="460" class="tiny" text-anchor="start">合同授权</text><path d="M1120,510 L1120,620" class="line" marker-end="url(#arrow)"/><text x="1140" y="570" class="tiny" text-anchor="start">风险标签</text><path d="M1410,730 L1410,620" class="line" marker-end="url(#arrow)"/><text x="1320" y="690" class="tiny" text-anchor="end">家长门户收到</text><path d="M1410,400 L1410,290" class="line" marker-end="url(#arrow)"/><text x="1430" y="350" class="tiny" text-anchor="start">教师反馈</text><text x="800" y="825" class="label" text-anchor="middle">每个节点只看见自己职责所需的视图;数据流 ≠ 责任流</text>
<text x="60" y="865" class="tiny">原创信息图 · v0.1 · 2026-08-03 · 适配单色印刷</text></svg>