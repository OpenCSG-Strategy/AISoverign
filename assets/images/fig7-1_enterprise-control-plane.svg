text x="1175.0" y="452" class="label" text-anchor="middle">凭证</text><text x="1175.0" y="488" class="small" text-anchor="middle">发生了什么</text><rect x="1315" y="410" width="220" height="140" class="box muted"/><text x="1425.0" y="452" class="label" text-anchor="middle">成本</text><text x="1425.0" y="488" class="small" text-anchor="middle">用了多少资源</text><text x="800" y="395" class="label" text-anchor="middle">能力 / 治理面</text><path d="M390,290 L425,410" class="line" marker-end="url(#arrow)"/><path d="M800,290 L925,410" class="line" marker-end="url(#arrow)"/><path d="M1210,290 L1175,410" class="line" marker-end="url(#arrow)"/><text x="380" y="360" class="tiny" text-anchor="middle">落地</text><text x="865" y="360" class="tiny" text-anchor="middle">落地</text><text x="1190" y="360" class="tiny" text-anchor="middle">落地</text><path d="M175,550 L245,690" class="dash" marker-end="url(#arrow)"/><path d="M425,550 L615,690" class="dash" marker-end="url(#arrow)"/><path d="M675,550 L615,690" class="dash" marker-end="url(#arrow)"/><path d="M925,550 L985,690" class="dash" marker-end="url(#arrow)"/><path d="M1175,550 L1355,690" class="dash" marker-end="url(#arrow)"/><path d="M1425,550 L1355,690" class="dash" marker-end="url(#arrow)"/><rect x="80" y="690" width="330" height="140" fill="#f0eee8" stroke="#8795a1" stroke-width="3" stroke-dasharray="12 10" rx="18"/><text x="245" y="732" class="label" text-anchor="middle">模型</text><text x="245" y="768" class="small" text-anchor="middle">通用·专业·开源</text><rect x="450" y="690" width="330" height="140" fill="#f0eee8" stroke="#8795a1" stroke-width="3" stroke-dasharray="12 10" rx="18"/><text x="615" y="732" class="label" text-anchor="middle">算力</text><text x="615" y="768" class="small" text-anchor="middle">云·本地·边缘</text><rect x="820" y="690" width="330" height="140" fill="#f0eee8" stroke="#8795a1" stroke-width="3" stroke-dasharray="12 10" rx="18"/><text x="985" y="732" class="label" text-anchor="middle">数据</text><text x="985" y="768" class="small" text-anc