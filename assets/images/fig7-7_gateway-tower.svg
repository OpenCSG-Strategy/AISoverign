<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图7-7 模型网关 — 5 步请求 + 备用模型</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"模型网关"画成机场塔台比喻：5 步请求（身份→数据级别→模型选择→脱敏→记录），加上 4 项治理能力（路由 / 边界 / 比较 / 追溯）+ 备用模型必须真的跑过的 4 项要求。网关的价值来自降低替换成本，不是增加不可离开的中心。数据来源：第七章正文 07.6。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:30px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图7-7　模型网关 — 像机场塔台一样</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">应用不再自己决定去哪里 — 网关是受控入口</text>

<!-- 中部：5 步请求流程 -->
<g>
  <line x1="60" y1="125" x2="1540" y2="125" class="line"/>
  <text x="800" y="160" class="label" text-anchor="middle">一次请求怎样穿过网关（员工总结客户合同）</text>

  <!-- 5 步 -->
  <rect x="60"  y="190" width="280" height="100" class="box accent"/>
  <text x="100" y="230" class="num" text-anchor="start" fill="#1f4e79">①</text>
  <text x="155" y="230" class="label" text-anchor="start">身份 + 任务</text>
  <text x="100" y="260" class="small" text-anchor="start">员工身份 / 部门</text>
  <text x="100" y="280" class="small" text-anchor="start">任务类型识别</text>

  <line x1="340" y1="240" x2="395" y2="240" class="line" marker-end="url(#arrow)"/>

  <rect x="400" y="190" width="280" height="100" class="box accent"/>
  <text x="440" y="230" class="num" text-anchor="start" fill="#1f4e79">②</text>
  <text x="495" y="230" class="label" text-anchor="start">数据级别</text>
  <text x="440" y="260" class="small" text-anchor="start">权限 / 商业机密</text>
  <text x="440" y="280" class="small" text-anchor="start">排除不允许的外部模型</text>

  <line x1="680" y1="240" x2="735" y2="240" class="line" marker-end="url(#arrow)"/>

  <rect x="740" y="190" width="280" height="100" class="box accent"/>
  <text x="780" y="230" class="num" text-anchor="start" fill="#1f4e79">③</text>
  <text x="835" y="230" class="label" text-anchor="start">选择模型</text>
  <text x="780" y="260" class="small" text-anchor="start">经批准的模型</text>
  <text x="780" y="280" class="small" text-anchor="start">限流 / 路由</text>

  <line x1="1020" y1="240" x2="1075" y2="240" class="line" marker-end="url(#arrow)"/>

  <rect x="1080" y="190" width="280" height="100" class="box accent"/>
  <text x="1120" y="230" class="num" text-anchor="start" fill="#1f4e79">④</text>
  <text x="1175" y="230" class="label" text-anchor="start">脱敏 + 限流</text>
  <text x="1120" y="260" class="small" text-anchor="start">遮蔽不必要 PII</text>
  <text x="1120" y="280" class="small" text-anchor="start">限流防止滥用</text>

  <line x1="1360" y1="240" x2="1415" y2="240" class="line" marker-end="url(#arrow)"/>

  <rect x="1415" y="190" width="125" height="100" class="box green"/>
  <text x="1477" y="225" class="label" text-anchor="middle">⑤</text>
  <text x="1477" y="255" class="small" text-anchor="middle">记录</text>
  <text x="1477" y="275" class="small" text-anchor="middle">版本</text>

  <rect x="1415" y="295" width="125" height="80" class="box green"/>
  <text x="1477" y="320" class="small" text-anchor="middle">耗时</text>
  <text x="1477" y="345" class="small" text-anchor="middle">标识</text>
  <text x="1477" y="365" class="small" text-anchor="middle">成本</text>
</g>

<!-- 下半：4 项治理能力 + 备用模型 -->
<g>
  <line x1="60" y1="410" x2="1540" y2="410" class="line"/>
  <text x="800" y="445" class="label" text-anchor="middle">网关让企业获得的 4 项治理能力</text>

  <rect x="60"  y="470" width="350" height="120" class="box green"/>
  <text x="100" y="505" class="label" text-anchor="start" fill="#1f4e79">① 知道谁在使用</text>
  <text x="100" y="535" class="small" text-anchor="start">· 统一身份 + 任务</text>
  <text x="100" y="560" class="small" text-anchor="start">· 不再有孤立调用</text>

  <rect x="425" y="470" width="350" height="120" class="box green"/>
  <text x="465" y="505" class="label" text-anchor="start" fill="#1f4e79">② 按任务选择</text>
  <text x="465" y="535" class="small" text-anchor="start">· 数据级别 → 模型匹配</text>
  <text x="465" y="560" class="small" text-anchor="start">· 不一刀切</text>

  <rect x="790" y="470" width="350" height="120" class="box green"/>
  <text x="830" y="505" class="label" text-anchor="start" fill="#1f4e79">③ 统一执行边界</text>
  <text x="830" y="535" class="small" text-anchor="start">· 限流 / 脱敏 / 禁止</text>
  <text x="830" y="560" class="small" text-anchor="start">· 不散落在各应用</text>

  <rect x="1155" y="470" width="385" height="120" class="box green"/>
  <text x="1195" y="505" class="label" text-anchor="start" fill="#1f4e79">④ 比较 + 追溯</text>
  <text x="1195" y="535" class="small" text-anchor="start">· 成本 / 延迟 / 质量对比</text>
  <text x="1195" y="560" class="small" text-anchor="start">· 出现事故能还原</text>
</g>

<!-- 备用模型要求 -->
<g>
  <line x1="60" y1="620" x2="1540" y2="620" class="line"/>
  <text x="800" y="655" class="label" text-anchor="middle" fill="#7c2d12">"备用模型必须真的跑过"</text>
  <text x="800" y="685" class="small" text-anchor="middle">采购文件写"支持多模型" ≠ 系统可以切换</text>

  <rect x="60"  y="710" width="730" height="160" class="box warm"/>
  <text x="100" y="748" class="label" text-anchor="start" fill="#7c2d12">4 项要求</text>
  <text x="100" y="780" class="small" text-anchor="start">· 定期让备用模型跑同一套真实评测</text>
  <text x="100" y="805" class="small" text-anchor="start">· 承担一小部分低风险流量</text>
  <text x="100" y="830" class="small" text-anchor="start">· 差异在平时暴露 — 不在事故当天</text>
  <text x="100" y="855" class="small" text-anchor="start">· 不必达到主模型全部能力，但关键业务可降级继续</text>

  <rect x="810" y="710" width="730" height="160" class="box red"/>
  <text x="850" y="748" class="label" text-anchor="start" fill="#7c2d12">网关也有边界</text>
  <text x="850" y="780" class="small" text-anchor="start">· 只有实际经过网关的调用才受规则约束</text>
  <text x="850" y="805" class="small" text-anchor="start">· 应用自身的用户权限和业务校验仍要保留</text>
  <text x="850" y="835" class="small" text-anchor="start" fill="#7c2d12">否则团队可绕过入口直接访问模型</text>
  <text x="850" y="860" class="small" text-anchor="start" fill="#1f4e79">价值来自降低替换成本，不是增加不可离开的中心</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第七章正文 07.6</text>
</svg>
