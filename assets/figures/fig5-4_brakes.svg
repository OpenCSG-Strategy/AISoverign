<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="300" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">刹车分五档</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">从轻到重；停止开关放在出问题的智能体够不着的地方，并有明确的人有权按下</text>
<rect x="40" y="110" width="150" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="115" y="145" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">第 1 档</text>
<text x="115" y="172" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">停掉一个工具</text>
<line x1="192" y1="155" x2="206" y2="155" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="208" y="110" width="150" height="90" rx="6" fill="#eaeaea" stroke="#111" stroke-width="1.5"/>
<text x="283" y="145" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">第 2 档</text>
<text x="283" y="172" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">收回高风险权限</text>
<line x1="360" y1="155" x2="374" y2="155" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="376" y="110" width="150" height="90" rx="6" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
<text x="451" y="145" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">第 3 档</text>
<text x="451" y="172" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">降为只提建议</text>
<line x1="528" y1="155" x2="542" y2="155" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="544" y="110" width="150" height="90" rx="6" fill="#9a9a9a" stroke="#111" stroke-width="1.5"/>
<text x="619" y="145" font-size="13" text-anchor="middle" font-weight="normal" fill="#fff">第 4 档</text>
<text x="619" y="172" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">切到备用方案</text>
<line x1="696" y1="155" x2="710" y2="155" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="712" y="110" width="150" height="90" rx="6" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="787" y="145" font-size="13" text-anchor="middle" font-weight="normal" fill="#fff">第 5 档</text>
<text x="787" y="172" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">全部停止，交给人</text>
<line x1="40" y1="235" x2="870" y2="235" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="262" font-size="13" text-anchor="start" font-weight="normal" fill="#555">影响越来越大，恢复越来越慢 →</text>
</svg>
