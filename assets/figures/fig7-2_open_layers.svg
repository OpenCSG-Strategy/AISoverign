<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="640" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">开放的几个层次</text>
<text x="40" y="80" font-size="15" text-anchor="start" font-weight="bold" fill="#111">"开放"是一组权利，可以一项项拆开检查</text>
<rect x="40" y="98" width="90" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="85.0" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">看</text>
<rect x="147" y="98" width="190" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="242.0" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">在自己的机器上跑</text>
<rect x="354" y="98" width="90" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="399.0" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">改</text>
<rect x="461" y="98" width="110" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="516.0" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">再分发</text>
<rect x="588" y="98" width="200" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="688.0" y="127" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">参与决定项目方向</text>
<text x="40" y="192" font-size="15" text-anchor="start" font-weight="bold" fill="#111">三种拿到模型的方式（见第二章）</text>
<rect x="40" y="208" width="255" height="160" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="58" y="238" font-size="16" text-anchor="start" font-weight="bold" fill="#111">用云端接口</text>
<text x="277" y="238" font-size="12" text-anchor="end" font-weight="normal" fill="#555">像买产品</text>
<text x="58" y="272" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 拿到的是结果</text>
<text x="58" y="298" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 设备在别人手里</text>
<text x="58" y="324" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 改价、换版本由厂商定</text>
<line x1="297" y1="288" x2="318" y2="288" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="320" y="208" width="255" height="160" rx="6" fill="#e2e2e2" stroke="#111" stroke-width="1.5"/>
<text x="338" y="238" font-size="16" text-anchor="start" font-weight="bold" fill="#111">拿到开放权重</text>
<text x="557" y="238" font-size="12" text-anchor="end" font-weight="normal" fill="#555">像买下一台机器</text>
<text x="338" y="272" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 可以下载、运行、改装</text>
<text x="338" y="298" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 可以固定版本</text>
<text x="338" y="324" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 训练过程往往说不全</text>
<line x1="577" y1="288" x2="598" y2="288" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="600" y="208" width="255" height="160" rx="6" fill="#bdbdbd" stroke="#111" stroke-width="1.5"/>
<text x="618" y="238" font-size="16" text-anchor="start" font-weight="bold" fill="#111">更完整的开源</text>
<text x="837" y="238" font-size="12" text-anchor="end" font-weight="normal" fill="#555">连图纸和工艺一起给</text>
<text x="618" y="272" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 训练代码、数据说明、</text>
<text x="618" y="298" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 中间版本也公开</text>
<text x="618" y="324" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 可以自己维护</text>
<text x="40" y="396" font-size="13" text-anchor="start" font-weight="normal" fill="#555">越往右，你能自己做的越多，要自己担的责任也越多</text>
<rect x="40" y="412" width="820" height="48" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="450" y="442" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">拿到了复制的权利，离真正有复制的能力还很远（复现训练仍要大量算力和专业人员）</text>
<text x="40" y="498" font-size="15" text-anchor="start" font-weight="bold" fill="#111">检验开放算不算数：回到"离开"</text>
<rect x="40" y="514" width="255" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="167" y="553" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">原维护者不干了，</text>
<text x="167" y="575" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">社区能接手发布和修复吗？</text>
<rect x="320" y="514" width="255" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="447" y="553" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">换一个云平台，</text>
<text x="447" y="575" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">模型和工作流能继续跑吗？</text>
<rect x="600" y="514" width="255" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="727" y="542" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">不同意主流路线的人，</text>
<text x="727" y="564" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">能在法律和技术上</text>
<text x="727" y="586" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">另起炉灶吗？</text>
</svg>
