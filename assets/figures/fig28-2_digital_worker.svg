<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="440" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一份数字员工档案，和它的一生</text>
<rect x="40" y="85" width="440" height="300" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="40" y="85" width="440" height="40" rx="6" fill="#111"/>
<text x="260.0" y="110.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">数字员工档案</text>
<text x="60" y="152" font-size="14" text-anchor="start" font-weight="bold" fill="#111">身份</text>
<text x="140" y="152" font-size="13" text-anchor="start" font-weight="normal" fill="#111">自己的身份，不借员工账号和管理密钥</text>
<text x="60" y="185" font-size="14" text-anchor="start" font-weight="bold" fill="#111">权限</text>
<text x="140" y="185" font-size="13" text-anchor="start" font-weight="normal" fill="#111">看什么、做什么、多久失效、能否转交</text>
<text x="60" y="218" font-size="14" text-anchor="start" font-weight="bold" fill="#111">预算</text>
<text x="140" y="218" font-size="13" text-anchor="start" font-weight="normal" fill="#111">钱、工具调用、算力，用完就停</text>
<line x1="60" y1="231" x2="460" y2="231" stroke="#bbb" stroke-width="1"/>
<text x="60" y="251" font-size="13" text-anchor="start" font-weight="normal" fill="#555">何时问人</text>
<text x="140" y="251" font-size="12" text-anchor="start" font-weight="normal" fill="#555">哪些情况必须回来找人</text>
<text x="60" y="284" font-size="13" text-anchor="start" font-weight="normal" fill="#555">何时失效</text>
<text x="140" y="284" font-size="12" text-anchor="start" font-weight="normal" fill="#555">到期自动作废</text>
<text x="60" y="317" font-size="13" text-anchor="start" font-weight="normal" fill="#555">当前版本</text>
<text x="140" y="317" font-size="12" text-anchor="start" font-weight="normal" fill="#555">正在跑的是哪个版本</text>
<text x="60" y="350" font-size="13" text-anchor="start" font-weight="normal" fill="#555">最近评测</text>
<text x="140" y="350" font-size="12" text-anchor="start" font-weight="normal" fill="#555">最近一次评测的结果</text>
<path d="M470,138 h0" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="470" y="178" font-size="1" text-anchor="start" font-weight="normal" fill="#111"></text>
<text x="540" y="100" font-size="14" text-anchor="start" font-weight="bold" fill="#111">和员工一样走完整流程</text>
<rect x="540" y="116" width="320" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="556" y="138" font-size="14" text-anchor="start" font-weight="bold" fill="#111">上线要登记</text>
<text x="556" y="157" font-size="12" text-anchor="start" font-weight="normal" fill="#555">负责人、服务的任务、身份、权限、预算</text>
<line x1="700" y1="168" x2="700" y2="180" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="540" y="182" width="320" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="556" y="204" font-size="14" text-anchor="start" font-weight="bold" fill="#111">权限定期复核</text>
<text x="556" y="223" font-size="12" text-anchor="start" font-weight="normal" fill="#555">能看什么、能做什么、多久失效</text>
<line x1="700" y1="234" x2="700" y2="246" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="540" y="248" width="320" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="556" y="270" font-size="14" text-anchor="start" font-weight="bold" fill="#111">表现持续评估</text>
<text x="556" y="289" font-size="12" text-anchor="start" font-weight="normal" fill="#555">看结果，也看资源、出错和人工介入</text>
<line x1="700" y1="300" x2="700" y2="312" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="540" y="314" width="320" height="50" rx="6" fill="#bbb" stroke="#111" stroke-width="1.5"/>
<text x="556" y="336" font-size="14" text-anchor="start" font-weight="bold" fill="#111">正式退役</text>
<text x="556" y="355" font-size="12" text-anchor="start" font-weight="normal" fill="#555">撤销身份，收回凭证，留下经验</text>
<rect x="40" y="395" width="820" height="30" rx="4" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="450" y="415" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">最大的风险：没人负责、长期握着权限、从没重新评测过的“影子智能体”</text>
</svg>
