<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">补图B　个人代理控制回路</text><text x="800" y="115" class="label" text-anchor="middle">低风险草稿可以快，高影响行动必须慢；每一步都保留接管入口</text><rect x="135" y="250" width="330" height="125" class="box accent"/><text x="300.0" y="292" class="label" text-anchor="middle">任务契约</text><text x="300.0" y="328" class="small" text-anchor="middle">目标 / 范围 / 结束条件</text><rect x="635" y="250" width="330" height="125" class="box accent"/><text x="800.0" y="292" class="label" text-anchor="middle">最小权限</text><text x="800.0" y="328" class="small" text-anchor="middle">只给本次所需</text><rect x="1135" y="250" width="330" height="125" class="box accent"/><text x="1300.0" y="292" class="label" text-anchor="middle">建议或草稿</text><text x="1300.0" y="328" class="small" text-anchor="middle">可比较 / 可追问</text><rect x="135" y="500" width="330" height="125" class="box warm"/><text x="300.0" y="542" class="label" text-anchor="middle">确认门</text><text x="300.0" y="578" class="small" text-anchor="middle">人批准或拒绝</text><rect x="635" y="500" width="330" height="125" class="box warm"/><text x="800.0" y="542" class="label" text-anchor="middle">行动收据</text><text x="800.0" y="578" class="small" text-anchor="middle">记录发生了什么</text><rect x="1135" y="500" width="330" height="125" class="box warm"/><text x="1300.0" y="542" class="label" text-anchor="middle">撤销 / 接管</text><text x="1300.0" y="578" class="small" text-anchor="middle">暂停、回滚、人工继续</text><path d="M465,312 L625,312" class="line" marker-end="url(#arrow)"/><path d="M965,312 L1125,312" class="line" marker-end="url(#arrow)"/><path d="M1290,375 L1290,500" class="line" marker-end="url(#arrow)"/><path d="M1125,562 L965,562" class="line" marker-end="url(#arrow)"/><path d="M625,562 L465,562" class="line" marker-end="url(#arrow)"/><text x="800" y="760" class="label" text-anchor="middle">循环的终点不是“自动完成”，而是“可复核、可撤回、可接管”</text>
