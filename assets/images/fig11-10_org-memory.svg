<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图11-10　组织记忆必须能被机器使用，也能被人解释</text><text x="800" y="115" class="label" text-anchor="middle">3 道关：抽取 → 结构化 → 双面表达</text><rect x="60" y="200" width="460" height="130" class="box accent"/><text x="290.0" y="242" class="label" text-anchor="middle">① 抽取</text><text x="290.0" y="278" class="small" text-anchor="middle">从经验中识别规则</text><rect x="560" y="200" width="460" height="130" class="box warm"/><text x="790.0" y="242" class="label" text-anchor="middle">② 结构化</text><text x="790.0" y="278" class="small" text-anchor="middle">规则变成可机读</text><rect x="1060" y="200" width="480" height="130" class="box green"/><text x="1300.0" y="242" class="label" text-anchor="middle">③ 双面表达</text><text x="1300.0" y="278" class="small" text-anchor="middle">机器可用 + 人可解释</text><path d="M520,265 L560,265" class="line" marker-end="url(#arrow)"/><path d="M1020,265 L1060,265" class="line" marker-end="url(#arrow)"/><rect x="60" y="380" width="460" height="100" class="box pink"/><text x="290.0" y="422" class="label" text-anchor="middle">抽取失败</text><text x="290.0" y="458" class="small" text-anchor="middle">经验留在人脑 · 离职即丢</text><rect x="560" y="380" width="460" height="100" class="box pink"/><text x="790.0" y="422" class="label" text-anchor="middle">结构化失败</text><text x="790.0" y="458" class="small" text-anchor="middle">结构化但无法查询</text><rect x="1060" y="380" width="460" height="100" class="box pink"/><text x="1290.0" y="422" class="label" text-anchor="middle">双面表达失败</text><text x="1290.0" y="458" class="small" text-anchor="middle">机器懂人不懂 · 或反之</text><rect x="60" y="530" width="1480" height="110" class="box muted"/><text x="800.0" y="572" class="label" text-anchor="middle">与图5-4 个人记忆对照</text><text x="800.0" y="608" class="small" text-anchor="middle">个人记忆：事实 / 偏好 / 推断 × 时间 / 场景 / 解释三道边界；组织记忆：抽取 / 结构化 / 双面表达三道关——结构相似，主体不同</text><rect x="60" y="690" width="1480" height="130" class="box green"/><text x="800.0" y="732" class="label" text-anchor="middle">成功标志</text><text x="800.0" y="768" class="small" text-anchor="middle">任务结束后，下一个 Agent 能从组织记忆里找到上一次的经验——并且人能复核</text>
<text x="60" y="865" class="tiny">原创信息图 · v0.1 · 2026-08-17 · 适配单色印刷</text></svg>