<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:34px;font-weight:700} .label{font-size:23px;font-weight:700} .small{font-size:18px} .tiny{font-size:15px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图11-1　到二〇三五年：六项可验证预测</text><text x="800" y="115" class="label" text-anchor="middle">每项判断都列出依据、观察指标和反证条件</text><rect x="60" y="170" width="360" height="50" class="box warm"/><text x="240.0" y="202" class="small" text-anchor="middle">六个判断</text><rect x="430" y="170" width="360" height="50" class="box muted"/><text x="610.0" y="202" class="small" text-anchor="middle">驱动力 ·  为什么可能成立</text><rect x="800" y="170" width="360" height="50" class="box muted"/><text x="980.0" y="202" class="small" text-anchor="middle">可观测指标 ·  看什么能确认</text><rect x="1170" y="170" width="370" height="50" class="box muted"/><text x="1355.0" y="202" class="small" text-anchor="middle">反证条件 ·  看到什么就推翻</text><rect x="60" y="232" width="360" height="96" class="box warm"/><text x="240.0" y="282.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">智能更便宜</tspan><tspan x="240.0" dy="28">可信行动更昂贵</tspan></text><rect x="430" y="232" width="360" height="96" class="box muted"/><text x="610.0" y="285.5" class="tiny" text-anchor="middle"><tspan x="610.0" dy="0">生成单价下降</tspan><tspan x="610.0" dy="21">验证与恢复成本上升</tspan></text><rect x="800" y="232" width="360" height="96" class="box muted"/><text x="980.0" y="285.5" class="tiny" text-anchor="middle"><tspan x="980.0" dy="0">端到端任务成本</tspan><tspan x="980.0" dy="21">验证成本占比</tspan></text><rect x="1170" y="232" width="370" height="96" class="box muted"/><text x="1355.0" y="285.5" class="tiny" text-anchor="middle"><tspan x="1355.0" dy="0">验证成本接近于零</tspan><tspan x="1355.0" dy="21">且广泛应用未出现</tspan></text><rect x="60" y="332" width="360" height="96" class="box warm"/><text x="240.0" y="382.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">模型同时向更大</tspan><tspan x="240.0" dy="28">和更小发展</tspan></text><rect x="430" y="332" width="360" height="96" class="box muted"/><text x="610.0" y="385.5" class="tiny" text-anchor="middle"><tspan x="610.0" dy="0">大模型探索前沿</tspan><tspan x="610.0" dy="21">小模型承接成熟能力</tspan></text><rect x="800" y="332" width="360" height="96" class="box muted"/><text x="980.0" y="385.5" class="tiny" text-anchor="middle"><tspan x="980.0" dy="0">能力能否压缩</tspan><tspan x="980.0" dy="21">迁移后能否维护</tspan></text><rect x="1170" y="332" width="370" height="96" class="box muted"/><text x="1355.0" y="385.5" class="tiny" text-anchor="middle"><tspan x="1355.0" dy="0">关键能力长期</tspan><tspan x="1355.0" dy="21">无法压缩或复现</tspan></text><rect x="60" y="432" width="360" height="96" class="box warm"/><text x="240.0" y="482.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">Agent进入</tspan><tspan x="240.0" dy="28">生产关系</tspan></text><rect x="430" y="432" width="360" height="96" class="box muted"/><text x="610.0" y="485.5" class="tiny" text-anchor="middle"><tspan x="610.0" dy="0">持续身份与预算</tspan><tspan x="610.0" dy="21">跨Agent委托链</tspan></text><rect x="800" y="432" width="360" height="96" class="box muted"/><text x="980.0" y="485.5" class="tiny" text-anchor="middle"><tspan x="980.0" dy="0">持续任务数量</tspan><tspan x="980.0" dy="21">授权与再委托路径</tspan></text><rect x="1170" y="432" width="370" height="96" class="box muted"/><text x="1355.0" y="485.5" class="tiny" text-anchor="middle"><tspan x="1355.0" dy="0">长期只能完成</tspan><tspan x="1355.0" dy="21">短时低风险任务</tspan></text><rect x="60" y="532" width="360" height="96" class="box warm"/><text x="240.0" y="582.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">企业最小有效</tspan><tspan x="240.0" dy="28">规模下降</tspan></text><rect x="430" y="532" width="360" height="96" class="box muted"/><text x="610.0" y="585.5" class="tiny" text-anchor="middle"><tspan x="610.0" dy="0">搜索、协调和执行</tspan><tspan x="610.0" dy="21">部分成本下降</tspan></text><rect x="800" y="532" width="360" height="96" class="box muted"/><text x="980.0" y="585.5" class="tiny" text-anchor="middle"><tspan x="980.0" dy="0">小团队存活率</tspan><tspan x="980.0" dy="21">生产率与创新质量</tspan></text><rect x="1170" y="532" width="370" height="96" class="box muted"/><text x="1355.0" y="585.5" class="tiny" text-anchor="middle"><tspan x="1355.0" dy="0">关键成本仍须</tspan><tspan x="1355.0" dy="21">大型组织承担</tspan></text><rect x="60" y="632" width="360" height="96" class="box warm"/><text x="240.0" y="682.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">主权从系统位置</tspan><tspan x="240.0" dy="28">转向决定权归属</tspan></text><rect x="430" y="632" width="360" height="96" class="box muted"/><text x="610.0" y="685.5" class="tiny" text-anchor="middle"><tspan x="610.0" dy="0">任务跨云跨模型</tspan><tspan x="610.0" dy="21">学习资产可迁移</tspan></text><rect x="800" y="632" width="360" height="96" class="box muted"/><text x="980.0" y="685.5" class="tiny" text-anchor="middle"><tspan x="980.0" dy="0">谁路由、签发身份</tspan><tspan x="980.0" dy="21">谁停止与取回反馈</tspan></text><rect x="1170" y="632" width="370" height="96" class="box muted"/><text x="1355.0" y="685.5" class="tiny" text-anchor="middle"><tspan x="1355.0" dy="0">本地部署仍受</tspan><tspan x="1355.0" dy="21">单一外部入口控制</tspan></text><rect x="60" y="732" width="360" height="96" class="box warm"/><text x="240.0" y="782.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">AI能力形成</tspan><tspan x="240.0" dy="28">多个中心</tspan></text><rect x="430" y="732" width="360" height="96" class="box muted"/><text x="610.0" y="785.5" class="tiny" text-anchor="middle"><tspan x="610.0" dy="0">算力、能源、模型</tspan><tspan x="610.0" dy="21">协议与治理分散</tspan></text><rect x="800" y="732" width="360" height="96" class="box muted"/><text x="980.0" y="785.5" class="tiny" text-anchor="middle"><tspan x="980.0" dy="0">关键能力是否仍</tspan><tspan x="980.0" dy="21">分布在不同节点</tspan></text><rect x="1170" y="732" width="370" height="96" class="box muted"/><text x="1355.0" y="785.5" class="tiny" text-anchor="middle"><tspan x="1355.0" dy="0">各项长期收敛到</tspan><tspan x="1355.0" dy="21">同一不可替代中心</tspan></text><text x="800" y="855" class="small" text-anchor="middle">这些判断可以分别验证；出现反证时，应当修改或放弃</text>
