<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="470" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一个智能体由什么组成</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">括号里是开车的比方</text>
<rect x="40" y="110" width="200" height="190" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="140" y="140" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">上下文</text>
<text x="140" y="175" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">系统规则</text>
<text x="140" y="203" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">对话历史</text>
<text x="140" y="231" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">检索到的文档</text>
<text x="140" y="259" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">数据库查询结果</text>
<line x1="242" y1="205" x2="318" y2="205" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="196" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">喂给</text>
<rect x="320" y="160" width="150" height="90" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="395" y="200" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">模型</text>
<text x="395" y="225" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">（司机）</text>
<rect x="640" y="160" width="150" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="715" y="200" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">工具</text>
<text x="715" y="225" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">（车）</text>
<path d="M470,180 C530,150 580,150 638,180" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="555" y="145" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">提出调用请求</text>
<path d="M640,232 C580,262 530,262 472,232" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="555" y="278" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">看结果、再调整</text>
<rect x="590" y="300" width="120" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="650" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">账号</text>
<text x="650" y="345" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">（车钥匙）</text>
<rect x="725" y="300" width="140" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="795" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">权限</text>
<text x="795" y="345" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">（驾照准开的车型）</text>
<line x1="680" y1="298" x2="695" y2="253" stroke="#555" stroke-width="1.5"/>
<line x1="780" y1="298" x2="760" y2="253" stroke="#555" stroke-width="1.5"/>
<text x="395" y="305" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">循环：读状态 → 选下一步 →</text>
<text x="395" y="325" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">调用工具 → 看结果 → 再调整</text>
<rect x="40" y="385" width="825" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="416" font-size="15" text-anchor="start" font-weight="bold" fill="#111">运行记录</text>
<text x="135" y="416" font-size="13" text-anchor="start" font-weight="normal" fill="#555">（行车记录仪）</text>
<text x="845" y="416" font-size="13" text-anchor="end" font-weight="normal" fill="#555">在模型之外记下用了什么、跑的哪个版本、调了哪些工具</text>
</svg>
