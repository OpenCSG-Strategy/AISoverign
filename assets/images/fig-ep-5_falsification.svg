<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图结语-5　一套理论也应当允许被证伪</text><text x="800" y="115" class="label" text-anchor="middle">3 类反证路径 × 6 项预测（图11-1）的反证条件</text><rect x="60" y="180" width="480" height="110" class="box warm"/><text x="300.0" y="222" class="label" text-anchor="middle">① 可观测指标不达</text><text x="300.0" y="258" class="small" text-anchor="middle">实际数据 vs 预测</text><rect x="560" y="180" width="480" height="110" class="box pink"/><text x="800.0" y="222" class="label" text-anchor="middle">② 反例任务失败</text><text x="800.0" y="258" class="small" text-anchor="middle">模型无法完成关键任务</text><rect x="1060" y="180" width="480" height="110" class="box accent"/><text x="1300.0" y="222" class="label" text-anchor="middle">③ 预测失效</text><text x="1300.0" y="258" class="small" text-anchor="middle">长期趋势反向</text><rect x="60" y="320" width="480" height="90" class="box muted"/><text x="300.0" y="362" class="label" text-anchor="middle">对应预测（图11-1）</text><text x="300.0" y="398" class="small" text-anchor="middle">见各项预测的反例描述</text><rect x="560" y="320" width="480" height="90" class="box muted"/><text x="800.0" y="362" class="label" text-anchor="middle">对应预测（图11-1）</text><text x="800.0" y="398" class="small" text-anchor="middle">见各项预测的反例描述</text><rect x="1060" y="320" width="480" height="90" class="box muted"/><text x="1300.0" y="362" class="label" text-anchor="middle">对应预测（图11-1）</text><text x="1300.0" y="398" class="small" text-anchor="middle">见各项预测的反例描述</text><rect x="60" y="440" width="1480" height="130" class="box accent"/><text x="800.0" y="482" class="label" text-anchor="middle">6 项预测（图11-1）</text><text x="800.0" y="518" class="small" text-anchor="middle">① 智能更便宜·可信行动更昂贵  ② 模型同时向更大和更小发展  ③ Agent 取得持续身份和预算  ④ 企业最小有效规模下降  ⑤ 部署地点之外运行控制成为主要指标  ⑥ AI 能力分布在多个不对称中心</text><rect x="60" y="600" width="1480" height="130" class="box green"/><text x="800.0" y="642" class="label" text-anchor="middle">反证触发后的修订流程</text><text x="800.0" y="678" class="small" text-anchor="middle">① 记录反证（数据·时间·任务）  ② 区分预测边界 vs 预测错误  ③ 修订或撤回  ④ 公告  ⑤ 重新设定观察指标</text><rect x="60" y="760" width="1480" height="90" class="box pink"/><text x="800.0" y="802" class="label" text-anchor="middle">判断</text><text x="800.0" y="838" class="small" text-anchor="middle">出现反证时，应当修改或放弃——而不是维护结论。这才是理论应当允许被证伪</text>
