<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="440" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">企业主权 AI 中枢：四样东西，三个验收动作</text>
<text x="40" y="82" font-size="13" text-anchor="start" font-weight="normal" fill="#555">第一阶段只挑三项真实任务，例如</text>
<rect x="40" y="94" width="120" height="42" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="100" y="120" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">内部知识问答</text>
<rect x="172" y="94" width="120" height="42" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="232" y="120" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">研发辅助</text>
<rect x="304" y="94" width="120" height="42" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="364" y="120" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">客户服务</text>
<rect x="436" y="94" width="120" height="42" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="496" y="120" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">合同审查</text>
<line x1="300" y1="140" x2="300" y2="168" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="190" font-size="13" text-anchor="start" font-weight="normal" fill="#555">企业自己建立</text>
<rect x="40" y="202" width="120" height="70" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="100" y="232" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">资产目录</text>
<text x="100" y="254" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">CSGHub</text>
<rect x="172" y="202" width="120" height="70" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="232" y="232" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">模型网关</text>
<text x="232" y="254" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">路由和计量</text>
<rect x="304" y="202" width="120" height="70" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="364" y="232" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">一套权限</text>
<text x="364" y="254" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">每个智能体最小权限</text>
<rect x="436" y="202" width="120" height="70" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="496" y="232" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">评测和运行记录</text>
<text x="496" y="254" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">用真实失败攒题</text>
<line x1="300" y1="276" x2="300" y2="304" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="306" width="516" height="44" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="298" y="333" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">底层继续用多家云、多家模型</text>
<text x="600" y="82" font-size="14" text-anchor="start" font-weight="bold" fill="#111">第一阶段怎样算做成</text>
<rect x="600" y="94" width="260" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="622" cy="118" r="11" fill="#111"/>
<text x="622" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="642" y="123" font-size="15" text-anchor="start" font-weight="bold" fill="#111">换模型</text>
<text x="616" y="144" font-size="12" text-anchor="start" font-weight="normal" fill="#111">把一项任务换成另一家的模型，</text>
<text x="616" y="161" font-size="12" text-anchor="start" font-weight="normal" fill="#111">评测题重考一遍</text>
<rect x="600" y="180" width="260" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="622" cy="204" r="11" fill="#111"/>
<text x="622" y="208.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="642" y="209" font-size="15" text-anchor="start" font-weight="bold" fill="#111">导出资产</text>
<text x="616" y="230" font-size="12" text-anchor="start" font-weight="normal" fill="#111">提示词、知识库、评测集、记录</text>
<text x="616" y="247" font-size="12" text-anchor="start" font-weight="normal" fill="#111">在另一套环境里能读懂、能用</text>
<rect x="600" y="266" width="260" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="622" cy="290" r="11" fill="#111"/>
<text x="622" y="294.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="642" y="295" font-size="15" text-anchor="start" font-weight="bold" fill="#111">停下智能体</text>
<text x="616" y="316" font-size="12" text-anchor="start" font-weight="normal" fill="#111">按下停止键，确认真的停了，</text>
<text x="616" y="333" font-size="12" text-anchor="start" font-weight="normal" fill="#111">业务切到人工或备用流程</text>
<text x="40" y="400" font-size="13" text-anchor="start" font-weight="normal" fill="#555">每个 OpenCSG 组件都可以换成别家的同类产品；换了以后蓝图仍然成立，不成立的地方就是锁定风险</text>
</svg>
