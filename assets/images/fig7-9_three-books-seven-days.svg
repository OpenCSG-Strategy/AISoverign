<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图7-9 三本账 + 5 组主权指标 + 七天测试</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"七天测试让三本账对上现实"画成 3 本账（资产 / 权限 / 责任）+ 5 组主权指标（任务 / 边界 / 恢复 / 依赖 / 责任）+ 7 天时间线（导出/画流程/备用模型/人工接管/降级/恢复/稳态）。治理本身也要接受结果检验。数据来源：第七章正文 07.8。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:30px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图7-9　三本账 + 5 组主权指标 + 七天测试</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">写在文档里的主权只是意愿 — 经过测试的主权才是能力</text>

<!-- 3 本账 -->
<g>
  <line x1="60" y1="125" x2="1540" y2="125" class="line"/>
  <text x="800" y="160" class="label" text-anchor="middle">三本账 — 让核心问题可见</text>

  <rect x="60"  y="190" width="490" height="160" class="box accent"/>
  <text x="100" y="228" class="num" text-anchor="start" fill="#1f4e79">① 资产账</text>
  <text x="100" y="260" class="small" text-anchor="start" font-weight="700">我们拥有什么</text>
  <text x="100" y="290" class="small" text-anchor="start">· 数据 / 知识 / 评测 / 流程</text>
  <text x="100" y="315" class="small" text-anchor="start">· 保存在哪里 / 谁维护</text>
  <text x="100" y="340" class="small" text-anchor="start">· 能否导出和迁移</text>

  <rect x="570" y="190" width="490" height="160" class="box warm"/>
  <text x="610" y="228" class="num" text-anchor="start" fill="#7c2d12">② 权限账</text>
  <text x="610" y="260" class="small" text-anchor="start" font-weight="700">机器能够做什么</text>
  <text x="610" y="290" class="small" text-anchor="start">· 每个智能体的身份</text>
  <text x="610" y="315" class="small" text-anchor="start">· 能看什么 / 能做什么 / 何时到期</text>
  <text x="610" y="340" class="small" text-anchor="start">· 能否快速撤销</text>

  <rect x="1080" y="190" width="460" height="160" class="box green"/>
  <text x="1120" y="228" class="num" text-anchor="start" fill="#1f4e79">③ 责任账</text>
  <text x="1120" y="260" class="small" text-anchor="start" font-weight="700">出了问题找谁</text>
  <text x="1120" y="290" class="small" text-anchor="start">· 系统影响哪些人</text>
  <text x="1120" y="315" class="small" text-anchor="start">· 谁对业务结果负责</text>
  <text x="1120" y="340" class="small" text-anchor="start">· 谁监控 / 谁能叫停 / 谁补救</text>
</g>

<!-- 5 组主权指标 -->
<g>
  <line x1="60" y1="380" x2="1540" y2="380" class="line"/>
  <text x="800" y="415" class="label" text-anchor="middle">5 组主权指标 — 不同维度同时报告</text>

  <rect x="60"  y="445" width="290" height="100" class="box accent"/>
  <text x="100" y="478" class="label" text-anchor="start" fill="#1f4e79">① 任务</text>
  <text x="100" y="508" class="small" text-anchor="start">成功率 / 时延 / 成本</text>
  <text x="100" y="528" class="small" text-anchor="start">人工修改 / 业务采用</text>

  <rect x="365" y="445" width="290" height="100" class="box warm"/>
  <text x="405" y="478" class="label" text-anchor="start" fill="#7c2d12">② 边界</text>
  <text x="405" y="508" class="small" text-anchor="start">越权 / 数据出口拒绝</text>
  <text x="405" y="528" class="small" text-anchor="start">高风险行动 / 提示注入</text>

  <rect x="670" y="445" width="290" height="100" class="box green"/>
  <text x="710" y="478" class="label" text-anchor="start" fill="#1f4e79">③ 恢复</text>
  <text x="710" y="508" class="small" text-anchor="start">发现 / 停止 / 切换</text>
  <text x="710" y="528" class="small" text-anchor="start">业务恢复 / 客户补救</text>

  <rect x="975" y="445" width="290" height="100" class="box accent"/>
  <text x="1015" y="478" class="label" text-anchor="start" fill="#1f4e79">④ 依赖</text>
  <text x="1015" y="508" class="small" text-anchor="start">单点 / 供应商专有接口</text>
  <text x="1015" y="528" class="small" text-anchor="start">资产可导出 / 备用最近运行</text>

  <rect x="1280" y="445" width="260" height="100" class="box warm"/>
  <text x="1320" y="478" class="label" text-anchor="start" fill="#7c2d12">⑤ 责任</text>
  <text x="1320" y="508" class="small" text-anchor="start">还原发起人 / 身份</text>
  <text x="1320" y="528" class="small" text-anchor="start">权限 / 版本 / 审批 / 投诉</text>
</g>

<!-- 七天时间线 -->
<g>
  <line x1="60" y1="580" x2="1540" y2="580" class="line"/>
  <text x="800" y="615" class="label" text-anchor="middle" fill="#7c2d12">七天测试：核心 AI 供应商中断后 — 演练迁移 / 降级 / 接管</text>

  <rect x="60"  y="640" width="200" height="100" class="box warm"/>
  <text x="160" y="672" class="label" text-anchor="middle" fill="#7c2d12">Day 1</text>
  <text x="80" y="700" class="small" text-anchor="start">客户资料可导出</text>
  <text x="80" y="720" class="small" text-anchor="start">旧工单标签无法迁移</text>

  <rect x="270" y="640" width="200" height="100" class="box warm"/>
  <text x="370" y="672" class="label" text-anchor="middle" fill="#7c2d12">Day 2</text>
  <text x="290" y="700" class="small" text-anchor="start">画最重要的售后流程</text>
  <text x="290" y="720" class="small" text-anchor="start">发现判断只存在原平台</text>

  <rect x="480" y="640" width="200" height="100" class="box green"/>
  <text x="580" y="672" class="label" text-anchor="middle" fill="#1f4e79">Day 3</text>
  <text x="500" y="700" class="small" text-anchor="start">备用模型接入</text>
  <text x="500" y="720" class="small" text-anchor="start">效果差但能处理常见</text>

  <rect x="690" y="640" width="200" height="100" class="box accent"/>
  <text x="790" y="672" class="label" text-anchor="middle" fill="#1f4e79">Day 4</text>
  <text x="710" y="700" class="small" text-anchor="start">人工客服接管高风险</text>
  <text x="710" y="720" class="small" text-anchor="start">请求</text>

  <rect x="900" y="640" width="200" height="100" class="box warm"/>
  <text x="1000" y="672" class="label" text-anchor="middle" fill="#7c2d12">Day 5</text>
  <text x="920" y="700" class="small" text-anchor="start">降级方案生效</text>
  <text x="920" y="720" class="small" text-anchor="start">非核心功能暂关</text>

  <rect x="1110" y="640" width="200" height="100" class="box green"/>
  <text x="1210" y="672" class="label" text-anchor="middle" fill="#1f4e79">Day 6</text>
  <text x="1130" y="700" class="small" text-anchor="start">受影响业务恢复</text>
  <text x="1130" y="720" class="small" text-anchor="start">客户补救</text>

  <rect x="1320" y="640" width="220" height="100" class="box green"/>
  <text x="1430" y="672" class="label" text-anchor="middle" fill="#1f4e79">Day 7</text>
  <text x="1340" y="700" class="small" text-anchor="start">服务变慢</text>
  <text x="1340" y="720" class="small" text-anchor="start">企业没有停止</text>
</g>

<!-- 底部 -->
<g>
  <rect x="60" y="760" width="1480" height="120" class="box muted"/>
  <text x="800" y="800" class="label" text-anchor="middle" fill="#1f4e79">这两个问题一进一退，构成了企业主权最实际的尺度</text>
  <text x="800" y="830" class="small" text-anchor="middle">每获得新行动能力 → 问：如果突然失去，谁能接管；如果突然失控，谁能停止</text>
  <text x="800" y="860" class="label" text-anchor="middle" fill="#7c2d12">治理本身也必须接受结果检验 — 不能因为名义正确而无限增加流程</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第七章正文 07.8</text>
</svg>
