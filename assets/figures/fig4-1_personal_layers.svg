<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="406" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">个人在 AI 里积累的四层东西</text>
<g transform="translate(0,-34)"><rect x="60" y="330" width="600" height="60" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="80" y="366" font-size="16" text-anchor="start" font-weight="bold" fill="#111">原始资料</text>
<text x="190" y="366" font-size="13" text-anchor="start" font-weight="normal" fill="#111">文字、照片、录音、邮件、账单、合同、通讯录</text>
<rect x="82" y="258" width="556" height="60" rx="4" fill="#eaeaea" stroke="#111" stroke-width="1.5"/>
<text x="102" y="294" font-size="16" text-anchor="start" font-weight="bold" fill="#111">个人记忆</text>
<text x="212" y="294" font-size="13" text-anchor="start" font-weight="normal" fill="#111">资料之间的关系；你的解释、偏好、承诺和教训</text>
<rect x="104" y="186" width="512" height="60" rx="4" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
<text x="124" y="222" font-size="16" text-anchor="start" font-weight="bold" fill="#111">工作方法</text>
<text x="234" y="222" font-size="13" text-anchor="start" font-weight="normal" fill="#111">怎么开头、在哪几步求证、怎么交付、出错怎么补救</text>
<rect x="126" y="114" width="468" height="60" rx="4" fill="#a8a8a8" stroke="#111" stroke-width="1.5"/>
<text x="146" y="150" font-size="16" text-anchor="start" font-weight="bold" fill="#111">身份和关系</text>
<text x="256" y="150" font-size="13" text-anchor="start" font-weight="normal" fill="#111">别人怎么找到你、为什么信任你、谁愿意再找你</text>
<line x1="720" y1="390" x2="720" y2="112" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<text x="735" y="130" font-size="15" text-anchor="start" font-weight="bold" fill="#111">越往上</text>
<text x="735" y="152" font-size="15" text-anchor="start" font-weight="bold" fill="#111">越难重建</text>
<rect x="700" y="330" width="170" height="60" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="785" y="355" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">导出压缩包</text>
<text x="785" y="375" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">大致能带走这一层</text>
<text x="735" y="230" font-size="13" text-anchor="start" font-weight="normal" fill="#555">换到新系统，</text>
<text x="735" y="250" font-size="13" text-anchor="start" font-weight="normal" fill="#555">这几层不会</text>
<text x="735" y="270" font-size="13" text-anchor="start" font-weight="normal" fill="#555">自动恢复</text>
<text x="60" y="420" font-size="14" text-anchor="start" font-weight="normal" fill="#555">数据带走了，本事没跟着走</text></g>
</svg>
