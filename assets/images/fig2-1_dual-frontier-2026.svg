<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图2-1 二〇二六年的双前沿：总参数、激活参数与任务切片</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。纸书黑白和彩色电子版均可使用。展示 2026 年代表性前沿模型的总参数、激活参数、专家数、上下文、量化精度，以及它们如何被切成语音、端侧、分类等任务型小模型。数据来源：Moonshot AI 官方仓库与 Kimi K3 技术报告（arxiv 2607.24653）；DeepSeek 官方模型卡（V4-Pro / V4-Flash，1.6T/49B 与 284B/13B，1M 上下文）；Qwen3-ASR 论文（2601.21337）；Gemma 3n 与 Google 官方文档；Apple 端侧基础模型技术报告。规格为项目方一手披露，性能、速度、价格、基准比较受评测、硬件和服务条件限制。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:34px;font-weight:700}
