<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图9-3　审计证据到哪里，结论就停在哪里</text><text x="800" y="115" class="label" text-anchor="middle">五类证据严格沿用表9-1；任何一类都不能单独推出「系统可信」</text><rect x="60" y="200" width="280" height="130" class="box accent"/><text x="200.0" y="242" class="label" text-anchor="middle">签名与来源</text><text x="200.0" y="278" class="small" text-anchor="middle">制品完整性 / 来源关系</text><rect x="340" y="200" width="280" height="130" class="box accent"/><text x="480.0" y="242" class="label" text-anchor="middle">建造文档</text><text x="480.0" y="278" class="small" text-anchor="middle">过程有记录</text><rect x="620" y="200" width="280" height="130" class="box accent"/><text x="760.0" y="242" class="label" text-anchor="middle">运行日志</text><text x="760.0" y="278" class="small" text-anchor="middle">特定身份权限下的动作</text><rect x="900" y="200" width="280" height="130" class="box accent"/><text x="1040.0" y="242" class="label" text-anchor="middle">独立测试</text><text x="1040.0" y="278" class="small" text-anchor="middle">特定样本环境表现</text><rect x="1180" y="200" width="280" height="130" class="box accent"/><text x="1320.0" y="242" class="label" text-anchor="middle">事故与申诉</text><text x="1320.0" y="278" class="small" text-anchor="middle">现实中已失效的边界</text><text x="60" y="360" class="label" text-anchor="start">支持证明</text><text x="900" y="360" class="label" text-anchor="start">不能证明</text><rect x="60" y="400" width="800" height="50" class="box green"/><text x="460.0" y="441.0" class="small" text-anchor="middle"><tspan x="460.0" dy="0">制品完整性</tspan></text><rect x="900" y="400" width="640" height="50" class="box warm"/><text x="1220.0" y="441.0" class="small" text-anchor="middle"><tspan x="1220.0" dy="0">发布者持续可信</tspan></text><rect x="60" y="460" width="800" height="50" class="box green"/><text x="460.0" y="501.0" class="small" text-anchor="middle"><tspan x="460.0" dy="0">过程有记录</tspan></text><rect x="900" y="460" width="640" height="50" class="box warm"/><text x="1220.0" y="501.0" class="small" text-anchor="middle"><tspan x="1220.0" dy="0">行为普遍安全</tspan></text><rect x="60" y="520" width="800" height="50" class="box green"/><text x="460.0" y="561.0" class="small" text-anchor="middle"><tspan x="460.0" dy="0">特定动作</tspan></text><rect x="900" y="520" width="640" height="50" class="box warm"/><text x="1220.0" y="561.0" class="small" text-anchor="middle"><tspan x="1220.0" dy="0">未记录动作存在</tspan></text><rect x="60" y="580" width="800" height="50" class="box green"/><text x="460.0" y="621.0" class="small" text-anchor="middle"><tspan x="460.0" dy="0">特定样本</tspan></text><rect x="900" y="580" width="640" height="50" class="box warm"/><text x="1220.0" y="621.0" class="small" text-anchor="middle"><tspan x="1220.0" dy="0">其他场景均安全</tspan></text><rect x="60" y="640" width="800" height="50" class="box green"/><text x="460.0" y="681.0" class="small" text-anchor="middle"><tspan x="460.0" dy="0">现实边界</tspan></text><rect x="900" y="640" width="640" height="50" class="box warm"/><text x="1220.0" y="681.0" class="small" text-anchor="middle"><tspan x="1220.0" dy="0">未发生风险不存在</tspan></text><rect x="60" y="760" width="1480" height="130" class="box muted"/><text x="800.0" y="802" class="label" text-anchor="middle">审计结论必须限定</text><text x="800.0" y="838" class="small" text-anchor="middle">版本 + 数据 + 任务 + 权限——任何一类证据超出这些边界即不可外推</text>
