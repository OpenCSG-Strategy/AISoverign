<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="420" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">六种能力</text>
<rect x="40" y="80" width="255" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="40" y="80" width="64" height="110" rx="6" fill="#111"/>
<rect x="90" y="80" width="14" height="110" fill="#111"/>
<text x="72" y="142" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">选择</text>
<text x="200" y="141" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">看清方案，按自己目标定</text>
<rect x="320" y="80" width="255" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="320" y="80" width="64" height="110" rx="6" fill="#111"/>
<rect x="370" y="80" width="14" height="110" fill="#111"/>
<text x="352" y="142" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">替换</text>
<text x="480" y="141" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">另一套系统能接手</text>
<rect x="600" y="80" width="255" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="600" y="80" width="64" height="110" rx="6" fill="#111"/>
<rect x="650" y="80" width="14" height="110" fill="#111"/>
<text x="632" y="142" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">迁移</text>
<text x="760" y="141" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">模型周围的东西带得走</text>
<rect x="40" y="210" width="255" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="40" y="210" width="64" height="110" rx="6" fill="#111"/>
<rect x="90" y="210" width="14" height="110" fill="#111"/>
<text x="72" y="272" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">审计</text>
<text x="200" y="271" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">在模型之外留下证据</text>
<rect x="320" y="210" width="255" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="320" y="210" width="64" height="110" rx="6" fill="#111"/>
<rect x="370" y="210" width="14" height="110" fill="#111"/>
<text x="352" y="272" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">组合</text>
<text x="480" y="271" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">不靠一个模型包打天下</text>
<rect x="600" y="210" width="255" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="600" y="210" width="64" height="110" rx="6" fill="#111"/>
<rect x="650" y="210" width="14" height="110" fill="#111"/>
<text x="632" y="272" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">演进</text>
<text x="760" y="271" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">五年后仍然管得住</text>
<text x="40" y="375" font-size="13" text-anchor="start" font-weight="normal" fill="#555">六种能力之间会打架。原则只有一条：</text>
<text x="40" y="398" font-size="15" text-anchor="start" font-weight="bold" fill="#111">系统看得越多、做得越多、动作越难撤回，管得就要越严</text>
</svg>
