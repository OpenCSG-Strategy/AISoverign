<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="380" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">企业主权架构的七个控制点</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">智能体代表企业说话、办事，责任就落在企业身上</text>
<rect x="40" y="95" width="106" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="62" cy="118" r="11" fill="#111"/>
<text x="62" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="102" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">身份</text>
<line x1="52" y1="138" x2="134" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="93" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">代表员工、</text>
<text x="93" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">部门，还是</text>
<text x="93" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">公司对外</text>
<rect x="154" y="95" width="106" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="176" cy="118" r="11" fill="#111"/>
<text x="176" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="216" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">数据</text>
<line x1="166" y1="138" x2="248" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="207" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">每次访问</text>
<text x="207" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">有边界、</text>
<text x="207" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">有目的</text>
<rect x="268" y="95" width="106" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="290" cy="118" r="11" fill="#111"/>
<text x="290" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="330" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">工具</text>
<line x1="280" y1="138" x2="362" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="321" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">参数要校验，</text>
<text x="321" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">权限压到</text>
<text x="321" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">最小</text>
<rect x="382" y="95" width="106" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="404" cy="118" r="11" fill="#111"/>
<text x="404" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">5</text>
<text x="444" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">预算</text>
<line x1="394" y1="138" x2="476" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="435" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">每项任务</text>
<text x="435" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">有成本上限</text>
<rect x="520" y="95" width="106" height="150" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<circle cx="542" cy="118" r="11" fill="#111"/>
<text x="542" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">6</text>
<text x="582" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">轨迹</text>
<line x1="532" y1="138" x2="614" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="573" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">证据留在</text>
<text x="573" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">智能体改不了</text>
<text x="573" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">的地方</text>
<rect x="658" y="95" width="106" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="680" cy="118" r="11" fill="#111"/>
<text x="680" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="720" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">模型</text>
<line x1="670" y1="138" x2="752" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="711" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">能评测、</text>
<text x="711" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">能路由、</text>
<text x="711" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">能替换</text>
<rect x="772" y="95" width="106" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="794" cy="118" r="11" fill="#111"/>
<text x="794" y="122.32" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">7</text>
<text x="834" y="123" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">退出</text>
<line x1="784" y1="138" x2="866" y2="138" stroke="#bbb" stroke-width="1"/>
<text x="825" y="162" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">数据、配置、</text>
<text x="825" y="181" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">工作流</text>
<text x="825" y="200" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">都能带走</text>
<path d="M40,255 v10 H488 v-10" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="264.0" y="290" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">决定智能体做什么</text>
<path d="M520,255 v10 H626 v-10" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="573.0" y="290" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">审计</text>
<path d="M658,255 v10 H878 v-10" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="768.0" y="290" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">选择、替换和迁移</text>
<text x="450" y="320" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">对应第三章的六种能力</text>
<text x="40" y="360" font-size="13" text-anchor="start" font-weight="normal" fill="#555">不必一次建齐：从风险最高的那个流程开始，一个控制点一个控制点地补</text>
</svg>
