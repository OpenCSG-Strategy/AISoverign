<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:30px;font-weight:700} .label{font-size:20px;font-weight:700} .small{font-size:15px} .tiny{font-size:12px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .pink{fill:#fde2e2} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图8-12.2　盐城　绿电 → 算力 → 开发者</text><text x="800" y="115" class="label" text-anchor="middle">绿电变成算力只是物理转换；让开发者负担得起，才是经济转换</text><rect x="60" y="180" width="360" height="100" class="box green"/><text x="240.0" y="222" class="label" text-anchor="middle">绿电</text><text x="240.0" y="258" class="small" text-anchor="middle">新能源装机</text><rect x="440" y="180" width="360" height="100" class="box accent"/><text x="620.0" y="222" class="label" text-anchor="middle">算力</text><text x="620.0" y="258" class="small" text-anchor="middle">就地机时</text><rect x="820" y="180" width="360" height="100" class="box warm"/><text x="1000.0" y="222" class="label" text-anchor="middle">开发者</text><text x="1000.0" y="258" class="small" text-anchor="middle">OPC 社区</text><rect x="60" y="300" width="360" height="130" class="box muted"/><text x="240.0" y="357.0" class="small" text-anchor="middle"><tspan x="240.0" dy="0">>1500 万千瓦</tspan><tspan x="240.0" dy="24">海上风电领先</tspan><tspan x="240.0" dy="24">储能+调度配套</tspan></text><rect x="440" y="300" width="360" height="130" class="box muted"/><text x="620.0" y="357.0" class="small" text-anchor="middle"><tspan x="620.0" dy="0">物理转换</tspan><tspan x="620.0" dy="24">训练+推理</tspan><tspan x="620.0" dy="24">波动→储能熨平</tspan></text><rect x="820" y="300" width="360" height="130" class="box muted"/><text x="1000.0" y="357.0" class="small" text-anchor="middle"><tspan x="1000.0" dy="0">赛事揭榜</tspan><tspan x="1000.0" dy="24">孵化空间承接</tspan><tspan x="1000.0" dy="24">签约团队沉淀</tspan></text><path d="M420,230 L440,230" class="line" marker-end="url(#arrow)"/><path d="M800,230 L820,230" class="line" marker-end="url(#arrow)"/><rect x="60" y="470" width="720" height="110" class="box warm"/><text x="420.0" y="512" class="label" text-anchor="middle">卖机时</text><text x="420.0" y="548" class="small" text-anchor="middle">把绿电按市场价卖给外地客户 → 算力收入</text><rect x="820" y="470" width="720" height="110" class="box green"/><text x="1180.0" y="512" class="label" text-anchor="middle">卖生态</text><text x="1180.0" y="548" class="small" text-anchor="middle">把低成本算力投给本地开发者 → 生态回流</text><text x="790" y="525" class="label" text-anchor="middle">vs</text><rect x="60" y="610" width="1480" height="110" class="box muted"/><text x="800.0" y="652" class="label" text-anchor="middle">三次回流</text><text x="800.0" y="688" class="small" text-anchor="middle">资源（算力→开发者门槛↓）→ 资产（任务沉淀本地）→ 价值（收入+税基）；缺中间一级即漏到补贴之外</text><rect x="60" y="750" width="1480" height="90" class="box pink"/><text x="800.0" y="792" class="label" text-anchor="middle">判断</text><text x="800.0" y="828" class="small" text-anchor="middle">能源城市在 AI 时代不必只做上游供应商——前提是忍住不把这张牌按电价卖掉</text>
<text x="60" y="865" class="tiny">原创信息图 · v0.1 · 2026-08-18 · 适配单色印刷</text></svg>