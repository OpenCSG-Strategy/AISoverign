<text x="668" y="368" font-size="13" text-anchor="start" font-weight="normal" fill="#555"></text>
<line x1="718" y1="363" x2="760" y2="363" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="770" y="368" font-size="14" text-anchor="start" font-weight="bold" fill="#111">迁移</text>
<rect x="40" y="400" width="820" height="50" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450" y="422" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">仓库证明不了模型本身安全、输出正确，这些仍要靠独立测试</text>
<text x="450" y="441" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">私有仓库装好以后没人维护，过两年会变成新的孤岛</text>
