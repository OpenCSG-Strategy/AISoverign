<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="470" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">五层蛋糕：用户看到的是最上面一层</text>
<polygon points="260.0,100 460.0,100 485.0,162 235.0,162" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="360" y="137.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">应用</text>
<polygon points="225.0,168 495.0,168 520.0,230 200.0,230" fill="#eeeeee" stroke="#111" stroke-width="1.5"/>
<text x="360" y="205.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">模型</text>
<polygon points="190.0,236 530.0,236 555.0,298 165.0,298" fill="#d6d6d6" stroke="#111" stroke-width="1.5"/>
<text x="360" y="273.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">云数据中心</text>
<polygon points="155.0,304 565.0,304 590.0,366 130.0,366" fill="#bdbdbd" stroke="#111" stroke-width="1.5"/>
<text x="360" y="341.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">芯片和计算设备</text>
<polygon points="120.0,372 600.0,372 625.0,434 95.0,434" fill="#a0a0a0" stroke="#111" stroke-width="1.5"/>
<text x="360" y="409.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">能源</text>
<text x="360" y="88" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">最上面一层</text>
<line x1="655.0" y1="131.0" x2="511.0" y2="131.0" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="665.0" y="127.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">普通用户</text>
<text x="665.0" y="149.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555">每天接触的</text>
<path d="M649.0,236 h12 v198 h-12" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="677.0" y="331.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">下面三层</text>
<text x="677.0" y="353.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555">花钱最多、建设最慢</text>
<text x="360" y="458" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">自下而上：能源 → 芯片和计算设备 → 云数据中心 → 模型 → 应用</text>
</svg>
