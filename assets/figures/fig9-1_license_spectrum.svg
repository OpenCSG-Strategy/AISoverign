<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="540" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">许可证光谱：从宽松许可到源代码可用</text>
<rect x="40" y="110" width="200" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="140.0" y="138" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">宽松许可证</text>
<text x="140.0" y="168" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">MIT</text>
<text x="140.0" y="190" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">BSD</text>
<text x="140.0" y="212" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">Apache 2.0</text>
<text x="140.0" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">保留声明即可</text>
<rect x="250" y="110" width="180" height="150" rx="6" fill="#ececec" stroke="#111" stroke-width="1.5"/>
<text x="340.0" y="138" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">弱著佐权</text>
<text x="340.0" y="168" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">LGPL</text>
<text x="340.0" y="190" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">MPL 2.0</text>
<text x="340.0" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">限于程序库或被改的文件</text>
<rect x="440" y="110" width="180" height="150" rx="6" fill="#d2d2d2" stroke="#111" stroke-width="1.5"/>
<text x="530.0" y="138" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">强著佐权</text>
<text x="530.0" y="168" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">GPLv3</text>
<text x="530.0" y="190" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">AGPLv3</text>
<text x="530.0" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">衍生作品同样开放</text>
<rect x="670" y="110" width="190" height="150" rx="6" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="765.0" y="138" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">源代码可用</text>
<text x="765.0" y="168" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">BSL</text>
<text x="765.0" y="190" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">SSPL</text>
<text x="765.0" y="212" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">RSAL</text>
<text x="765.0" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">限制特定商业用途</text>
<path d="M40,100 v-8 H620 v8" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="330" y="86" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">OSI 认可的开源许可证</text>
<text x="765" y="92" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">不属于开源</text>
<line x1="645" y1="100" x2="645" y2="270" stroke="#555" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="40" y1="284" x2="618" y2="284" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="304" font-size="13" text-anchor="start" font-weight="normal" fill="#555">对衍生作品“同样开放”的要求越来越强 →</text>
<text x="40" y="344" font-size="14" text-anchor="start" font-weight="bold" fill="#111">几次改许可证</text>
<circle cx="340.0" cy="372" r="4" fill="#111"/>
<line x1="340.0" y1="372" x2="759.0" y2="372" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="552.5" y="365" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">二〇二三年　MPL 2.0 → BSL</text>
<text x="328.0" y="377" font-size="13" text-anchor="end" font-weight="bold" fill="#111">Terraform</text>
<circle cx="140.0" cy="412" r="4" fill="#111"/>
<line x1="140.0" y1="412" x2="759.0" y2="412" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="452.5" y="405" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">二〇二四年　BSD → RSALv2／SSPL</text>
<text x="128.0" y="417" font-size="13" text-anchor="end" font-weight="bold" fill="#111">Redis</text>
<circle cx="765.0" cy="452" r="4" fill="#111"/>
<line x1="765.0" y1="452" x2="536.0" y2="452" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="647.5" y="445" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">二〇二五年　加上 AGPLv3</text>
<text x="777.0" y="457" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Redis 8</text>
<rect x="40" y="482" width="400" height="40" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="240" y="507" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">内容和数据：CC0 · CC BY · CC BY-SA</text>
<rect x="460" y="482" width="400" height="40" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="660" y="507" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">大模型：厂商自定义的开放权重许可，差别很大</text>
</svg>
