<text x="234" y="347" font-size="16" text-anchor="start" font-weight="bold" fill="#111">能力入口</text>
<text x="234" y="367" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Capability Entry</text>
<rect x="370" y="330" width="140" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
