<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图10-1　开放控制面：驾驶舱与发动机分离</text><text x="800" y="115" class="label" text-anchor="middle">主权不等于拥有所有发动机，而是保留切换、审计和退出的驾驶权</text><rect x="170" y="230" width="500" height="430" class="box accent"/><text x="420.0" y="272" class="label" text-anchor="middle">控制面 / 驾驶舱</text><rect x="220" y="285" width="400" height="52" class="box muted"/><text x="420.0" y="319.0" class="small" text-anchor="middle">身份</text><rect x="220" y="353" width="400" height="52" class="box muted"/><text x="420.0" y="387.0" class="small" text-anchor="middle">策略</text><rect x="220" y="421" width="400" height="52" class="box muted"/><text x="420.0" y="455.0" class="small" text-anchor="middle">评测</text><rect x="220" y="489" width="400" height="52" class="box muted"/><text x="420.0" y="523.0" class="small" text-anchor="middle">证据</text><rect x="220" y="557" width="400" height="52" class="box muted"/><text x="420.0" y="591.0" class="small" text-anchor="middle">切换权</text><rect x="930" y="210" width="480" height="470" class="box warm"/><text x="1170.0" y="252" class="label" text-anchor="middle">发动机层 / 执行能力</text><rect x="990" y="280" width="360" height="62" class="box muted"/><text x="1170.0" y="319.0" class="small" text-anchor="middle">模型 A</text><rect x="990" y="362" width="360" height="62" class="box muted"/><text x="1170.0" y="401.0" class="small" text-anchor="middle">模型 B</text><rect x="990" y="444" width="360" height="62" class="box muted"/><text x="1170.0" y="483.0" class="small" text-anchor="middle">私有算力</text><rect x="990" y="526" width="360" height="62" class="box muted"/><text x="1170.0" y="565.0" class="small" text-anchor="middle">外部工具</text><path d="M670,350 L930,350" class="line" marker-end="url(#arrow)"/><text x="800.0" y="338.0" class="tiny" text-anchor="middle">调用</text><path d="M930,520 L670,520" class="line" marker-end="url(#arrow)"/><text x="800.0" y="508.0" class="tiny" text-anchor="middle">证据返回</text><text x="800" y="775" class="label" text-anchor="middle">控制面自身也必须可导出、可验证、可迁移，否则驾驶舱仍被锁定</text>
