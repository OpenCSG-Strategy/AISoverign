<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="500" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">本地与云端并存，一个人带一支智能体团队</text>
<text x="40" y="86" font-size="15" text-anchor="start" font-weight="bold" fill="#111">CSGLite：本地推理</text>
<rect x="120" y="104" width="240" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="240" y="131" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">按 OpenAI 格式写好的应用</text>
<line x1="240" y1="150" x2="240" y2="178" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="120" y="180" width="240" height="44" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="240" y="207" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">本机的兼容接口</text>
<line x1="200" y1="226" x2="135" y2="268" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="280" y1="226" x2="345" y2="268" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="240" y="256" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">改指向，代码不用重写</text>
<rect x="40" y="270" width="190" height="140" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="135" y="296" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">本地小模型</text>
<text x="135" y="324" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">资料涉及隐私</text>
<text x="135" y="345" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">要求响应快</text>
<text x="135" y="366" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">没网的地方</text>
<text x="135" y="387" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">固定、重复量大</text>
<rect x="250" y="270" width="190" height="140" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="345" y="296" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">云端模型</text>
<text x="345" y="324" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">复杂推理</text>
<text x="345" y="345" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">长篇写作</text>
<text x="345" y="366" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">少见的专业问题</text>
<text x="40" y="440" font-size="12" text-anchor="start" font-weight="normal" fill="#555">它回答“它能看到什么”：</text>
<text x="40" y="458" font-size="12" text-anchor="start" font-weight="normal" fill="#555">放在本地处理的资料不出门</text>
<line x1="465" y1="80" x2="465" y2="480" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="490" y="86" font-size="15" text-anchor="start" font-weight="bold" fill="#111">CSGClaw：个人 AI 团队的运行时</text>
<rect x="590" y="104" width="170" height="44" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="675" y="131" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">你：由你做决定</text>
