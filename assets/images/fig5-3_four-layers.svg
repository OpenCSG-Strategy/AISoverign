<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-3 一个人拥有的不只是文件：4 层个人智能资产</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把个人智能资产画成 4 层：原始资料 / 个人记忆 / 工作方法 / 身份与关系；AI 能同时进入 4 层。下载按钮只是主权起点 —— 真正问题是带走的是文件还是"一套仍能工作的自己"。数据来源：第五章正文 05.1。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图5-3　一个人拥有的不只是文件：4 层个人智能资产</text>
<text x="800" y="100" class="label" text-anchor="middle">数据带走了，能力却没有跟着走 —— 真正难重建的是最上层</text>

<!-- 4 层（垂直堆叠） -->
<g>
  <rect x="200" y="140" width="1200" height="100" class="box accent"/>
  <text x="280" y="180" class="num" text-anchor="middle">①</text>
  <text x="380" y="180" class="label" text-anchor="start">原始资料</text>
  <text x="380" y="210" class="small" text-anchor="start">· 文字 / 照片 / 录音 / 邮件 / 账单 / 合同 / 联系人 / 交易记录</text>
  <text x="380" y="232" class="tiny" text-anchor="start" fill="#8795a1">生活留下的事实 / 容易复制 / 容易下载</text>

  <rect x="200" y="260" width="1200" height="100" class="box warm"/>
  <text x="280" y="300" class="num" text-anchor="middle">②</text>
  <text x="380" y="300" class="label" text-anchor="start">个人记忆</text>
  <text x="380" y="330" class="small" text-anchor="start">· 解释 / 偏好 / 承诺 / 错误 / 经验 / 关系 / 资料彼此的联系</text>
  <text x="380" y="352" class="tiny" text-anchor="start" fill="#7c2d12">让一堆文件成为连续人生 —— 难一键导出</text>

  <rect x="200" y="380" width="1200" height="100" class="box green"/>
  <text x="280" y="420" class="num" text-anchor="middle">③</text>
  <text x="380" y="420" class="label" text-anchor="start">工作方法</text>
  <text x="380" y="450" class="small" text-anchor="start">· 任务如何开始 / 哪些判断节点 / 怎样求证 / 怎样交付 / 出问题如何补救</text>
  <text x="380" y="472" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">决定能否反复把事情做成</text>

  <rect x="200" y="500" width="1200" height="100" class="box accent"/>
  <text x="280" y="540" class="num" text-anchor="middle">④</text>
  <text x="380" y="540" class="label" text-anchor="start">身份与关系</text>
  <text x="380" y="570" class="small" text-anchor="start">· 别人怎样找到你 / 为什么信任你 / 哪些客户愿意再次合作 / 在什么共同体拥有声誉</text>
  <text x="380" y="592" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">最难重建 / 散落在平台的隐含理解</text>
</g>

<!-- AI 入口箭头 -->
<rect x="40" y="500" width="140" height="100" class="box muted"/>
<text x="110" y="540" class="label" text-anchor="middle">AI</text>
<text x="110" y="570" class="small" text-anchor="middle">同时进入</text>
<text x="110" y="593" class="small" text-anchor="middle">4 层</text>

<path d="M180,550 L200,550" class="line"/>
<path d="M180,550 L200,310" class="line"/>
<path d="M180,550 L200,430" class="line"/>
<path d="M180,550 L200,180" class="line"/>

<!-- 底部 -->
<rect x="60" y="640" width="1480" height="220" class="box muted"/>
<text x="800" y="680" class="label" text-anchor="middle" fill="#7c2d12">离开的成本不再等于"换一个软件"，而接近于"重新学习怎样成为自己"</text>
<line x1="100" y1="700" x2="1500" y2="700" class="thin"/>
<text x="100" y="740" class="num" text-anchor="start" fill="#1f4e79">→</text>
<text x="160" y="740" class="label" text-anchor="start">下载按钮只是个人主权的起点</text>
<text x="100" y="770" class="small" text-anchor="start">真正的问题是：当熟悉的 AI 明天消失，</text>
<text x="100" y="795" class="small" text-anchor="start">一个人带走的是一堆文件，还是一套仍能继续工作的自己？</text>
<text x="100" y="835" class="tiny" text-anchor="start" fill="#8795a1">自留地：自己挑选 / 标记时间 / 区分事实与判断 / 定期修剪 / 解释权回到本人</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章正文 05.1</text>
</svg>
