<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-11 OPC：企业的最小有效规模正在下降</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。横轴：交易成本随 AI 下降；纵轴：组织吸纳 vs 市场调用。OPC 处于"低交易成本 + 个人编排"的新位置。同时画 6 项控制习惯：单点失效的解药。原则：生产能力集中到 1 个人身上，单点失效也集中到 1 个人身上。数据来源：第五章正文 05.11。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
.axis{stroke:#1f2933;stroke-width:2;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图5-11　OPC：企业的最小有效规模正在下降</text>
<text x="800" y="100" class="label" text-anchor="middle">责任中心可以很小，能力网络可以很大；但单点失效也集中到一个人身上</text>

<!-- 左侧 2x2：传统 vs OPC 的位置 -->
<g>
  <text x="60" y="155" class="label" text-anchor="start" fill="#1f4e79">A · OPC 在企业边界上的位置</text>

  <line x1="120" y1="500" x2="780" y2="500" class="axis"/>
  <line x1="120" y1="180" x2="120" y2="500" class="axis"/>

  <text x="450" y="535" class="small" text-anchor="middle">市场调用难度 →</text>
  <text x="450" y="555" class="tiny" text-anchor="middle" fill="#8795a1">交易成本（含协调 / 谈判 / 检查 / 争议）</text>

  <text x="80" y="200" class="small" text-anchor="end" transform="rotate(-90 80 200)">↑ 内部协调成本</text>
  <text x="80" y="350" class="small" text-anchor="end" transform="rotate(-90 80 350)">（公司雇用）</text>

  <!-- 区域 1：传统公司 -->
  <rect x="200" y="220" width="240" height="160" class="box muted" fill="#f0eee8"/>
  <text x="320" y="250" class="label" text-anchor="middle">传统大公司</text>
  <text x="320" y="285" class="small" text-anchor="middle">市场太贵</text>
  <text x="320" y="310" class="small" text-anchor="middle">全部收进企业</text>
  <text x="320" y="345" class="tiny" text-anchor="middle" fill="#8795a1">研发 / 销售 / 财务 / HR / 法务</text>

  <!-- 区域 2：传统外包 -->
  <rect x="500" y="380" width="240" height="100" class="box warm"/>
  <text x="620" y="410" class="label" text-anchor="middle">传统小工作室</text>
  <text x="620" y="440" class="small" text-anchor="middle">市场便宜但协调也贵</text>
  <text x="620" y="465" class="tiny" text-anchor="middle" fill="#8795a1">靠 1-2 个能人拼起来</text>

  <!-- 区域 3：OPC 新位置 -->
  <rect x="500" y="220" width="240" height="120" class="box accent"/>
  <text x="620" y="252" class="label" text-anchor="middle" fill="#1f4e79">OPC 新位置</text>
  <text x="620" y="280" class="small" text-anchor="middle">市场调用便宜</text>
  <text x="620" y="305" class="small" text-anchor="middle">+ 内部协调也便宜</text>
  <text x="620" y="328" class="tiny" text-anchor="middle" fill="#1f4e79">1 个最终负责人 + 多数字角色</text>

  <!-- 箭头 -->
  <path d="M460,300 L500,290" class="line" marker-end="url(#arrow)"/>
  <text x="475" y="320" class="tiny" text-anchor="middle" fill="#7c2d12" font-weight="700">边界移动</text>

  <!-- 纵轴 4 个工作 -->
  <text x="135" y="265" class="tiny" text-anchor="start" fill="#1f4e79">研究</text>
  <text x="135" y="310" class="tiny" text-anchor="start" fill="#1f4e79">产品</text>
  <text x="135" y="355" class="tiny" text-anchor="start" fill="#1f4e79">设计</text>
  <text x="135" y="400" class="tiny" text-anchor="start" fill="#1f4e79">销售 / 客服 / 财务 / 运营</text>
</g>

<!-- 右侧 6 大控制习惯 -->
<g>
  <line x1="820" y1="140" x2="820" y2="700" class="line"/>

  <text x="840" y="155" class="label" text-anchor="start" fill="#1f4e79">B · 单点失效的 6 大控制习惯</text>
  <text x="840" y="180" class="small" text-anchor="start" fill="#7c2d12">生产力集中在 1 人，单点失效也集中在 1 人</text>

  <g font-size="16">
    <rect x="840" y="200" width="720" height="65" class="box warm"/>
    <text x="860" y="232" class="num" text-anchor="start" fill="#1f4e79">①</text>
    <text x="900" y="232" class="small" text-anchor="start" font-weight="700">客户 / 内容 / 财务资料自己可读可迁移</text>
    <text x="900" y="252" class="tiny" text-anchor="start" fill="#8795a1">不锁在某个平台内部</text>

    <rect x="840" y="275" width="720" height="65" class="box accent"/>
    <text x="860" y="307" class="num" text-anchor="start" fill="#1f4e79">②</text>
    <text x="900" y="307" class="small" text-anchor="start" font-weight="700">关键工作流写下来，不只存于某个自动化</text>
    <text x="900" y="327" class="tiny" text-anchor="start" fill="#8795a1">流程文档 vs 平台私货</text>

    <rect x="840" y="350" width="720" height="65" class="box green"/>
    <text x="860" y="382" class="num" text-anchor="start" fill="#1f4e79">③</text>
    <text x="900" y="382" class="small" text-anchor="start" font-weight="700">不同数字角色使用不同权限</text>
    <text x="900" y="402" class="tiny" text-anchor="start" fill="#8795a1">研究助手不接触付款；财务助手不读私人日记</text>

    <rect x="840" y="425" width="720" height="65" class="box warm"/>
    <text x="860" y="457" class="num" text-anchor="start" fill="#1f4e79">④</text>
    <text x="900" y="457" class="small" text-anchor="start" font-weight="700">高影响行动留确认点</text>
    <text x="900" y="477" class="tiny" text-anchor="start" fill="#8795a1">任何代理不能因"方便"自动越过</text>

    <rect x="840" y="500" width="720" height="65" class="box accent"/>
    <text x="860" y="532" class="num" text-anchor="start" fill="#1f4e79">⑤</text>
    <text x="900" y="532" class="small" text-anchor="start" font-weight="700">核心任务有"能力稍弱但能接管"的替代路径</text>
    <text x="900" y="552" class="tiny" text-anchor="start" fill="#8795a1">不依赖单一供应商</text>

    <rect x="840" y="575" width="720" height="65" class="box green"/>
    <text x="860" y="607" class="num" text-anchor="start" fill="#1f4e79">⑥</text>
    <text x="900" y="607" class="small" text-anchor="start" font-weight="700">每个数字角色有单独身份，权限覆盖当前职责</text>
    <text x="900" y="627" class="tiny" text-anchor="start" fill="#8795a1">重要授权会到期；行动可回看；异常可撤销</text>
  </g>
</g>

<!-- 底部结论 -->
<g>
  <line x1="60" y1="720" x2="1540" y2="720" class="line"/>
  <rect x="60" y="740" width="1480" height="120" class="box warm"/>
  <text x="800" y="780" class="label" text-anchor="middle" fill="#7c2d12">公司的规模可以只有一人，权限仍然不该只有一种</text>
  <text x="800" y="815" class="small" text-anchor="middle">NIST 2026 把智能体身份和授权列为专门标准议题 —</text>
  <text x="800" y="838" class="small" text-anchor="middle">当软件从"被人点击的工具"变成"代表人连续行动的代理"，系统必须分辨它是谁、代表谁、获得什么授权</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章正文 05.11</text>
</svg>
