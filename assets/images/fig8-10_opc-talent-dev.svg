<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图8-10 OPC、人才与开发者：决定生态生不生长的三主体</title>
<desc>《AI主权》原创信息图，v0.1，2026-08-06。把"OPC/人才/开发者决定生态会不会生长"画成 3 主体（OPC/人才/开发者）+ 城市处于上中下游的位置 + 评价 OPC 的 3 件事 + 国家能力 6 类岗位 + NAIRR/AIRR 2 个公共算力参考。数据来源：第八章正文 08.10，截至 2026-08-06。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:20px;font-weight:700}
.small{font-size:15px}
.tiny{font-size:13px}
.num{font-size:30px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图8-10　OPC、人才与开发者决定生态会不会生长</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">水库建成以后，还需要灌溉系统把水送到田里 — AI 基础设施需要更多能生产的主体</text>

<!-- 城市位于上中下游 -->
<g>
  <text x="60" y="150" class="label">国家能力 = 集中能力分配下去 + 分散创新连接起来</text>

  <!-- 上游 -->
  <rect x="60" y="180" width="350" height="220" class="box warm"/>
  <text x="235" y="220" class="label" text-anchor="middle">上游：巨额资本</text>
  <text x="80" y="255" class="small">• 芯片</text>
  <text x="80" y="280" class="small">• 能源</text>
  <text x="80" y="305" class="small">• 云</text>
  <text x="80" y="330" class="small">• 基础模型</text>
  <text x="80" y="365" class="tiny" font-style="italic">"只建设上游 = 昂贵能力的仓库"</text>

  <!-- 城市 -->
  <rect x="430" y="180" width="350" height="220" class="box accent"/>
  <text x="605" y="220" class="label" text-anchor="middle">城市：中间连接</text>
  <text x="450" y="255" class="small">• 算力下沉到小团队</text>
  <text x="450" y="280" class="small">• 数据 / 模型 / 工具</text>
  <text x="450" y="305" class="small">• 公共底座 + 政策</text>
  <text x="450" y="330" class="small">• 真实场景</text>
  <text x="450" y="365" class="tiny" font-style="italic">"只孵化个体没共同底座 = 集体依附少数外部平台"</text>

  <!-- 下游 -->
  <rect x="800" y="180" width="350" height="220" class="box green"/>
  <text x="975" y="220" class="label" text-anchor="middle">下游：贴近场景</text>
  <text x="820" y="255" class="small">• OPC（一人 / 极小团队）</text>
  <text x="820" y="280" class="small">• 行业开发者</text>
  <text x="820" y="305" class="small">• 工业 / 农业 / 方言</text>
  <text x="820" y="330" class="small">• 真实任务 + 客户</text>
  <text x="820" y="365" class="tiny" font-style="italic">"两端同时变大"</text>

  <!-- 失效方式 -->
  <rect x="1170" y="180" width="370" height="220" class="box red"/>
  <text x="1355" y="220" class="label" text-anchor="middle">政策失效方式</text>
  <text x="1190" y="255" class="small">• 补贴制造短期注册</text>
  <text x="1190" y="280" class="small">• 指定平台扩大锁定</text>
  <text x="1190" y="305" class="small">• 个体无团队缓冲</text>
  <text x="1190" y="330" class="small">  — 法律 / 健康 / 现金流</text>
  <text x="1190" y="365" class="small" font-weight="700">评价 OPC 3 件事：</text>
  <text x="1190" y="388" class="small">① 活下来 + 进入真实市场</text>
  <text x="1190" y="406" class="small">② 核心资产可迁移</text>
  <text x="1190" y="424" class="small">③ 知识 + 收入回本地循环</text>
</g>

<!-- 国家能力 6 类岗位 -->
<g>
  <text x="60" y="445" class="label">国家能力首先是人的能力 — 6 类岗位需要专业判断</text>

  <rect x="60"  y="470" width="240" height="80" class="box accent"/>
  <text x="180" y="500" class="label" text-anchor="middle">① 采购</text>
  <text x="180" y="525" class="small" text-anchor="middle">识别演示 vs</text>
  <text x="180" y="543" class="small" text-anchor="middle">真实能力</text>

  <rect x="310" y="470" width="240" height="80" class="box warm"/>
  <text x="430" y="500" class="label" text-anchor="middle">② 法务</text>
  <text x="430" y="525" class="small" text-anchor="middle">数据流 + 模型更新</text>
  <text x="430" y="543" class="small" text-anchor="middle">怎样改变授权</text>

  <rect x="560" y="470" width="240" height="80" class="box green"/>
  <text x="680" y="500" class="label" text-anchor="middle">③ 审计</text>
  <text x="680" y="525" class="small" text-anchor="middle">检查日志 + 评测</text>
  <text x="680" y="543" class="small" text-anchor="middle">不依赖项目叙事</text>

  <rect x="810" y="470" width="240" height="80" class="box red"/>
  <text x="930" y="500" class="label" text-anchor="middle">④ 业务</text>
  <text x="930" y="525" class="small" text-anchor="middle">知道何时</text>
  <text x="930" y="543" class="small" text-anchor="middle">应该反对系统</text>

  <rect x="1060" y="470" width="240" height="80" class="box accent"/>
  <text x="1180" y="500" class="label" text-anchor="middle">⑤ 档案</text>
  <text x="1180" y="525" class="small" text-anchor="middle">保存未来仍可</text>
  <text x="1180" y="543" class="small" text-anchor="middle">解释的记录</text>

  <rect x="1310" y="470" width="230" height="80" class="box warm"/>
  <text x="1425" y="500" class="label" text-anchor="middle">⑥ 管理者</text>
  <text x="1425" y="525" class="small" text-anchor="middle">在效率压力下</text>
  <text x="1425" y="543" class="small" text-anchor="middle">守住暂停权</text>
</g>

<!-- 公共算力参考 -->
<g>
  <text x="60" y="585" class="label">把实验机会从公司分散到大学 + 学生 + 小团队 — 2 个参考</text>

  <rect x="60"  y="610" width="740" height="100" class="box accent"/>
  <text x="430" y="645" class="label" text-anchor="middle">美国 NAIRR 试点</text>
  <text x="80" y="675" class="small">• 截至 2026 已支持 600 + 研究项目</text>
  <text x="80" y="697" class="small">• 6,000 + 学生</text>
  <text x="80" y="715" class="small" font-style="italic">覆盖 50 州 + 华盛顿 + 波多黎各</text>

  <rect x="820" y="610" width="720" height="100" class="box warm"/>
  <text x="1180" y="645" class="label" text-anchor="middle">英国 AIRR 开放</text>
  <text x="840" y="675" class="small">• 20 万 — 100 万 GPU 小时</text>
  <text x="840" y="697" class="small">• 科研机会</text>
  <text x="840" y="715" class="small" font-style="italic">"把原本集中在少数公司手里的实验机会，转化为可申请 / 可比较 / 可积累的能力"</text>
</g>

<!-- 关键判断 -->
<g>
  <rect x="60" y="735" width="1480" height="120" class="box" fill="#f0eee8"/>
  <text x="800" y="775" class="label" text-anchor="middle">"技术选择的最高水平，有时是克制"</text>

  <text x="100" y="810" class="label" fill="#1f4e79">国家要为"不使用 AI"的判断留空间</text>
  <text x="100" y="832" class="small">如果要求所有项目都证明采用了 AI，工作人员会把普通规则包装成智能项目</text>

  <text x="800" y="810" class="label" fill="#1f4e79">人员调动后为什么这么选仍可被接住</text>
  <text x="800" y="832" class="small">项目不能只靠几个懂技术的热心人 — 选择 / 事故 / 异议 / 承诺都要制度化</text>
</g>

<!-- footer -->
<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 数据来源：第八章 10 节，截至 2026-08-06</text>
<text x="1540" y="880" class="tiny" text-anchor="end">《AI主权》</text>
</svg>
