<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:34px;font-weight:700} .label{font-size:23px;font-weight:700} .small{font-size:18px} .tiny{font-size:15px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图5-1　本地、受控云与公共云</text><text x="800" y="115" class="label" text-anchor="middle">先看任务敏感度，再决定部署位置；没有一种模式对所有任务都最优</text><rect x="100" y="210" width="400" height="115" class="box accent"/><text x="300.0" y="252" class="label" text-anchor="middle">本地</text><text x="300.0" y="288" class="small" text-anchor="middle">高敏感 / 可离线</text><rect x="100" y="350" width="400" height="58" class="box muted"/><text x="300.0" y="387.0" class="small" text-anchor="middle">密钥自己保管</text><rect x="100" y="425" width="400" height="58" class="box muted"/><text x="300.0" y="462.0" class="small" text-anchor="middle">明文不出本地</text><rect x="100" y="500" width="400" height="58" class="box muted"/><text x="300.0" y="537.0" class="small" text-anchor="middle">保留期自己决定</text><rect x="100" y="575" width="400" height="58" class="box muted"/><text x="300.0" y="612.0" class="small" text-anchor="middle">导出后可退出</text><rect x="600" y="210" width="400" height="115" class="box warm"/><text x="800.0" y="252" class="label" text-anchor="middle">受控云</text><text x="800.0" y="288" class="small" text-anchor="middle">中高敏感 / 需协作</text><rect x="600" y="350" width="400" height="58" class="box muted"/><text x="800.0" y="387.0" class="small" text-anchor="middle">合同与密钥边界</text><rect x="600" y="425" width="400" height="58" class="box muted"/><text x="800.0" y="462.0" class="small" text-anchor="middle">按配置可见</text><rect x="600" y="500" width="400" height="58" class="box muted"/><text x="800.0" y="537.0" class="small" text-anchor="middle">保留期可谈判</text><rect x="600" y="575" width="400" height="58" class="box muted"/><text x="800.0" y="612.0" class="small" text-anchor="middle">迁移需验证</text><rect x="1100" y="210" width="400" height="115" class="box muted"/><text x="1300.0" y="252" class="label" text-anchor="middle">公共云</text><text x="1300.0" y="288" class="small" text-anchor="middle">低敏感 / 追求便利</text><rect x="1100" y="350" width="400" height="58" class="box muted"/><text x="1300.0" y="387.0" class="small" text-anchor="middle">平台托管</text><rect x="1100" y="425" width="400" height="58" class="box muted"/><text x="1300.0" y="462.0" class="small" text-anchor="middle">按服务条款可见</text><rect x="1100" y="500" width="400" height="58" class="box muted"/><text x="1300.0" y="537.0" class="small" text-anchor="middle">平台规则决定</text><rect x="1100" y="575" width="400" height="58" class="box muted"/><text x="1300.0" y="612.0" class="small" text-anchor="middle">退出成本更高</text><text x="800" y="760" class="label" text-anchor="middle">隐私判断不是“安全 / 不安全”，而是明文、密钥、保留期与退出方式的组合</text>
<text x="60" y="865" class="tiny">原创信息图 · v0.1 · 2026-08-03 · 适配单色印刷</text></svg>