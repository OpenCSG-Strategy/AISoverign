<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图3-10 最低可行主权：4 件事保证"明天还能继续行动"</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"最低可行主权"画成 4 件事：资产可带走 / 任务可降级 / 行动有记录 / 人能接手。它不保证永远领先，也不承诺完全独立；只保证一次外部变化不会让主体立刻失去继续行动的能力。数据来源：第三章正文 + OECD AI 治理建议。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图3-10　最低可行主权：4 件事保证"明天还能继续行动"</text>
<text x="800" y="100" class="label" text-anchor="middle">如果主要 AI 服务明天停止 —— 一个人或一家机构至少应该知道 4 件事</text>

<!-- 4 件事：2x2 -->
<g>
  <rect x="60" y="160" width="730" height="280" class="box accent"/>
  <text x="425" y="200" class="num" text-anchor="middle">①</text>
  <text x="425" y="235" class="label" text-anchor="middle">哪些资产能带走</text>
  <line x1="100" y1="255" x2="750" y2="255" class="thin"/>
  <text x="100" y="290" class="small" text-anchor="start">核心数据和智能资产能以</text>
  <text x="100" y="315" class="small" text-anchor="start">可读取、可继续使用的</text>
  <text x="100" y="340" class="small" text-anchor="start">形式带走</text>
  <text x="100" y="380" class="tiny" text-anchor="start" fill="#8795a1">不是"导出一份 JSON"</text>
  <text x="100" y="402" class="tiny" text-anchor="start" fill="#8795a1">是"能继续使用的工作流"</text>
  <text x="100" y="424" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">"可携性" = 主权第一道</text>

  <rect x="810" y="160" width="730" height="280" class="box warm"/>
  <text x="1175" y="200" class="num" text-anchor="middle">②</text>
  <text x="1175" y="235" class="label" text-anchor="middle">哪些任务能降级</text>
  <line x1="850" y1="255" x2="1500" y2="255" class="thin"/>
  <text x="1175" y="290" class="small" text-anchor="middle">关键任务在主系统失效时</text>
  <text x="1175" y="315" class="small" text-anchor="middle">有经过验证的降级路径</text>
  <text x="1175" y="380" class="tiny" text-anchor="middle" fill="#8795a1">不是"所有事停摆"</text>
  <text x="1175" y="402" class="tiny" text-anchor="middle" fill="#8795a1">是"关键事仍能跑"</text>
  <text x="1175" y="424" class="tiny" text-anchor="middle" fill="#7c2d12" font-weight="700">降级 = 主动设计的备用</text>

  <rect x="60" y="460" width="730" height="280" class="box green"/>
  <text x="425" y="500" class="num" text-anchor="middle">③</text>
  <text x="425" y="535" class="label" text-anchor="middle">哪些动作已经发生</text>
  <line x1="100" y1="555" x2="750" y2="555" class="thin"/>
  <text x="100" y="590" class="small" text-anchor="start">系统以主体名义采取的</text>
  <text x="100" y="615" class="small" text-anchor="start">重要行动有记录</text>
  <text x="100" y="640" class="small" text-anchor="start">可停止、能追责</text>
  <text x="100" y="680" class="tiny" text-anchor="start" fill="#8795a1">不是"漂亮日志"</text>
  <text x="100" y="702" class="tiny" text-anchor="start" fill="#8795a1">是"可解释 + 可申诉"</text>
  <text x="100" y="724" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">记录 = 救济的前提</text>

  <rect x="810" y="460" width="730" height="280" class="box accent"/>
  <text x="1175" y="500" class="num" text-anchor="middle">④</text>
  <text x="1175" y="535" class="label" text-anchor="middle">没有 AI 时谁接手</text>
  <line x1="850" y1="555" x2="1500" y2="555" class="thin"/>
  <text x="1175" y="590" class="small" text-anchor="middle">组织中仍有人</text>
  <text x="1175" y="615" class="small" text-anchor="middle">理解任务 / 能判断</text>
  <text x="1175" y="640" class="small" text-anchor="middle">机器何时不该继续</text>
  <text x="1175" y="680" class="tiny" text-anchor="middle" fill="#8795a1">不是"没有 AI 不会做"</text>
  <text x="1175" y="702" class="tiny" text-anchor="middle" fill="#8795a1">是"AI 缺席也不掉链"</text>
  <text x="1175" y="724" class="tiny" text-anchor="middle" fill="#7c2d12" font-weight="700">人 = 不可替代的最后兜底</text>
</g>

<!-- 底部 -->
<rect x="60" y="770" width="1480" height="100" class="box muted"/>
<text x="800" y="810" class="label" text-anchor="middle" fill="#7c2d12">最低可行主权 = 不保证永远领先，也不承诺完全独立</text>
<line x1="100" y1="830" x2="1500" y2="830" class="thin"/>
<text x="800" y="855" class="small" text-anchor="middle">只保证：一次外部变化不会让主体立刻失去继续行动的能力</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第三章正文 + OECD AI 治理建议 2019/2024</text>
</svg>
