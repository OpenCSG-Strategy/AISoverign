<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="460" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一张任务图：八类节点</text>
<rect x="40" y="95" width="104" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="92.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">触发</text>
<text x="92.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">什么事件开始</text>
<line x1="145" y1="120" x2="158" y2="120" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="159" y="95" width="104" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="211.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">理解</text>
<text x="211.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">弄清要做什么</text>
<line x1="264" y1="120" x2="277" y2="120" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="278" y="95" width="104" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="330.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">检索</text>
<text x="330.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">找到要用的资料</text>
<line x1="383" y1="120" x2="396" y2="120" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="397" y="95" width="104" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="449.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">判断</text>
<text x="449.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">在选项里做决定</text>
<line x1="502" y1="120" x2="515" y2="120" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="516" y="95" width="104" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="568.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">行动</text>
<text x="568.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">调工具改外部状态</text>
<line x1="621" y1="120" x2="634" y2="120" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="635" y="95" width="104" height="50" rx="6" fill="#bbb" stroke="#111" stroke-width="2"/>
<text x="687.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">确认</text>
<text x="687.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">关键处请人把关</text>
<line x1="740" y1="120" x2="753" y2="120" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="754" y="95" width="104" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="806.0" y="126" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">验证</text>
<text x="806.0" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">是否真的达成</text>
<rect x="340" y="225" width="220" height="54" rx="6" fill="#eee" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="450" y="249" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">异常处理</text>
<text x="450" y="269" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">出错时退回哪里</text>
<path d="M568.0,176 L520,222" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<path d="M806.0,176 L560,236" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<path d="M340,252 H330.0 V180" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="340.0" y="214" font-size="12" text-anchor="start" font-weight="normal" fill="#555">退回某一步</text>
<rect x="40" y="312" width="820" height="104" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="60" y="340" font-size="14" text-anchor="start" font-weight="bold" fill="#111">每个节点都标明</text>
<rect x="60" y="354" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="152" y="372" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">数据从哪里来</text>
<rect x="258" y="354" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="350" y="372" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">模型看到了什么</text>
<rect x="456" y="354" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="548" y="372" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">调用了什么工具</text>
<rect x="654" y="354" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="746" y="372" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">用的是谁的身份</text>
<rect x="60" y="386" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="152" y="404" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">权限多久失效</text>
<rect x="258" y="386" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="350" y="404" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">失败后回到哪一步</text>
<rect x="456" y="386" width="184" height="26" rx="3" fill="#eee" stroke="#555" stroke-width="1"/>
<text x="548" y="404" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">最终由谁负责</text>
<text x="40" y="440" font-size="13" text-anchor="start" font-weight="normal" fill="#555">画的过程中常会发现：藏着一个需要人判断的环节，或者某一步要用权限过大的老接口</text>
</svg>
