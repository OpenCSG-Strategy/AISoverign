<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:34px;font-weight:700} .label{font-size:23px;font-weight:700} .small{font-size:18px} .tiny{font-size:15px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图1-3　开源打开的是哪一道门</text><text x="800" y="118" class="label" text-anchor="middle">门从窄到宽；每多开一层，既多获得一些，也仍缺一些</text><text x="820" y="190" class="label" text-anchor="middle">获得</text><text x="1230" y="190" class="label" text-anchor="middle">仍缺</text><rect x="60" y="200" width="720" height="110" class="box muted"/><text x="420.0" y="242" class="label" text-anchor="middle">开放 API</text><text x="420.0" y="278" class="small" text-anchor="middle">购买产出</text><text x="820" y="260" class="small" text-anchor="middle">输出结果</text><text x="1230" y="260" class="small" text-anchor="middle">训练数据 · 权重 · 部署位置</text><rect x="60" y="340" width="720" height="110" class="box accent"/><text x="420.0" y="382" class="label" text-anchor="middle">开放权重</text><text x="420.0" y="418" class="small" text-anchor="middle">取得训练后的设备</text><text x="820" y="400" class="small" text-anchor="middle">权重 · 微调权</text><text x="1230" y="400" class="small" text-anchor="middle">训练数据来源 · 复现材料</text><rect x="60" y="480" width="720" height="110" class="box warm"/><text x="420.0" y="522" class="label" text-anchor="middle">开放模型</text><text x="420.0" y="558" class="small" text-anchor="middle">查看权重 + 文档</text><text x="820" y="540" class="small" text-anchor="middle">查看权 · 检查权</text><text x="1230" y="540" class="small" text-anchor="middle">完整数据说明 · 训练代码</text><rect x="60" y="620" width="720" height="110" class="box green"/><text x="420.0" y="662" class="label" text-anchor="middle">开源 AI</text><text x="420.0" y="698" class="small" text-anchor="middle">训练代码 + 数据 + 流程</text><text x="820" y="680" class="small" text-anchor="middle">复现 · 改造 · 共同维护</text><text x="1230" y="680" class="small" text-anchor="middle">硬件 · 能源 · 人才 · 持续运维</text><path d="M1540,260 L1540,670" class="line" marker-end="url(#arrow)"/><text x="1505" y="460" class="tiny" text-anchor="middle">开放</text><text x="1505" y="488" class="tiny" text-anchor="middle">程度</text><text x="800" y="770" class="label" text-anchor="middle">“可以下载”只是开放起点，不是终点</text><text x="800" y="808" class="small" text-anchor="middle">依据 OSI Open Source AI Definition 1.0 与 Linux Foundation Model Openness Framework</text>
