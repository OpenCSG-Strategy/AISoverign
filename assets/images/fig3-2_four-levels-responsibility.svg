<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图3-2　四个层级,一条责任链</text><text x="800" y="115" class="label" text-anchor="middle">责任向外传递,选择与救济向内提供;四层嵌套,不能互相取代</text><rect x="240" y="160" width="1120" height="580" class="box warm" rx="24"/><text x="800" y="195" class="label" text-anchor="middle">国家 / 城市  ·  公共规则、地方生态与长期基础设施</text><rect x="320" y="220" width="960" height="460" class="box accent" rx="22"/><text x="800" y="253" class="label" text-anchor="middle">企业  ·  商业生产者与系统运营</text><rect x="400" y="280" width="800" height="340" class="box green" rx="20"/><text x="800" y="311" class="label" text-anchor="middle">组织单元  ·  部门数据隔离 / 模型自治 / 有限协同</text><rect x="480" y="340" width="640" height="220" class="box muted" rx="18"/><text x="800" y="371" class="label" text-anchor="middle">个人  ·  记忆 / 表达 / 身份 / 职业能力</text><rect x="700" y="430" width="200" height="80" class="box" fill="#1f4e79" stroke="#1f4e79" rx="14"/><text x="800" y="470" class="label" text-anchor="middle">一次 AI 任务</text><text x="800" y="492" class="tiny" text-anchor="middle">四层共同面对的对象</text><path d="M700,440 L260,200" class="redline" marker-end="url(#arrow)"/><text x="420" y="165" class="small" text-anchor="middle">责任外推(向外)</text><path d="M1340,650 L900,510" class="line" marker-end="url(#arrow)"/><text x="1180" y="730" class="small" text-anchor="middle">选择 · 救济(向内)</text><rect x="60" y="760" width="360" height="100" class="box muted"/><text x="240.0" y="802" class="label" text-anchor="middle">个人保留</text><text x="240.0" y="838" class="small" text-anchor="middle">自我决定与撤回</text><rect x="440" y="760" width="360" height="100" class="box green"/><text x="620.0" y="802" class="label" text-anchor="middle">组织连接</text><text x="620.0" y="838" class="small" text-anchor="middle">部门自治与有限协同</text><rect x="820" y="760" width="360" height="100" class="box accent"/><text x="1