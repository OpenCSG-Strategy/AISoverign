<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="520" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">按任务派活，备用模型平时就上岗</text>
<rect x="40" y="165" width="90" height="50" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="85" y="196" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">请求</text>
<line x1="132" y1="190" x2="178" y2="190" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="180" y="140" width="160" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="260" y="178" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">多模型路由</text>
<text x="260" y="202" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">先判断难度</text>
<text x="260" y="219" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">和敏感程度</text>
<line x1="342" y1="190" x2="548" y2="117" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="470" y="136.64077669902912" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">简单</text>
<rect x="550" y="95" width="190" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="645" y="123" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">便宜的小模型</text>
<line x1="342" y1="190" x2="548" y2="190" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="470" y="182.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">敏感</text>
<rect x="550" y="168" width="190" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="645" y="196" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">留在本地的模型</text>
<line x1="342" y1="190" x2="548" y2="263" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="470" y="255.35922330097088" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">难</text>
<rect x="550" y="241" width="190" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="645" y="269" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">闭源前沿模型</text>
<text x="760" y="150" font-size="12" text-anchor="start" font-weight="normal" fill="#555">某个模型出故障：</text>
<text x="760" y="168" font-size="12" text-anchor="start" font-weight="normal" fill="#555">自动降级</text>
<text x="760" y="194" font-size="12" text-anchor="start" font-weight="normal" fill="#555">慢一点、粗糙一点，</text>
<text x="760" y="212" font-size="12" text-anchor="start" font-weight="normal" fill="#555">安全规则不松</text>
<line x1="40" y1="305" x2="860" y2="305" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="40" y="335" font-size="14" text-anchor="start" font-weight="bold" fill="#111">一项关键业务</text>
<rect x="40" y="352" width="120" height="70" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="100" y="393" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">真实流量</text>
<line x1="162" y1="375" x2="256" y2="357" stroke="#111" stroke-width="5" marker-end="url(#ar)"/>
<line x1="162" y1="400" x2="256" y2="420" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="260" y="335" width="210" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="365" y="363" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">主模型　大部分流量</text>
<rect x="260" y="400" width="210" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="365" y="428" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">备用模型　一小部分</text>
<rect x="560" y="340" width="300" height="100" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="710" y="372" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">和具体模型无关的评测集</text>
<text x="710" y="398" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">企业自己的资产</text>
<text x="710" y="416" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">主模型每次升级，主备一起测</text>
<line x1="558" y1="375" x2="474" y2="357" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="558" y1="405" x2="474" y2="422" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="40" y="490" font-size="13" text-anchor="start" font-weight="normal" fill="#555">每个季度挑一个工作日，把一项业务的全部流量切到备用模型跑半天，记下质量、成本和投诉的变化</text>
</svg>
