<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-4 记忆是帮助也是解释权：3 类记忆 + 3 边界</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把个人记忆分 3 类（本人事实 / 系统提取偏好 / 模型推断）+ 3 边界（时间 / 场景 / 解释）。三者的可靠性和有效期不同，不应混成持续累积的用户画像。数据来源：第五章正文 05.2 + 自我报告研究 CHI 2025。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图5-4　记忆是帮助也是解释权：3 类记忆 + 3 边界</text>
<text x="800" y="100" class="label" text-anchor="middle">机器倾向于把记忆变成可检索、可关联、可调用的对象 —— 一个人对医生、朋友、同事、家人讲的是不同的自己</text>

<!-- 左侧：3 类记忆对象 -->
<rect x="60" y="140" width="700" height="540" class="box accent"/>
<text x="410" y="180" class="label" text-anchor="middle">3 类记忆对象（不同可靠性和有效期）</text>
<line x1="100" y1="200" x2="720" y2="200" class="thin"/>

<rect x="100" y="220" width="620" height="130" class="box warm"/>
<text x="140" y="260" class="num" text-anchor="start">A</text>
<text x="200" y="260" class="label" text-anchor="start">本人提供的事实</text>
<line x1="140" y1="280" x2="680" y2="280" class="thin"/>
<text x="140" y="310" class="small" text-anchor="start">· 你告诉系统什么</text>
<text x="140" y="335" class="small" text-anchor="start">· 可靠性高 / 有效期由本人控制</text>
<text x="140" y="360" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">可信度：最高 / 可删除</text>

<rect x="100" y="370" width="620" height="130" class="box green"/>
<text x="140" y="410" class="num" text-anchor="start">B</text>
<text x="200" y="410" class="label" text-anchor="start">系统从行为中提取的偏好</text>
<line x1="140" y1="430" x2="680" y2="430" class="thin"/>
<text x="140" y="460" class="small" text-anchor="start">· 你点击 / 停留 / 接受 / 修改</text>
<text x="140" y="485" class="small" text-anchor="start">· 反映过去的选择 / 未必代表现在的你</text>
<text x="140" y="510" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">可信度：中 / 应当可标记 + 可清除</text>

<rect x="100" y="520" width="620" height="130" class="box accent"/>
<text x="140" y="560" class="num" text-anchor="start">C</text>
<text x="200" y="560" class="label" text-anchor="start">模型进一步生成的推断</text>
<line x1="140" y1="580" x2="680" y2="580" class="thin"/>
<text x="140" y="610" class="small" text-anchor="start">· "你似乎更喜欢 A"</text>
<text x="140" y="635" class="small" text-anchor="start">· 推断可能放大旧痕迹 / 自我重复</text>
<text x="140" y="660" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">可信度：低 / 不能当事实</text>

<!-- 右侧：3 边界 -->
<rect x="780" y="140" width="760" height="540" class="box green"/>
<text x="1160" y="180" class="label" text-anchor="middle">3 边界（个人记忆需要）</text>
<line x1="820" y1="200" x2="1500" y2="200" class="thin"/>

<rect x="820" y="220" width="680" height="130" class="box warm"/>
<text x="860" y="260" class="num" text-anchor="start">①</text>
<text x="920" y="260" class="label" text-anchor="start">时间边界</text>
<line x1="860" y1="280" x2="1460" y2="280" class="thin"/>
<text x="860" y="310" class="small" text-anchor="start">事实有保质期 / 偏好会变化</text>
<text x="860" y="335" class="small" text-anchor="start">过期信息应更新或遗忘</text>
<text x="860" y="360" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">5 年前的偏好 ≠ 今天的偏好</text>

<rect x="820" y="370" width="680" height="130" class="box green"/>
<text x="860" y="410" class="num" text-anchor="start">②</text>
<text x="920" y="410" class="label" text-anchor="start">场景边界</text>
<line x1="860" y1="430" x2="1460" y2="430" class="thin"/>
<text x="860" y="460" class="small" text-anchor="start">工作助手知道的不应流向健康助手</text>
<text x="860" y="485" class="small" text-anchor="start">家庭记录不该默认进入商业任务</text>
<text x="860" y="510" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">不同场景 = 不同可见性</text>

<rect x="820" y="520" width="680" height="130" class="box accent"/>
<text x="860" y="560" class="num" text-anchor="start">③</text>
<text x="920" y="560" class="label" text-anchor="start">解释边界</text>
<line x1="860" y1="580" x2="1460" y2="580" class="thin"/>
<text x="860" y="610" class="small" text-anchor="start">AI 可提出推断 / 不能把推断当事实</text>
<text x="860" y="635" class="small" text-anchor="start">不能让一次推断永久决定未来选项</text>
<text x="860" y="660" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">人有权与过去不完全一致</text>

<!-- 底部 -->
<rect x="60" y="710" width="1480" height="150" class="box muted"/>
<text x="800" y="750" class="label" text-anchor="middle" fill="#7c2d12">不能混成一份持续累积的"用户画像" —— 否则旧偏好强化推荐，推荐强化行为，自我重复</text>
<line x1="100" y1="770" x2="1500" y2="770" class="thin"/>
<text x="100" y="805" class="num" text-anchor="start" fill="#1f4e79">→</text>
<text x="160" y="805" class="label" text-anchor="start">个人记忆管理目标：避免过时数据持续替今天的使用者作决定</text>
<text x="100" y="833" class="small" text-anchor="start">· 区分来源与推断 · 标记时间与场景 · 允许本人纠正或删除 · 把仓库变成花园（选择 / 修剪 / 重栽）</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章正文 05.2 + CHI 2025 知识工作者研究</text>
</svg>
