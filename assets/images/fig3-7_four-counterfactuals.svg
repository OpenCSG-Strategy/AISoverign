<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图3-7 主权不是控制一切：4 个反事实问题</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"主权 ≠ 控制一切"画成 4 个反事实问题：知道/拒绝/纠正/转移。如果系统明天改变条件，主体是否仍有现实回应路径？4 个全是否 = 便利变支配。集中与主权不是反义词，本地与主权也不是同义词。数据来源：第三章正文 + Trujillo et al. 2024 技术主权能力评估。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图3-7　主权不是控制一切：4 个反事实问题</text>
<text x="800" y="100" class="label" text-anchor="middle">如果系统明天改变价格 / 规则 / 模型 / 可用地区 —— 主体是否仍有现实回应路径？</text>

<!-- 顶部问题 -->
<rect x="60" y="140" width="1480" height="80" class="box warm"/>
<text x="800" y="180" class="label" text-anchor="middle">反事实检验：4 个问题</text>

<!-- 4 个问题 -->
<g>
  <rect x="60" y="240" width="350" height="270" class="box accent"/>
  <text x="235" y="280" class="num" text-anchor="middle">①</text>
  <text x="235" y="315" class="label" text-anchor="middle">知道</text>
  <line x1="100" y1="335" x2="370" y2="335" class="thin"/>
  <text x="100" y="365" class="small" text-anchor="start">他能否知道</text>
  <text x="100" y="390" class="small" text-anchor="start">变化影响了</text>
  <text x="100" y="415" class="small" text-anchor="start">什么？</text>
  <text x="100" y="450" class="tiny" text-anchor="start" fill="#8795a1">通知义务 / 透明度</text>
  <text x="100" y="475" class="tiny" text-anchor="start" fill="#8795a1">可观察性</text>
  <text x="100" y="500" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不知道 = 没有回应机会</text>

  <rect x="430" y="240" width="350" height="270" class="box warm"/>
  <text x="605" y="280" class="num" text-anchor="middle">②</text>
  <text x="605" y="315" class="label" text-anchor="middle">拒绝</text>
  <line x1="470" y1="335" x2="740" y2="335" class="thin"/>
  <text x="100" y="365" class="small" text-anchor="start">他能否拒绝</text>
  <text x="100" y="390" class="small" text-anchor="start">新的条件？</text>
  <text x="470" y="450" class="tiny" text-anchor="start" fill="#8795a1">不接受"全有全无"霸王条款</text>
  <text x="470" y="475" class="tiny" text-anchor="start" fill="#8795a1">用脚投票</text>
  <text x="470" y="500" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能拒绝 = 关系不对称</text>

  <rect x="800" y="240" width="350" height="270" class="box green"/>
  <text x="975" y="280" class="num" text-anchor="middle">③</text>
  <text x="975" y="315" class="label" text-anchor="middle">纠正</text>
  <line x1="840" y1="335" x2="1110" y2="335" class="thin"/>
  <text x="840" y="365" class="small" text-anchor="start">他能否纠正</text>
  <text x="840" y="390" class="small" text-anchor="start">已经产生的</text>
  <text x="840" y="415" class="small" text-anchor="start">结果？</text>
  <text x="840" y="450" class="tiny" text-anchor="start" fill="#8795a1">回滚 / 补偿 / 解释</text>
  <text x="840" y="475" class="tiny" text-anchor="start" fill="#8795a1">不可逆也要补救</text>
  <text x="840" y="500" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能纠正 = 错误被定型</text>

  <rect x="1170" y="240" width="370" height="270" class="box accent"/>
  <text x="1355" y="280" class="num" text-anchor="middle">④</text>
  <text x="1355" y="315" class="label" text-anchor="middle">转移</text>
  <line x1="1210" y1="335" x2="1500" y2="335" class="thin"/>
  <text x="1210" y="365" class="small" text-anchor="start">他能否把</text>
  <text x="1210" y="390" class="small" text-anchor="start">关键资产</text>
  <text x="1210" y="415" class="small" text-anchor="start">转移出去？</text>
  <text x="1210" y="450" class="tiny" text-anchor="start" fill="#8795a1">数据可携 / 流程可重建</text>
  <text x="1210" y="475" class="tiny" text-anchor="start" fill="#8795a1">第二供应商 / 备用路径</text>
  <text x="1210" y="500" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能转移 = 锁死</text>
</g>

<!-- 底部：核心论断 -->
<rect x="60" y="540" width="1480" height="300" class="box muted"/>
<text x="800" y="580" class="label" text-anchor="middle">集中 ≠ 主权反义词；本地 ≠ 主权同义词</text>
<line x1="100" y1="600" x2="1500" y2="600" class="thin"/>

<text x="100" y="640" class="label" text-anchor="start">医院 A（看似自主）</text>
<text x="100" y="665" class="small" text-anchor="start">· 开放权重 + 自家服务器</text>
<text x="100" y="685" class="small" text-anchor="start">· 但无维护团队 / 无固定版本 / 无真实评测</text>
<text x="100" y="705" class="small" text-anchor="start">· 日志散落多个应用 / 出错只能重启</text>
<text x="100" y="725" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">资产位置"更自主"；实际能力更弱</text>

<text x="800" y="640" class="label" text-anchor="start">医院 B（看似依赖）</text>
<text x="800" y="665" class="small" text-anchor="start">· 外部托管模型</text>
<text x="800" y="685" class="small" text-anchor="start">· 但保留独立知识库 / 评测集 / 灰度更新</text>
<text x="800" y="705" class="small" text-anchor="start">· 数据可导出 / 备用路径每月真实流量</text>
<text x="800" y="725" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">从资产位置看更依赖；从能力看更有主权</text>

<text x="100" y="775" class="num" text-anchor="start" fill="#7c2d12">→</text>
<text x="160" y="775" class="label" text-anchor="start">结论：技术主权研究早已区分能力与自给自足</text>
<text x="100" y="805" class="small" text-anchor="start">自主 = 理解 / 评价 / 选择 / 取得 / 改造 / 使用 —— 不是"自己造"</text>
<text x="100" y="828" class="small" text-anchor="start">集中而透明 = 可能更有主权；本地而失控 = 实质失去主权</text>

<text x="60" y="870" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第三章正文 + Trujillo et al. 2024</text>
</svg>
