</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker><marker id="arrowdown" markerWidth="14" markerHeight="14" refX="7" refY="13" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#506273"/></marker></defs>

<text x="60" y="65" class="title" text-anchor="start">图2-1　二〇二六年的双前沿：总参数、激活参数与任务切片</text>
<text x="800" y="118" class="label" text-anchor="middle">大不只等于参数更多——还要看专家池、上下文与推理；小不是把同一模型裁一刀——而是把能力切给现场</text>

<!-- 上半：三个前沿模型（大） -->
<rect x="60" y="170" width="460" height="320" class="box warm"/>
<text x="290" y="210" class="label" text-anchor="middle">Kimi K3</text>
<text x="290" y="240" class="tiny" text-anchor="middle">Moonshot AI · 2026-07 · 2.8T MoE</text>
<text x="290" y="295" class="num" text-anchor="middle">2.8T</text>
<text x="290" y="320" class="small" text-anchor="middle">总参数（专家池总量）</text>
<text x="290" y="370" class="num" text-anchor="middle">≈ 104B</text>
<text x="290" y="395" class="small" text-anchor="middle">每 Token 激活参数</text>
<line x1="80" y1="420" x2="500" y2="420" class="thin"/>
<text x="100" y="448" class="small">896 路由专家，每 Token 选 16</text>
<text x="100" y="475" class="small">上下文 ≈ 1 048 576 Token</text>

<rect x="570" y="170" width="460" height="320" class="box warm"/>
<text x="800" y="210" class="label" text-anchor="middle">DeepSeek V4-Pro</text>
<text x="800" y="240" class="tiny" text-anchor="middle">DeepSeek · 2026-04 · 1.6T MoE</text>
<text x="800" y="295" class="num" text-anchor="middle">1.6T</text>
<text x="800" y="320" class="small" text-anchor="middle">总参数</text>
<text x="800" y="370" class="num" text-anchor="middle">49B</text>
<text x="800" y="395" class="small" text-anchor="middle">每 Token 激活参数</text>
<line x1="590" y1="420" x2="1010" y2="420" class="thin"/>
<text x="610" y="448" class="small">MoE 架构 · 压缩稀疏注意力</text>
<text x="610" y="475" class="small">上下文 = 1 000 000 Token</text>

<rect x="1080" y="170" width="460" height="320" class="box warm"/>
<text x="1310" y="210" class="label" text-anchor="middle">DeepSeek V4-Flash</text>
<text x="1310" y="240" class="tiny" text-anchor="middle">DeepSeek · 2026-04 · 284B MoE</text>
<text x="1310" y="295" class="num" text-anchor="middle">284B</text>
<text x="1310" y="320" class="small" text-anchor="middle">总参数</text>
<text x="1310" y="370" class="num" text-anchor="middle">≈ 13B</text>
<text x="1310" y="395" class="small" text-anchor="middle">每 Token 激活参数</text>
<line x1="1100" y1="420" x2="1520" y2="420" class="thin"/>
<text x="1120" y="448" class="small">同代 MoE · 更快更便宜</text>
<text x="1120" y="475" class="small">上下文 = 1 000 000 Token</text>

<!-- 中间：双前沿标签 -->
<rect x="60" y="510" width="1480" height="40" class="box muted"/>
<text x="800" y="538" class="label" text-anchor="middle">↑ 能力前沿：把天花板抬高　/　↓ 部署前沿：把能力切到现场 ↑</text>

<!-- 下半：四个任务型小模型（小） -->
<rect x="60" y="580" width="350" height="240" class="box accent"/>
<text x="235" y="618" class="label" text-anchor="middle">Qwen3-ASR</text>
<text x="235" y="645" class="tiny" text-anchor="middle">语音识别专用</text>
<text x="235" y="695" class="num" text-anchor="middle">0.6B / 1.7B</text>
<text x="235" y="722" class="small" text-anchor="middle">总参数</text>
<line x1="80" y1="745" x2="390" y2="745" class="thin"/>
<text x="80" y="773" class="small">专用：录音转写、字幕</text>
<text x="80" y="800" class="small">从通用模型蒸馏而来</text>

<rect x="430" y="580" width="350" height="240" class="box accent"/>
<text x="605" y="618" class="label" text-anchor="middle">Gemma 3n (E2B / E4B)</text>
<text x="605" y="645" class="tiny" text-anchor="middle">端侧多模态</text>
<text x="605" y="695" class="num" text-anchor="middle">≈ 1.9B / 4B</text>
<text x="605" y="722" class="small" text-anchor="middle">有效内存负载</text>
<line x1="450" y1="745" x2="760" y2="745" class="thin"/>
<text x="450" y="773" class="small">参数跳过 + 分层嵌入缓存</text>
