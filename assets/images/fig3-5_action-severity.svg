<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图3-5 当机器进入现实：4 维严重性分级</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"机器进入现实"的错误严重性画成 4 维评分（权限 / 范围 / 可逆性 / 恢复难度），并分 4 级（屏上文字 → 表单提交 → 代码部署 → 物理控制）。错误级别不取决于"是否 Agent 标签"，取决于行动的实际物理/制度后果。数据来源：第三章正文 + Cruise NHTSA 同意令（2024）。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图3-5　当机器进入现实：4 维严重性分级</text>
<text x="800" y="100" class="label" text-anchor="middle">决定风险的不是"是否 Agent 标签"，而是行动本身：权限 / 范围 / 可逆性 / 恢复难度</text>

<!-- 4 列严重性 -->
<g>
  <rect x="60" y="140" width="350" height="420" class="box accent"/>
  <text x="235" y="180" class="num" text-anchor="middle">1</text>
  <text x="235" y="215" class="label" text-anchor="middle">屏上文字</text>
  <line x1="100" y1="235" x2="370" y2="235" class="thin"/>
  <text x="100" y="265" class="small" text-anchor="start">· 权限：账号级</text>
  <text x="100" y="290" class="small" text-anchor="start">· 范围：当前用户/会话</text>
  <text x="100" y="315" class="small" text-anchor="start">· 可逆：可改/可删</text>
  <text x="100" y="340" class="small" text-anchor="start">· 恢复：撤销 + 道歉</text>
  <text x="100" y="380" class="small" text-anchor="start" fill="#1f4e79">代表：聊天回复、邮件草稿</text>
  <text x="100" y="430" class="small" text-anchor="start" fill="#8795a1">"模型"时代</text>
  <text x="100" y="460" class="small" text-anchor="start" fill="#8795a1">典型错误：错别字、虚构判例</text>
  <text x="100" y="490" class="tiny" text-anchor="start" fill="#8795a1">Mata v. Avianca 制裁案（2023）</text>

  <rect x="430" y="140" width="350" height="420" class="box warm"/>
  <text x="605" y="180" class="num" text-anchor="middle">2</text>
  <text x="605" y="215" class="label" text-anchor="middle">表单提交</text>
  <line x1="470" y1="235" x2="740" y2="235" class="thin"/>
  <text x="470" y="265" class="small" text-anchor="start">· 权限：业务系统</text>
  <text x="470" y="290" class="small" text-anchor="start">· 范围：被操作人/记录</text>
  <text x="470" y="315" class="small" text-anchor="start">· 可逆：需走流程撤销</text>
  <text x="470" y="340" class="small" text-anchor="start">· 恢复：补偿 + 解释</text>
  <text x="470" y="380" class="small" text-anchor="start" fill="#1f4e79">代表：拒绝福利、改订单、取消资格</text>
  <text x="470" y="430" class="small" text-anchor="start" fill="#8795a1">"工具调用"时代</text>
  <text x="470" y="460" class="small" text-anchor="start" fill="#8795a1">典型错误：错误扣款、错误改档</text>
  <text x="470" y="490" class="tiny" text-anchor="start" fill="#8795a1">受影响人：1 到数万</text>

  <rect x="800" y="140" width="350" height="420" class="box green"/>
  <text x="975" y="180" class="num" text-anchor="middle">3</text>
  <text x="975" y="215" class="label" text-anchor="middle">代码 / 部署</text>
  <line x1="840" y1="235" x2="1110" y2="235" class="thin"/>
  <text x="840" y="265" class="small" text-anchor="start">· 权限：写入生产</text>
  <text x="840" y="290" class="small" text-anchor="start">· 范围：所有用户/服务</text>
  <text x="840" y="315" class="small" text-anchor="start">· 可逆：版本回滚</text>
  <text x="840" y="340" class="small" text-anchor="start">· 恢复：回滚 + 道歉 + 复盘</text>
  <text x="840" y="380" class="small" text-anchor="start" fill="#1f4e79">代表：提交 PR、发布、修改主数据</text>
  <text x="840" y="430" class="small" text-anchor="start" fill="#8795a1">"代理行动"时代</text>
  <text x="840" y="460" class="small" text-anchor="start" fill="#8795a1">典型错误：删库、下发错误参数</text>
  <text x="840" y="490" class="tiny" text-anchor="start" fill="#8795a1">级联效应 + 长尾</text>

  <rect x="1170" y="140" width="370" height="420" class="box accent"/>
  <text x="1355" y="180" class="num" text-anchor="middle">4</text>
  <text x="1355" y="215" class="label" text-anchor="middle">物理 / 现实控制</text>
  <line x1="1210" y1="235" x2="1500" y2="235" class="thin"/>
  <text x="1210" y="265" class="small" text-anchor="start">· 权限：设备 / 机器</text>
  <text x="1210" y="290" class="small" text-anchor="start">· 范围：物理环境</text>
  <text x="1210" y="315" class="small" text-anchor="start">· 可逆：通常无法</text>
  <text x="1210" y="340" class="small" text-anchor="start">· 恢复：补救 + 赔偿 + 调查</text>
  <text x="1210" y="380" class="small" text-anchor="start" fill="#7c2d12">代表：自动驾驶、医疗决策、机器人</text>
  <text x="1210" y="430" class="small" text-anchor="start" fill="#8795a1">"现实状态不可重写"</text>
  <text x="1210" y="460" class="small" text-anchor="start" fill="#8795a1">典型错误：拖行行人、错发药物</text>
  <text x="1210" y="490" class="tiny" text-anchor="start" fill="#8795a1">Cruise NHTSA 同意令（2024）</text>
</g>

<!-- 底部：核心论断 -->
<rect x="60" y="600" width="1480" height="240" class="box muted"/>
<text x="800" y="640" class="label" text-anchor="middle">评价系统不能只看平均成功率，要看"最严重的一次能走多远"</text>
<line x1="100" y1="660" x2="1500" y2="660" class="thin"/>
<text x="100" y="700" class="num" text-anchor="start">→</text>
<text x="160" y="700" class="label" text-anchor="start">错误能否被发现</text>
<text x="100" y="730" class="small" text-anchor="start">未发现 = 没有补救机会</text>
<text x="100" y="770" class="num" text-anchor="start">→</text>
<text x="160" y="770" class="label" text-anchor="start">系统能否暂停</text>
<text x="100" y="800" class="small" text-anchor="start">独立于 Agent 的停止开关</text>
<text x="100" y="820" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">风险取决于权限 / 范围 / 可逆性 / 恢复难度 —— 不是产品是否贴着"Agent"标签</text>

<text x="60" y="870" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第三章正文 + Cruise NHTSA 同意令（2024）</text>
</svg>
