<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图2-2　六种可以检验的能力</text><text x="800" y="118" class="label" text-anchor="middle">可治理委托 = 任务边界清楚 + 状态可见 + 授权可撤 + 结果可复盘</text><circle cx="800" cy="510" r="115" fill="#1f4e79" stroke="#34495e" stroke-width="3"/><text x="800" y="498" class="label" text-anchor="middle">可治理</text><text x="800" y="528" fill="white" class="label" text-anchor="middle">委托</text><text x="800" y="558" fill="white" class="tiny" text-anchor="middle">任务 · 状态 · 授权</text><rect x="670.0" y="150.0" width="260" height="120" class="box warm"/><text x="800.0" y="192.0" class="label" text-anchor="middle">选择</text><text x="800.0" y="228.0" class="small" text-anchor="middle">能否看见不同方案的成本、限制与风险</text><path d="M800.0,150.0 L800.0,395.0" class="line" marker-end="url(#arrow)"/><rect x="929.8076211353316" y="300.0" width="260" height="120" class="box muted"/><text x="1059.8076211353316" y="342.0" class="label" text-anchor="middle">替换</text><text x="1059.8076211353316" y="378.0" class="small" text-anchor="middle">条件变化后，另一套系统能否接手</text><path d="M947.2243186433545,330.0 L899.5929214352104,452.5" class="line" marker-end="url(#arrow)"/><rect x="929.8076211353316" y="600.0" width="260" height="120" class="box muted"/><text x="1059.8076211353316" y="642.0" class="label" text-anchor="middle">迁移</text><text x="1059.8076211353316" y="678.0" class="small" text-anchor="middle">带走的不只是文件，还有提示、评测、习惯</text><path d="M947.2243186433545,690.0 L899.5929214352104,567.5" class="line" marker-end="url(#arrow)"/><rect x="670.0" y="750.0" width="260" height="120" class="box muted"/><text x="800.0" y="792.0" class="label" text-anchor="middle">演进</text><text x="800.0" y="828.0" class="small" text-anchor="middle">五年后仍能控制，需要版本与维护</text><path d="M800.0,870.0 L800.0,625.0" class="line" marker-end="url(#arrow)"/><rect x="410.1923788646684" y="600.0" width="260" height="120" class="box muted"/><text x="540.1923788646684" y="642.0" class="label" text-anchor="middle">组合</text><text x="540.1923788646684" y="678.0" class="small" text-anchor="middle">不把所有问题都变成同一种生成问题</text><path d="M652.7756813566455,690.0 L700.4070785647896,567.5" class="line" marker-end="url(#arrow)"/><rect x="410.1923788646684" y="300.0" width="260" height="120" class="box warm"/><text x="540.1923788646684" y="342.0" class="label" text-anchor="middle">审计</text><text x="540.1923788646684" y="378.0" class="small" text-anchor="middle">证据在模型之外，并能沿链条回到原始材料</text><path d="M652.7756813566455,330.0 L700.4070785647896,452.5" class="line" marker-end="url(#arrow)"/><text x="800" y="870" class="label" text-anchor="middle">六种能力不会自动和谐；控制必须与影响相称</text>
