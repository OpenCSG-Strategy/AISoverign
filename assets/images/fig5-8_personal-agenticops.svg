<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-8 个人版 AgenticOps：4 步把"我大概信任"翻译成可检查的动作</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"个人版 AgenticOps"画成 4 步：① 任务契约（写清目标/资料/动作/回询） ② 角色钥匙（每个数字角色单独身份） ③ 行动门（不可逆动作前置确认） ④ 收据（每张可理解）。最后回到 4 问：看见/做/叫停/负责。数据来源：第五章 05.8 正文。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#506273"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图5-8　个人版 AgenticOps：4 步把"我大概信任"翻译成可检查的动作</text>
<text x="800" y="100" class="label" text-anchor="middle">"帮我处理一下"六个字，可能同时放开邮箱 / 通讯录 / 日历 / 外部发送 —— 结果不对时才会争论权限</text>

<!-- 4 步水平流 -->
<g>
  <rect x="60" y="160" width="350" height="280" class="box accent"/>
  <text x="235" y="200" class="num" text-anchor="middle">①</text>
  <text x="235" y="235" class="label" text-anchor="middle">任务契约</text>
  <line x1="100" y1="255" x2="370" y2="255" class="thin"/>
<text x="100" y="285" class="small" text-anchor="start">写清：</text>
<text x="100" y="308" class="small" text-anchor="start">· 目标（达成什么 / 禁止什么）</text>
<text x="100" y="331" class="small" text-anchor="start">· 资料（可读哪些）</text>
<text x="100" y="354" class="small" text-anchor="start">· 行动（可做什么）</text>
<text x="100" y="377" class="small" text-anchor="start">· 回询时刻（何时回来问）</text>
<text x="100" y="415" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">"帮我安排下周会议" → 仍太模糊</text>

  <rect x="430" y="160" width="350" height="280" class="box warm"/>
  <text x="605" y="200" class="num" text-anchor="middle">②</text>
  <text x="605" y="235" class="label" text-anchor="middle">角色钥匙</text>
  <line x1="470" y1="255" x2="740" y2="255" class="thin"/>
<text x="470" y="285" class="small" text-anchor="start">不交主密码</text>
<text x="470" y="308" class="small" text-anchor="start">· 研究助手：只读公开 + 项目</text>
<text x="470" y="331" class="small" text-anchor="start">· 客户助手：业务联系人</text>
<text x="470" y="354" class="small" text-anchor="start">· 财务助手：账单 + 付款需确认</text>
<text x="470" y="377" class="small" text-anchor="start">· 各自独立授权 + 项目后收回</text>
<text x="470" y="415" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">权限 = 风险预算</text>

  <rect x="800" y="160" width="350" height="280" class="box green"/>
  <text x="975" y="200" class="num" text-anchor="middle">③</text>
  <text x="975" y="235" class="label" text-anchor="middle">行动门</text>
  <line x1="840" y1="255" x2="1110" y2="255" class="thin"/>
<text x="840" y="285" class="small" text-anchor="start">不可逆动作：</text>
<text x="840" y="308" class="small" text-anchor="start">· 删除 / 付款 / 公开发布</text>
<text x="840" y="331" class="small" text-anchor="start">· 签署 / 授权 / 代表本人</text>
<text x="840" y="365" class="small" text-anchor="start">门的形式：</text>
<text x="840" y="388" class="small" text-anchor="start">· 金额上限 / 收件人白名单</text>
<text x="840" y="411" class="small" text-anchor="start">· 延迟发送 / 回收站 / 版本历史</text>
<text x="840" y="430" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">门靠近现实行动，不在任务开始</text>

  <rect x="1170" y="160" width="350" height="280" class="box accent"/>
  <text x="1345" y="200" class="num" text-anchor="middle">④</text>
  <text x="1345" y="235" class="label" text-anchor="middle">收据</text>
  <line x1="1210" y1="255" x2="1500" y2="255" class="thin"/>
<text x="1210" y="285" class="small" text-anchor="start">改变了现实就留 1 张：</text>
<text x="1210" y="308" class="small" text-anchor="start">· 任务是什么</text>
<text x="1210" y="331" class="small" text-anchor="start">· 用了哪些资料 / 工具</text>
<text x="1210" y="354" class="small" text-anchor="start">· 收件人 / 交易对象</text>
<text x="1210" y="377" class="small" text-anchor="start">· 是否由本人确认</text>
<text x="1210" y="415" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">收据 ≠ 聊天记录</text>
</g>

<!-- 箭头 -->
<path d="M410,300 L430,300" class="line" marker-end="url(#arrow)"/>
<path d="M780,300 L800,300" class="line" marker-end="url(#arrow)"/>
<path d="M1150,300 L1170,300" class="line" marker-end="url(#arrow)"/>

<!-- 底部：偶尔亲自接管 + 4 问 -->
<rect x="60" y="470" width="730" height="270" class="box warm"/>
<text x="425" y="510" class="label" text-anchor="middle">偶尔亲自接管</text>
<line x1="100" y1="530" x2="750" y2="530" class="thin"/>
<text x="100" y="560" class="small" text-anchor="start">每隔一段时间：</text>
<text x="100" y="583" class="small" text-anchor="start">· 不用主工具做一次资料整理</text>
<text x="100" y="606" class="small" text-anchor="start">· 把知识库导出在另一系统打开</text>
<text x="100" y="629" class="small" text-anchor="start">· 断开自动化按文字说明手动走</text>
<text x="100" y="660" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">练习暴露许多看不见的问题</text>
<text x="100" y="683" class="small" text-anchor="start" fill="#1f4e79">越早发现 → 修复成本越低</text>
<text x="100" y="715" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">备用路径必须真实承担流量</text>

<rect x="810" y="470" width="730" height="270" class="box green"/>
<text x="1175" y="510" class="label" text-anchor="middle">个人版 AgenticOps 最终 4 问</text>
<line x1="850" y1="530" x2="1500" y2="530" class="thin"/>

<text x="850" y="560" class="num" text-anchor="start">①</text>
<text x="910" y="560" class="label" text-anchor="start">它能看什么</text>
<text x="850" y="590" class="num" text-anchor="start">②</text>
<text x="910" y="590" class="label" text-anchor="start">它能做什么</text>
<text x="850" y="620" class="num" text-anchor="start">③</text>
<text x="910" y="620" class="label" text-anchor="start">谁能叫停</text>
<text x="850" y="650" class="num" text-anchor="start" fill="#7c2d12">④</text>
<text x="910" y="650" class="label" text-anchor="start">出了问题谁负责</text>

<text x="850" y="700" class="tiny" text-anchor="start" fill="#8795a1">个人通常保有叫停自己所发起任务的能力</text>
<text x="850" y="722" class="tiny" text-anchor="start" fill="#8795a1">对自己的授权和最终决定负责</text>
<text x="850" y="744" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">但平台 / 机构 / 工具的法定责任</text>
<text x="850" y="766" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能借"用户点过同意"转嫁给个人</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章 05.8 正文</text>
</svg>
