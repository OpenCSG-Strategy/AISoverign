<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图4-10 一张订单怎样穿过一家工厂</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"一张加急改型订单"在零部件工厂走过的 AgenticOps 流程画成时间线：邮件到达建任务 → 隔离附件/防注入 → 三类 Agent 受限身份并行 → 事实 vs 判断分离 → 财务确定性规则 + LLM 解释 → 报价授权底线 → ERP 草稿 + 付款/主数据分权 → 工程变更穿越确定性网关 → 生产期执行凭证 + 质量追溯 → 结束状态 + 权限撤回 + 资产沉淀。数据来源：第四章正文 04.10 构造案例。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图4-10　一张订单怎样穿过一家工厂</text>
<text x="800" y="100" class="label" text-anchor="middle">构造案例：客户加急改型订单 → 准备报价 → 检查产能 → 工艺变更 → 建立订单</text>

<!-- 时间线：10 步 -->
<g>
  <rect x="60" y="160" width="148" height="160" class="box accent"/>
  <text x="134" y="195" class="num" text-anchor="middle">1</text>
  <text x="134" y="225" class="small" text-anchor="middle">邮件到达</text>
  <text x="80" y="250" class="tiny" text-anchor="start">建任务 ID</text>
  <text x="80" y="268" class="tiny" text-anchor="start">客户/要求</text>
  <text x="80" y="286" class="tiny" text-anchor="start">截止时间</text>
  <text x="80" y="304" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">允许资料 + 允许动作</text>

  <rect x="222" y="160" width="148" height="160" class="box warm"/>
  <text x="296" y="195" class="num" text-anchor="middle">2</text>
  <text x="296" y="225" class="small" text-anchor="middle">隔离附件</text>
  <text x="242" y="250" class="tiny" text-anchor="start">解析 + 查毒</text>
  <text x="242" y="268" class="tiny" text-anchor="start">来源标记</text>
  <text x="242" y="290" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">"请忽略以前规则"</text>
  <text x="242" y="308" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能改 Agent 权限</text>

  <rect x="384" y="160" width="148" height="160" class="box green"/>
  <text x="458" y="195" class="num" text-anchor="middle">3</text>
  <text x="458" y="225" class="small" text-anchor="middle">三类 Agent</text>
  <text x="404" y="250" class="tiny" text-anchor="start">销售：客户+历史</text>
  <text x="404" y="268" class="tiny" text-anchor="start">工程：图纸+质量</text>
  <text x="404" y="286" class="tiny" text-anchor="start">采购：供应商+市场</text>
  <text x="404" y="304" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">各自受限身份</text>

  <rect x="546" y="160" width="148" height="160" class="box accent"/>
  <text x="620" y="195" class="num" text-anchor="middle">4</text>
  <text x="620" y="225" class="small" text-anchor="middle">事实 vs 判断</text>
  <text x="566" y="250" class="tiny" text-anchor="start">设备能力：手册</text>
  <text x="566" y="268" class="tiny" text-anchor="start">库存：某时点</text>
  <text x="566" y="286" class="tiny" text-anchor="start">交期：正式承诺</text>
  <text x="566" y="304" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">无来源 ≠ 事实</text>

  <rect x="708" y="160" width="148" height="160" class="box warm"/>
  <text x="782" y="195" class="num" text-anchor="middle">5</text>
  <text x="782" y="225" class="small" text-anchor="middle">财务</text>
  <text x="728" y="250" class="tiny" text-anchor="start">确定性程序算：</text>
  <text x="728" y="268" class="tiny" text-anchor="start">材料/工时/税费/</text>
  <text x="728" y="286" class="tiny" text-anchor="start">最低毛利</text>
  <text x="728" y="304" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">LLM 只解释差异</text>

  <rect x="870" y="160" width="148" height="160" class="box green"/>
  <text x="944" y="195" class="num" text-anchor="middle">6</text>
  <text x="944" y="225" class="small" text-anchor="middle">授权底线</text>
  <text x="910" y="250" class="tiny" text-anchor="start">报价低于底线</text>
  <text x="910" y="268" class="tiny" text-anchor="start">→ 暂停</text>
  <text x="910" y="290" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不"赢得客户"</text>
  <text x="910" y="308" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">绕过规则</text>

  <rect x="1032" y="160" width="148" height="160" class="box accent"/>
  <text x="1106" y="195" class="num" text-anchor="middle">7</text>
  <text x="1106" y="225" class="small" text-anchor="middle">ERP 草稿</text>
  <text x="1072" y="250" class="tiny" text-anchor="start">可以建订单</text>
  <text x="1072" y="268" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不同时拿：</text>
  <text x="1072" y="290" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">付款 / 改主数据</text>
  <text x="1072" y="308" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">/ 下发设备参数</text>

  <rect x="1194" y="160" width="148" height="160" class="box warm"/>
  <text x="1268" y="195" class="num" text-anchor="middle">8</text>
  <text x="1268" y="225" class="small" text-anchor="middle">工程变更</text>
  <text x="1234" y="250" class="tiny" text-anchor="start">先仿真 + 测试</text>
  <text x="1234" y="268" class="tiny" text-anchor="start">到 PLC 之前</text>
  <text x="1234" y="290" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">概率性建议</text>
  <text x="1234" y="308" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">穿过确定性网关</text>

  <rect x="1356" y="160" width="184" height="160" class="box green"/>
  <text x="1448" y="195" class="num" text-anchor="middle">9</text>
  <text x="1448" y="225" class="small" text-anchor="middle">生产期</text>
  <text x="1376" y="250" class="tiny" text-anchor="start">批次 / 设备状态</text>
  <text x="1376" y="268" class="tiny" text-anchor="start">模型 / 知识版本</text>
  <text x="1376" y="286" class="tiny" text-anchor="start">人工批准 / 实际产出</text>
  <text x="1376" y="304" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">→ 同一份执行凭证</text>
</g>

<!-- 箭头连接 -->
<g>
  <line x1="208" y1="240" x2="222" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="370" y1="240" x2="384" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="532" y1="240" x2="546" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="694" y1="240" x2="708" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="856" y1="240" x2="870" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="1018" y1="240" x2="1032" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="1180" y1="240" x2="1194" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="1342" y1="240" x2="1356" y2="240" class="line" marker-end="url(#arrow)"/>
</g>

<!-- 底部：结尾 + 核心论断 -->
<rect x="60" y="350" width="1480" height="180" class="box accent"/>
<text x="800" y="390" class="num" text-anchor="middle" fill="#7c2d12">10</text>
<text x="800" y="420" class="label" text-anchor="middle">结束状态</text>
<line x1="100" y1="440" x2="1500" y2="440" class="thin"/>
<text x="100" y="475" class="num" text-anchor="start">→</text>
<text x="160" y="475" class="label" text-anchor="start">临时权限撤回</text>
<text x="100" y="500" class="num" text-anchor="start">→</text>
<text x="160" y="500" class="label" text-anchor="start">未采用附件按期限处理</text>
<text x="100" y="525" class="num" text-anchor="start">→</text>
<text x="160" y="525" class="label" text-anchor="start">实际成本 / 质量 / 投诉进入评测和学习资产</text>

<!-- 中间插入的"质检异常"分支 -->
<rect x="60" y="560" width="720" height="160" class="box muted"/>
<text x="420" y="595" class="label" text-anchor="middle">质检异常 → 归因到具体环节</text>
<line x1="100" y1="615" x2="700" y2="615" class="thin"/>
<text x="100" y="645" class="small" text-anchor="start">问题来源：客户图纸？旧工艺？</text>
<text x="100" y="670" class="small" text-anchor="start">模型建议？人工修改？设备漂移？</text>
<text x="100" y="700" class="tiny" text-anchor="start" fill="#8795a1">没有执行凭证 + 完整记录 = 无法定位</text>

<rect x="820" y="560" width="720" height="160" class="box muted"/>
<text x="1180" y="595" class="label" text-anchor="middle" fill="#7c2d12">这个案例不证明 Agent 一定比原流程高效</text>
<line x1="860" y1="615" x2="1500" y2="615" class="thin"/>
<text x="860" y="645" class="small" text-anchor="start">它展示：机器跨越部门和系统连续行动时，</text>
<text x="860" y="668" class="small" text-anchor="start">任务契约 / 身份 / 版本 / 评测 / 行动门 /</text>
<text x="860" y="691" class="small" text-anchor="start">执行凭证 / 事故机制 / 反馈治理</text>
<text x="860" y="714" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">必须同时存在。缺任何一项，局部效率</text>
<text x="860" y="737" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">可能以责任断裂为代价</text>

<!-- 底部 -->
<rect x="60" y="750" width="1480" height="110" class="box muted"/>
<text x="800" y="790" class="label" text-anchor="middle">下一节：最低可行 AgenticOps —— 小团队从一张任务单、几个独立账号、一套真实测试、一次停止演练开始</text>
<line x1="100" y1="810" x2="1500" y2="810" class="thin"/>
<text x="100" y="838" class="small" text-anchor="start">控制强度应随数据敏感度、行动权、影响人数、不可逆性、运行时间增加</text>
<text x="100" y="858" class="small" text-anchor="start" fill="#1f4e79">不因组织规模小就消失，也不因规模大就无限加码</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第四章正文 04.10 构造案例</text>
</svg>
