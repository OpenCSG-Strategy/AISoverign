<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="480" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">离机器越近，把关越严</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">以蒂森克虏伯与西门子工业 Copilot 为例；各级把关方式为示意，并非厂商公布的分级</text>
<rect x="60" y="340" width="118" height="90" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="119" y="366" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">读手册</text>
<text x="119" y="390" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">把关：</text>
<text x="119" y="408" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">随时可用</text>
<rect x="195" y="295" width="118" height="135" rx="4" fill="#f4f4f4" stroke="#111" stroke-width="1.5"/>
<text x="254" y="321" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">解释报错</text>
<text x="254" y="345" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">把关：</text>
<text x="254" y="363" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">随时可用</text>
<rect x="330" y="250" width="118" height="180" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="1.5"/>
<text x="389" y="276" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">写控制代码</text>
<text x="389" y="300" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">把关：</text>
<text x="389" y="318" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">人工检查</text>
<rect x="465" y="205" width="118" height="225" rx="4" fill="#d4d4d4" stroke="#111" stroke-width="1.5"/>
<text x="524" y="231" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">写进工程项目</text>
<text x="524" y="255" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">把关：</text>
<text x="524" y="273" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">测试环境验证</text>
<rect x="600" y="160" width="118" height="270" rx="4" fill="#bdbdbd" stroke="#111" stroke-width="1.5"/>
<text x="659" y="186" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">下发到控制器</text>
<text x="659" y="210" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">把关：</text>
<text x="659" y="228" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">安全网关逐项校验</text>
<rect x="735" y="115" width="118" height="315" rx="4" fill="#9e9e9e" stroke="#111" stroke-width="1.5"/>
<text x="794" y="141" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">修改生产参数</text>
<text x="794" y="165" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">把关：</text>
<text x="794" y="183" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">有权的人批准</text>
<line x1="60" y1="452" x2="870" y2="452" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
<text x="60" y="468" font-size="13" text-anchor="start" font-weight="normal" fill="#555">后果越来越重、越来越难撤回 →</text>
</svg>
