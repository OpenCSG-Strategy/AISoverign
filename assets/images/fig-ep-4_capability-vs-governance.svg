<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图结语-4　开源改变能力分配，但不取消治理</text><text x="800" y="115" class="label" text-anchor="middle">两条平行强调——为什么开源不能替代治理</text><text x="60" y="200" class="label" text-anchor="start">能力扩散（开源可以扩大）</text><rect x="60" y="240" width="1480" height="110" class="box green"/><text x="800.0" y="282" class="label" text-anchor="middle">扩散</text><text x="800.0" y="318" class="small" text-anchor="middle">开放权重 + 蒸馏 + 量化 + 论文 + 人才流动 → 能力扩散到更多主体</text><path d="M150,400 C400,380 700,360 900,350 C1100,340 1300,330 1500,320" stroke="#10b981" stroke-width="5" fill="none"/><rect x="60" y="420" width="1480" height="90" class="box muted"/><text x="800.0" y="462" class="label" text-anchor="middle">交汇处</text><text x="800.0" y="498" class="small" text-anchor="middle">能力扩散到更多主体，治理边界仍然必要——开源让更多人能改，但不取消谁负责改、谁能替换</text><text x="60" y="540" class="label" text-anchor="start">治理边界（开源不能替代）</text><rect x="60" y="580" width="1480" height="110" class="box warm"/><text x="800.0" y="622" class="label" text-anchor="middle">边界</text><text x="800.0" y="658" class="small" text-anchor="middle">审计 + 凭证 + 申诉 + 替换 + 公共责任</text><path d="M150,770 C400,750 700,730 900,720 C1100,710 1300,700 1500,690" stroke="#ef4444" stroke-width="5" fill="none"/><text x="1500" y="318" class="small" text-anchor="start">扩散 ↑</text><text x="1500" y="685" class="small" text-anchor="start">集中 →</text>
