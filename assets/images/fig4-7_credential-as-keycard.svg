<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图4-7 身份必须跟着任务走：凭证 = 行动房卡</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"身份跟着任务走"画成嵌套委托链：每向下一层，权限缩小、期限缩短、用途变具体。执行凭证类似酒店房卡 —— 不是"员工的全部数字身份"，而是"为一项任务切出的一张行动房卡"。NIST 2026 把 Agent 识别/认证/最小权限/代表他人行动放在同一问题中。数据来源：第四章正文 + NIST 2026 AI Agent 识别概念文件。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图4-7　身份必须跟着任务走：凭证 = 行动房卡</text>
<text x="800" y="100" class="label" text-anchor="middle">每向下一层：权限缩小、期限缩短、用途变具体；最危险的是把人/组织的长期密钥沿委托链转交</text>

<!-- 左侧：组织委托链（嵌套） -->
<rect x="60" y="140" width="700" height="600" class="box accent"/>
<text x="410" y="180" class="label" text-anchor="middle">组织委托链：每向下一层权限都缩小</text>
<line x1="100" y1="200" x2="720" y2="200" class="thin"/>

<rect x="220" y="220" width="380" height="100" class="box warm"/>
<text x="410" y="250" class="label" text-anchor="middle">董事会</text>
<text x="410" y="278" class="small" text-anchor="middle">授权管理层使用一笔预算</text>
<text x="410" y="298" class="tiny" text-anchor="middle" fill="#1f4e79" font-weight="700">权限：金额上限 / 用途范围 / 期限 12 个月</text>

<path d="M410,320 L410,345" class="line" marker-end="url(#arrow)"/>

<rect x="240" y="350" width="340" height="100" class="box green"/>
<text x="410" y="380" class="label" text-anchor="middle">管理层</text>
<text x="410" y="408" class="small" text-anchor="middle">把其中一部分交给项目负责人</text>
<text x="410" y="428" class="tiny" text-anchor="middle" fill="#1f4e79" font-weight="700">权限：金额更低 / 用途更具体 / 期限 6 个月</text>

<path d="M410,450 L410,475" class="line" marker-end="url(#arrow)"/>

<rect x="260" y="480" width="300" height="100" class="box accent"/>
<text x="410" y="510" class="label" text-anchor="middle">项目负责人</text>
<text x="410" y="538" class="small" text-anchor="middle">把它分到每个具体任务</text>
<text x="410" y="558" class="tiny" text-anchor="middle" fill="#1f4e79" font-weight="700">权限：单一项目 / 期限 1 个月</text>

<path d="M410,580 L410,605" class="line" marker-end="url(#arrow)"/>

<rect x="280" y="610" width="260" height="100" class="box warm"/>
<text x="410" y="640" class="label" text-anchor="middle">Agent 执行凭证</text>
<text x="410" y="668" class="small" text-anchor="middle">为一项任务切出的一张房卡</text>
<text x="410" y="688" class="tiny" text-anchor="middle" fill="#7c2d12" font-weight="700">权限：指定资源 / 期限 1 小时</text>

<!-- 右侧：行动房卡 5 要素 + 错误 vs 正确 -->
<rect x="780" y="140" width="760" height="280" class="box green"/>
<text x="1160" y="180" class="label" text-anchor="middle">一张"行动房卡"至少回答 5 件事</text>
<line x1="820" y1="200" x2="1500" y2="200" class="thin"/>

<text x="820" y="235" class="num" text-anchor="start">①</text>
<text x="880" y="235" class="label" text-anchor="start">代表谁</text>
<text x="820" y="265" class="num" text-anchor="start">②</text>
<text x="880" y="265" class="label" text-anchor="start">允许访问哪个资源</text>
<text x="820" y="295" class="num" text-anchor="start">③</text>
<text x="880" y="295" class="label" text-anchor="start">可以采取什么动作</text>
<text x="820" y="325" class="num" text-anchor="start">④</text>
<text x="880" y="325" class="label" text-anchor="start">有效到何时</text>
<text x="820" y="355" class="num" text-anchor="start" fill="#7c2d12">⑤</text>
<text x="880" y="355" class="label" text-anchor="start">是否允许再委托</text>

<text x="820" y="395" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">任务结束 / 取消 / 风险升高 → 凭证失效</text>

<!-- 错误 vs 正确 -->
<rect x="780" y="450" width="370" height="290" class="box warm"/>
<text x="965" y="490" class="label" text-anchor="middle" fill="#7c2d12">✗ 错误做法</text>
<line x1="820" y1="510" x2="1110" y2="510" class="thin"/>
<text x="820" y="540" class="small" text-anchor="start">把人的长期账号 /</text>
<text x="820" y="563" class="small" text-anchor="start">组织级密钥直接交给 Agent</text>
<text x="820" y="595" class="small" text-anchor="start" fill="#8795a1">让 Agent 沿委托链</text>
<text x="820" y="618" class="small" text-anchor="start" fill="#8795a1">继续转交</text>
<text x="820" y="660" class="tiny" text-anchor="start" fill="#7c2d12">日志只能显示</text>
<text x="820" y="682" class="tiny" text-anchor="start" fill="#7c2d12">"某员工账号执行"</text>
<text x="820" y="704" class="tiny" text-anchor="start" fill="#7c2d12">无法区分人 / Agent / 注入</text>

<rect x="1170" y="450" width="370" height="290" class="box green"/>
<text x="1355" y="490" class="label" text-anchor="middle" fill="#1f4e79">✓ 正确做法</text>
<line x1="1210" y1="510" x2="1500" y2="510" class="thin"/>
<text x="1210" y="540" class="small" text-anchor="start">为具体任务签发</text>
<text x="1210" y="563" class="small" text-anchor="start">短期 / 受限 / 可撤销的</text>
<text x="1210" y="586" class="small" text-anchor="start">执行凭证</text>
<text x="1210" y="618" class="small" text-anchor="start" fill="#8795a1">像酒店房卡 —— 入住期间</text>
<text x="1210" y="641" class="small" text-anchor="start" fill="#8795a1">只打开指定房间</text>
<text x="1210" y="680" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">AI 获得的不是</text>
<text x="1210" y="702" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">"人的完整数字身份"</text>
<text x="1210" y="724" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">而是"一张行动房卡"</text>

<!-- 底部 -->
<rect x="60" y="770" width="1480" height="90" class="box muted"/>
<text x="800" y="805" class="label" text-anchor="middle">凭证解决"有没有资格" —— 任务规则与结果校验还要解决"是不是应该"</text>
<line x1="100" y1="825" x2="1500" y2="825" class="thin"/>
<text x="800" y="850" class="small" text-anchor="middle" fill="#7c2d12">一张只能付 1000 元的卡，仍可能付错收款人 —— 授权 ≠ 正确</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第四章正文 + NIST 2026 AI Agent 识别概念文件</text>
</svg>
