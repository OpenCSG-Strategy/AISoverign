<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-13 OPC 的一天：效率如何变成秩序</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"OPC 一天"画成 6 个助手各自负责的边界（研究/项目/财务/写作/发布）+ 共同特征：各看各的、高影响停在人前、资产留底座、任何助手可被替换。底部：一人公司的董事会 / 什么时候该招真人。数据来源：第五章 05.13 正文。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图5-13　OPC 的一天：效率如何变成秩序</text>
<text x="800" y="100" class="label" text-anchor="middle">从表面看这套系统没有那么惊艳 —— 但它形成了一种秩序：不同角色只看各自需要的信息</text>

<!-- 一天时间线 6 个角色 -->
<rect x="60" y="140" width="1480" height="60" class="box warm"/>
<text x="800" y="180" class="label" text-anchor="middle">OPC 一天：6 个助手各自看自己的一份</text>

<g>
  <rect x="60" y="220" width="240" height="240" class="box accent"/>
  <text x="180" y="260" class="num" text-anchor="middle">08:00</text>
  <text x="180" y="295" class="label" text-anchor="middle">研究助手</text>
  <line x1="80" y1="315" x2="280" y2="315" class="thin"/>
<text x="80" y="345" class="small" text-anchor="start">汇总 24h 公开资料</text>
<text x="80" y="365" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">只读订阅 + 指定研究文件夹</text>
<text x="80" y="385" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能进客户目录</text>
<text x="80" y="410" class="tiny" text-anchor="start" fill="#8795a1">每条摘要附来源 + 日期</text>
<text x="80" y="430" class="tiny" text-anchor="start" fill="#8795a1">未确认 → "待核验"</text>

  <rect x="320" y="220" width="240" height="240" class="box warm"/>
  <text x="440" y="260" class="num" text-anchor="middle">09:00</text>
  <text x="440" y="295" class="label" text-anchor="middle">项目助手</text>
  <line x1="340" y1="315" x2="540" y2="315" class="thin"/>
<text x="340" y="345" class="small" text-anchor="start">按客户邮件更新任务板</text>
<text x="340" y="365" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">可识别截止日期</text>
<text x="340" y="385" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不可自动接受新增工作范围</text>
<text x="340" y="410" class="tiny" text-anchor="start" fill="#8795a1">价格 / 时间 / 版权</text>
<text x="340" y="430" class="tiny" text-anchor="start" fill="#8795a1">→ 只生成草稿</text>

  <rect x="580" y="220" width="240" height="240" class="box green"/>
  <text x="700" y="260" class="num" text-anchor="middle">12:00</text>
  <text x="700" y="295" class="label" text-anchor="middle">财务助手</text>
  <line x1="600" y1="315" x2="800" y2="315" class="thin"/>
<text x="600" y="345" class="small" text-anchor="start">检查即将到期发票</text>
<text x="600" y="365" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">可读金额 + 付款状态</text>
<text x="600" y="385" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">可准备提醒邮件</text>
<text x="600" y="410" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能看私人银行账户</text>
<text x="600" y="430" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">不能改收款信息</text>

  <rect x="840" y="220" width="240" height="240" class="box accent"/>
  <text x="960" y="260" class="num" text-anchor="middle">14:00</text>
  <text x="960" y="295" class="label" text-anchor="middle">写作助手</text>
  <line x1="860" y1="315" x2="1060" y2="315" class="thin"/>
<text x="860" y="345" class="small" text-anchor="start">读项目访谈 + 笔记</text>
<text x="860" y="365" class="small" text-anchor="start">生成 3 个结构</text>
<text x="860" y="385" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">看不到其他客户资料</text>
<text x="860" y="405" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">不读私人日记</text>
<text x="860" y="430" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">创作者从 3 个里重写一个</text>

  <rect x="1100" y="220" width="240" height="240" class="box warm"/>
  <text x="1220" y="260" class="num" text-anchor="middle">18:00</text>
  <text x="1220" y="295" class="label" text-anchor="middle">发布助手</text>
  <line x1="1120" y1="315" x2="1320" y2="315" class="thin"/>
<text x="1120" y="345" class="small" text-anchor="start">检查链接 / 图片 / 错别字</text>
<text x="1120" y="365" class="tiny" text-anchor="start" fill="#1f4e79" font-weight="700">公开发布需本人点击</text>
<text x="1120" y="385" class="tiny" text-anchor="start" fill="#8795a1">记录最终版本 + 修改原因</text>
<text x="1120" y="410" class="tiny" text-anchor="start" fill="#8795a1">供下一次复盘</text>

  <rect x="1360" y="220" width="180" height="240" class="box muted"/>
  <text x="1450" y="295" class="label" text-anchor="middle" fill="#7c2d12">全部共同</text>
  <line x1="1380" y1="315" x2="1520" y2="315" class="thin"/>
  <text x="1380" y="345" class="tiny" text-anchor="start" fill="#7c2d12">高影响停在人前</text>
  <text x="1380" y="365" class="tiny" text-anchor="start" fill="#7c2d12">资产留共同底座</text>
  <text x="1380" y="385" class="tiny" text-anchor="start" fill="#7c2d12">任何助手可被替换</text>
  <text x="1380" y="410" class="tiny" text-anchor="start" fill="#8795a1">任务边界 +</text>
  <text x="1380" y="430" class="tiny" text-anchor="start" fill="#8795a1">责任记录</text>
</g>

<!-- 底部：一人公司董事会 + 什么时候招真人 -->
<rect x="60" y="490" width="730" height="290" class="box warm"/>
<text x="425" y="525" class="label" text-anchor="middle">一人公司的董事会</text>
<line x1="100" y1="545" x2="750" y2="545" class="thin"/>
<text x="100" y="575" class="small" text-anchor="start">OPC 缺少天然反对者</text>
<text x="100" y="598" class="small" text-anchor="start">AI 善于迎合 → 越有经验越围绕既有判断运转</text>
<text x="100" y="630" class="label" text-anchor="start">有意识地制造不同声音</text>
<line x1="100" y1="650" x2="750" y2="650" class="thin"/>
<text x="100" y="680" class="small" text-anchor="start">· 一个助手找支持证据</text>
<text x="100" y="703" class="small" text-anchor="start">· 另一个专门找失败条件</text>
<text x="100" y="726" class="small" text-anchor="start">· 一个从客户角度审视</text>
<text x="100" y="749" class="small" text-anchor="start">· 另一个从现金流 + 法律责任出发</text>
<text x="100" y="772" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">最终仍只有 1 个有责任能力的成员：创始人</text>

<rect x="810" y="490" width="730" height="290" class="box green"/>
<text x="1175" y="525" class="label" text-anchor="middle">什么时候应该招一个真人</text>
<line x1="850" y1="545" x2="1500" y2="545" class="thin"/>
<text x="850" y="575" class="small" text-anchor="start">· 客户在危机中需要理解历史的人</text>
<text x="850" y="598" class="small" text-anchor="start">  而不只是更快的自动回复</text>
<text x="850" y="628" class="small" text-anchor="start">· 产品影响越来越多用户后</text>
<text x="850" y="651" class="small" text-anchor="start">  安全与合规不能只靠深夜抽查</text>
<text x="850" y="681" class="small" text-anchor="start">· 每个决定汇集到同一个人时</text>
<text x="850" y="704" class="small" text-anchor="start">  自动化只会把瓶颈藏得更深</text>
<text x="850" y="734" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">AI 应让人更自由地选择公司规模</text>
<text x="850" y="757" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">不是让"一人完成一切"成为新绩效压力</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章 05.13 正文</text>
</svg>
