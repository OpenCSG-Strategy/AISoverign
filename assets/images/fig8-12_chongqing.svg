<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图8-12.3　重庆　权属三层 × 三次回流</text><text x="800" y="115" class="label" text-anchor="middle">把资产权属写在机房建设之前，是把生态的主体层和公共责任层接口预先定义好</text><rect x="60" y="180" width="480" height="140" class="box warm"/><text x="300.0" y="222" class="label" text-anchor="middle">原始数据</text><text x="300.0" y="258" class="small" text-anchor="middle">归产生方</text><rect x="80" y="270" width="440" height="50" class="box muted"/><text x="92" y="294" class="small" text-anchor="start"><tspan x="92" dy="0">链主企业保留</tspan><tspan x="92" dy="20">不经授权不上传</tspan><tspan x="92" dy="20">可撤回</tspan></text><rect x="60" y="380" width="480" height="140" class="box warm"/><text x="300.0" y="422" class="label" text-anchor="middle">共有成果</text><text x="300.0" y="458" class="small" text-anchor="middle">归联合方</text><rect x="80" y="470" width="440" height="50" class="box muted"/><text x="92" y="494" class="small" text-anchor="start"><tspan x="92" dy="0">联合实验室</tspan><tspan x="92" dy="20">链主 + 模型方</tspan><tspan x="92" dy="20">按合同分配</tspan></text><rect x="60" y="580" width="480" height="140" class="box warm"/><text x="300.0" y="622" class="label" text-anchor="middle">通用方法</text><text x="300.0" y="658" class="small" text-anchor="middle">归公共</text><rect x="80" y="670" width="440" height="50" class="box muted"/><text x="92" y="694" class="small" text-anchor="start"><tspan x="92" dy="0">评测 / 适配器</tspan><tspan x="92" dy="20">行业知识库</tspan><tspan x="92" dy="20">可被本地复用</tspan></text><rect x="1080" y="180" width="460" height="140" class="box green"/><text x="1310.0" y="222" class="label" text-anchor="middle">资源回流</text><text x="1310.0" y="258" class="small" text-anchor="middle">公共投入降低</text><rect x="1100" y="270" width="420" height="50" class="box muted"/><text x="1112" y="294" class="small" text-anchor="start"><tspan x="1112" dy="0">算力门槛 ↓</tspan><tspan x="1112" dy="20">数据 / 模型</tspan><tspan x="1112" dy="20">可以本地获取</tspan></text><rect x="1080" y="380" width="460" height="140" class="box green"/><text x="1310.0" y="422" class="label" text-anchor="middle">资产回流</text><text x="1310.0" y="458" class="small" text-anchor="middle">项目结束后留下</text><rect x="1100" y="470" width="420" height="50" class="box muted"/><text x="1112" y="494" class="small" text-anchor="start"><tspan x="1112" dy="0">代码 / 模型适配</tspan><tspan x="1112" dy="20">评测 / 数据产品</tspan><tspan x="1112" dy="20">人才不流失</tspan></text><rect x="1080" y="580" width="460" height="140" class="box green"/><text x="1310.0" y="622" class="label" text-anchor="middle">价值回流</text><text x="1310.0" y="658" class="small" text-anchor="middle">产业 + 公共</text><rect x="1100" y="670" width="420" height="50" class="box muted"/><text x="1112" y="694" class="small" text-anchor="start"><tspan x="1112" dy="0">新增产值留本地</tspan><tspan x="1112" dy="20">公共服务改进</tspan><tspan x="1112" dy="20">支持下一轮建设</tspan></text><path d="M540,250 L1080,250" class="line" marker-end="url(#arrow)"/><path d="M540,450 L1080,450" class="line" marker-end="url(#arrow)"/><path d="M540,650 L1080,650" class="line" marker-end="url(#arrow)"/><rect x="60" y="770" width="1480" height="80" class="box pink"/><text x="800.0" y="812" class="label" text-anchor="middle">3 个问题作为准入考试</text><text x="800.0" y="848" class="small" text-anchor="middle">① 权属是否成文  ② 链主是否愿意开放  ③ 运营主体是否长久（5 年 / 10 年）</text>
