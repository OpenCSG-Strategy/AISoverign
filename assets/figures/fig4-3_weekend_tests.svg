<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="470" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一个周末的四项测试</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">挑最重要的那项工作，各做一次</text>
<rect x="40" y="90" width="400" height="140" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="40" y="90" width="110" height="140" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="95" y="166" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">失忆测试</text>
<text x="165" y="118" font-size="12" text-anchor="start" font-weight="normal" fill="#555">做法</text>
<text x="165" y="138" font-size="13" text-anchor="start" font-weight="normal" fill="#111">关掉长期记忆和历史对话，</text>
<text x="165" y="157" font-size="13" text-anchor="start" font-weight="normal" fill="#111">只给一页自己写的任务说明</text>
<text x="165" y="188" font-size="12" text-anchor="start" font-weight="normal" fill="#555">看</text>
<text x="185" y="188" font-size="13" text-anchor="start" font-weight="bold" fill="#111">还能不能接着干？</text>
<rect x="460" y="90" width="400" height="140" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="460" y="90" width="110" height="140" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="515" y="166" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">换人测试</text>
<text x="585" y="118" font-size="12" text-anchor="start" font-weight="normal" fill="#555">做法</text>
<text x="585" y="138" font-size="13" text-anchor="start" font-weight="normal" fill="#111">换另一款模型、弱一点的本地</text>
<text x="585" y="157" font-size="13" text-anchor="start" font-weight="normal" fill="#111">工具，或照文字流程自己做</text>
<text x="585" y="188" font-size="12" text-anchor="start" font-weight="normal" fill="#555">看</text>
<text x="605" y="188" font-size="13" text-anchor="start" font-weight="bold" fill="#111">核心事实、步骤和交付物</text>
<text x="605" y="207" font-size="13" text-anchor="start" font-weight="bold" fill="#111">能不能恢复？</text>
<rect x="40" y="245" width="400" height="140" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="40" y="245" width="110" height="140" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="95" y="321" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">断权测试</text>
<text x="165" y="273" font-size="12" text-anchor="start" font-weight="normal" fill="#555">做法</text>
<text x="165" y="293" font-size="13" text-anchor="start" font-weight="normal" fill="#111">收回邮箱、日历、网盘或支付</text>
<text x="165" y="312" font-size="13" text-anchor="start" font-weight="normal" fill="#111">中的一项权限</text>
<text x="165" y="343" font-size="12" text-anchor="start" font-weight="normal" fill="#555">看</text>
<text x="185" y="343" font-size="13" text-anchor="start" font-weight="bold" fill="#111">老实报告"做不了"，</text>
<text x="185" y="362" font-size="13" text-anchor="start" font-weight="bold" fill="#111">还是从别的连接绕过去？</text>
<rect x="460" y="245" width="400" height="140" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="460" y="245" width="110" height="140" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="515" y="321" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">追账测试</text>
<text x="585" y="273" font-size="12" text-anchor="start" font-weight="normal" fill="#555">做法</text>
<text x="585" y="293" font-size="13" text-anchor="start" font-weight="normal" fill="#111">随便挑一次已完成的</text>
<text x="585" y="312" font-size="13" text-anchor="start" font-weight="normal" fill="#111">重要任务</text>
<text x="585" y="343" font-size="12" text-anchor="start" font-weight="normal" fill="#555">看</text>
<text x="605" y="343" font-size="13" text-anchor="start" font-weight="bold" fill="#111">谁发起、用了什么、调了</text>
<text x="605" y="362" font-size="13" text-anchor="start" font-weight="bold" fill="#111">什么工具、谁确认的？</text>
<rect x="40" y="405" width="820" height="46" rx="6" fill="#eee" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="450" y="434" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">每次记下恢复花了多长时间：五分钟能恢复的工具故障，和三个月才能重建的客户知识库，不是同一种依赖</text>
</svg>
