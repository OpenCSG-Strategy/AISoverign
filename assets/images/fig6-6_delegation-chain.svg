<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图6-6 智能体能力卡 + 身份凭证委托链</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。智能体协同的两步：先发现（分层能力卡，公开/敏感/隐藏），再协商（任务匹配 + 权限确认）。底部是身份凭证委托链：人 / 智能体 / 工作负载三类身份 + 4 问 — 凭证短期、目的明确、面向特定服务，委托只能缩小不能扩大。数据来源：第六章正文 06.5。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:32px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图6-6　能力卡分层 + 身份凭证委托链</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">能力发现 → 任务协商 → 身份 + 凭证 → 快速失效</text>

<!-- 上半：能力卡分层 -->
<g>
  <line x1="60" y1="125" x2="1540" y2="125" class="line"/>
  <text x="800" y="160" class="label" text-anchor="middle">分层能力卡：部门接口 + 不公开内部细节</text>

  <rect x="60"  y="190" width="380" height="220" class="box green"/>
  <text x="100" y="230" class="label" text-anchor="start" fill="#1f4e79">公开层 — 全员可见</text>
  <text x="100" y="265" class="small" text-anchor="start">· 名称</text>
  <text x="100" y="290" class="small" text-anchor="start">· 任务类型</text>
  <text x="100" y="315" class="small" text-anchor="start">· 输入输出模式</text>
  <text x="100" y="340" class="small" text-anchor="start">· 授权方式</text>
  <text x="100" y="365" class="small" text-anchor="start">· 预计时效</text>
  <text x="100" y="390" class="tiny" text-anchor="start" fill="#1f4e79">普通能力 — 可被任何人发现</text>

  <rect x="450" y="190" width="380" height="220" class="box warm"/>
  <text x="490" y="230" class="label" text-anchor="start" fill="#7c2d12">受控层 — 条件可见</text>
  <text x="490" y="265" class="small" text-anchor="start">· 满足身份 + 项目条件</text>
  <text x="490" y="290" class="small" text-anchor="start">· 数据分类</text>
  <text x="490" y="315" class="small" text-anchor="start">· 负责人</text>
  <text x="490" y="340" class="small" text-anchor="start">· 评测集引用</text>
  <text x="490" y="365" class="small" text-anchor="start">· 服务等级</text>
  <text x="490" y="390" class="tiny" text-anchor="start" fill="#7c2d12">敏感能力 — 条件发现</text>

  <rect x="840" y="190" width="380" height="220" class="box accent"/>
  <text x="880" y="230" class="label" text-anchor="start" fill="#1f4e79">协商层 — 任务时</text>
  <text x="880" y="265" class="small" text-anchor="start">调用方提交：</text>
  <text x="880" y="290" class="small" text-anchor="start">· 任务目标</text>
  <text x="880" y="315" class="small" text-anchor="start">· 所需字段</text>
  <text x="880" y="340" class="small" text-anchor="start">· 时限 + 证据要求</text>
  <text x="880" y="365" class="small" text-anchor="start">服务方可：</text>
  <text x="880" y="390" class="small" text-anchor="start">接受 / 缩小 / 要补充 / 拒绝</text>

  <rect x="1230" y="190" width="310" height="220" class="box muted"/>
  <text x="1385" y="230" class="label" text-anchor="middle" fill="#7c2d12">不公开</text>
  <text x="1240" y="265" class="small" text-anchor="start">· 内部提示</text>
  <text x="1240" y="290" class="small" text-anchor="start">· 模型 / 数据源</text>
  <text x="1240" y="315" class="small" text-anchor="start">· 检索片段</text>
  <text x="1240" y="340" class="small" text-anchor="start">· 推理链</text>
  <text x="1240" y="365" class="tiny" text-anchor="start" fill="#7c2d12">描述接口，不暴露内部</text>
</g>

<!-- 中部：4 问 -->
<g>
  <line x1="60" y1="440" x2="1540" y2="440" class="line"/>
  <text x="800" y="475" class="label" text-anchor="middle" fill="#1f4e79">身份 + 凭证记录，必须能回答 4 个问题</text>

  <rect x="60"  y="495" width="350" height="80" class="box accent"/>
  <text x="100" y="535" class="label" text-anchor="start">Q1  谁在行动？</text>
  <text x="100" y="560" class="small" text-anchor="start">人 / 智能体 / 工作负载三类身份</text>

  <rect x="425" y="495" width="350" height="80" class="box accent"/>
  <text x="465" y="535" class="label" text-anchor="start">Q2  受谁委托？</text>
  <text x="465" y="560" class="small" text-anchor="start">上级智能体 / 人类审批人</text>

  <rect x="790" y="495" width="350" height="80" class="box accent"/>
  <text x="830" y="535" class="label" text-anchor="start">Q3  服务哪个任务？</text>
  <text x="830" y="560" class="small" text-anchor="start">任务编号 + 用途</text>

  <rect x="1155" y="495" width="385" height="80" class="box accent"/>
  <text x="1195" y="535" class="label" text-anchor="start">Q4  权限有何限制？</text>
  <text x="1195" y="560" class="small" text-anchor="start">数据范围 / 时效 / 可委托深度</text>
</g>

<!-- 下半：委托链 + 凭证规则 -->
<g>
  <line x1="60" y1="600" x2="1540" y2="600" class="line"/>
  <text x="800" y="635" class="label" text-anchor="middle">凭证规则 — 短期 / 目的明确 / 面向特定服务</text>

  <rect x="60"  y="660" width="1480" height="100" class="box warm"/>
  <text x="100" y="700" class="label" text-anchor="start" fill="#7c2d12">6 项绑定</text>
  <text x="100" y="730" class="small" text-anchor="start">① 调用者  ② 目标服务  ③ 任务编号</text>
  <text x="100" y="755" class="small" text-anchor="start">④ 允许动作  ⑤ 数据范围  ⑥ 过期时间</text>
  <text x="800" y="725" class="label" text-anchor="middle" fill="#1f4e79">转委托 → 新凭证只能缩小权限</text>
  <text x="800" y="755" class="label" text-anchor="middle" fill="#1f4e79">不能凭空扩大</text>
</g>

<!-- 底部 -->
<g>
  <rect x="60" y="780" width="1480" height="100" class="box green"/>
  <text x="800" y="820" class="label" text-anchor="middle">快速失效：员工调岗 / 项目结束 / 模型异常 → 策略点拒绝新请求 + 短期令牌过期 + 未完成任务进入暂停</text>
  <text x="800" y="855" class="small" text-anchor="middle">不能依赖提示词"不要再用"</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第六章正文 06.5</text>
</svg>
