<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="440" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">一张"行动房卡"，以及它在委托中怎样变窄</text>
<rect x="40" y="70" width="330" height="300" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="40" y="70" width="330" height="46" rx="14" fill="#111"/>
<rect x="40" y="100" width="330" height="16" fill="#111"/>
<text x="205" y="100" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">任务 #2026-1008-031</text>
<text x="62" y="150" font-size="14" text-anchor="start" font-weight="normal" fill="#555">代表谁</text>
<text x="350" y="150" font-size="15" text-anchor="end" font-weight="bold" fill="#111">行政主管（示例）</text>
<line x1="62" y1="166" x2="350" y2="166" stroke="#eee" stroke-width="1.5"/>
<text x="62" y="194" font-size="14" text-anchor="start" font-weight="normal" fill="#555">能进哪个系统</text>
<text x="350" y="194" font-size="15" text-anchor="end" font-weight="bold" fill="#111">公司日历</text>
<line x1="62" y1="210" x2="350" y2="210" stroke="#eee" stroke-width="1.5"/>
<text x="62" y="238" font-size="14" text-anchor="start" font-weight="normal" fill="#555">能做什么</text>
<text x="350" y="238" font-size="15" text-anchor="end" font-weight="bold" fill="#111">只读：忙／闲</text>
<line x1="62" y1="254" x2="350" y2="254" stroke="#eee" stroke-width="1.5"/>
<text x="62" y="282" font-size="14" text-anchor="start" font-weight="normal" fill="#555">有效期</text>
<text x="350" y="282" font-size="15" text-anchor="end" font-weight="bold" fill="#111">今天 18:00 前</text>
<line x1="62" y1="298" x2="350" y2="298" stroke="#eee" stroke-width="1.5"/>
<text x="62" y="326" font-size="14" text-anchor="start" font-weight="normal" fill="#555">能否转交</text>
<text x="350" y="326" font-size="15" text-anchor="end" font-weight="bold" fill="#111">不能</text>
<text x="205" y="395" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">任务结束、取消或风险升高，卡即作废</text>
<rect x="460.0" y="85" width="360" height="62" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="640" y="111" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">员工本人</text>
<text x="640" y="132" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">日历、邮件、文件、审批……</text>
<line x1="640" y1="149" x2="640" y2="187" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="652" y="173" font-size="12" text-anchor="start" font-weight="normal" fill="#555">委托一层，权限少一圈</text>
<rect x="515.0" y="190" width="250" height="62" rx="6" fill="#eee" stroke="#111" stroke-width="1.5"/>
<text x="640" y="216" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">行政助手</text>
<text x="640" y="237" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">读日历　发内部邮件</text>
<line x1="640" y1="254" x2="640" y2="292" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="652" y="278" font-size="12" text-anchor="start" font-weight="normal" fill="#555">委托一层，权限少一圈</text>
<rect x="565.0" y="295" width="150" height="62" rx="6" fill="#bbb" stroke="#111" stroke-width="1.5"/>
<text x="640" y="321" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">排期助手</text>
<text x="640" y="342" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">只看几个人的忙／闲</text>
</svg>
