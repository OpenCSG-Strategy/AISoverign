<line x1="142" y1="198" x2="157" y2="198" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="90" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">多源同步</text>
<text x="90" y="264" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">进私有仓库</text>
<rect x="778" y="90" width="82" height="292" rx="6" fill="#eee" stroke="#111" stroke-width="2"/>
<text x="819" y="130" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Agentic</text>
<text x="819" y="148" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Ops</text>
<text x="819" y="190" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">贯穿</text>
<text x="819" y="212" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">四层</text>
<text x="819" y="234" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"></text>
<text x="819" y="256" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">发布</text>
<text x="819" y="278" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">运行</text>
<text x="819" y="300" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">改进</text>
<text x="40" y="420" font-size="14" text-anchor="start" font-weight="bold" fill="#111">模型提供智能，运行装置（Harness）提供行动能力，AgenticOps 提供可控运行</text>
<text x="40" y="448" font-size="13" text-anchor="start" font-weight="normal" fill="#555">检验是不是真的分了层：挑一层换掉，看另外几层要不要跟着重写</text>
