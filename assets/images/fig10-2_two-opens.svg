<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图10-2　两次开放行动：产业政策与防御工具链</text><text x="800" y="115" class="label" text-anchor="middle">7-24 声明与 7-27 Open Secure AI Alliance 性质不同</text><rect x="60" y="180" width="720" height="90" class="box accent"/><text x="420.0" y="222" class="label" text-anchor="middle">① 7-24 产业政策声明</text><text x="420.0" y="258" class="small" text-anchor="middle">《开放权重与美国 AI 领导力》</text><rect x="60" y="290" width="720" height="130" class="box muted"/><text x="420.0" y="335.0" class="small" text-anchor="middle"><tspan x="420.0" dy="0">25 家公司初始联署</tspan><tspan x="420.0" dy="24">横跨模型/芯片/云/VC/开放共同体</tspan><tspan x="420.0" dy="24">主张扩大获取、减少供应商锁定</tspan><tspan x="420.0" dy="24">厂商立场：免费 AI 有利于硬件</tspan></text><rect x="820" y="180" width="720" height="90" class="box warm"/><text x="1180.0" y="222" class="label" text-anchor="middle">② 7-27 Open Secure AI Alliance</text><text x="1180.0" y="258" class="small" text-anchor="middle">防御工具链共同体</text><rect x="820" y="290" width="720" height="130" class="box muted"/><text x="1180.0" y="335.0" class="small" text-anchor="middle"><tspan x="1180.0" dy="0">聚焦供应链安全与防御</tspan><tspan x="1180.0" dy="24">为开放模型提供扫描/签名/漏洞库</tspan><tspan x="1180.0" dy="24">社区厂商 + 评测机构</tspan><tspan x="1180.0" dy="24">不是产业政策，而是安全运营</tspan></text><path d="M780,355 L820,355" class="line" marker-end="url(#arrow)"/><rect x="60" y="450" width="1480" height="110" class="box muted"/><text x="800.0" y="492" class="label" text-anchor="middle">区别</text><text x="800.0" y="528" class="small" text-anchor="middle">7-24 是产业站队（市场 + 能力层）；7-27 是安全运营（市场 + 供应链）</text><rect x="60" y="590" width="720" height="200" class="box green"/><text x="420.0" y="632" class="label" text-anchor="middle">能力层开放</text><text x="420.0" y="668" class="small" text-anchor="middle">更多推理 → 更多 GPU/网络/数据中心/推理软件市场</text><rect x="820" y="590" width="720" height="200" class="box warm"/><text x="1180.0" y="632" class="label" text-anchor="middle">防御工具链</text><text x="1180.0" y="668" class="small" text-anchor="middle">开放模型增加 → 攻击面增加 → 扫描/签名/漏洞库成为刚需</text>
