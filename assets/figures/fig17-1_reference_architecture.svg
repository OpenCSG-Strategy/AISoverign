<text x="234" y="271" font-size="16" text-anchor="start" font-weight="bold" fill="#111">运行时</text>
<text x="234" y="291" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Runtime</text>
<rect x="370" y="254" width="140" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="440" y="280" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">CSGClaw</text>
