<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933} .title{font-size:34px;font-weight:700} .label{font-size:23px;font-weight:700} .small{font-size:18px} .tiny{font-size:15px} .box{stroke:#34495e;stroke-width:3;rx:18} .muted{fill:#f0eee8} .accent{fill:#dbeafe} .warm{fill:#fef3c7} .green{fill:#dcfce7} .line{stroke:#506273;stroke-width:4;fill:none} .dash{stroke:#8795a1;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图4-4　执行凭证:让一次任务可以被复盘</text><text x="800" y="115" class="label" text-anchor="middle">凭证不是把全部对话永久复制,而是按风险留下足够回答现实问题的字段</text><rect x="60" y="180" width="900" height="580" class="box accent" rx="18"/><text x="510" y="218" class="label" text-anchor="middle">执行凭证</text><text x="510" y="248" class="small" text-anchor="middle">一次任务的批次记录  ·  按风险取舍字段</text><rect x="120" y="320" width="260" height="140" class="box muted" rx="18"/><text x="250" y="365" class="label" text-anchor="middle">任务 ID</text><text x="250" y="402" class="small" text-anchor="middle">标识 · 发起人 · 目的</text><text x="250" y="435" class="tiny" text-anchor="middle">保存</text><rect x="400" y="320" width="260" height="140" class="box muted" rx="18"/><text x="530" y="365" class="label" text-anchor="middle">版本</text><text x="530" y="402" class="small" text-anchor="middle">计划 · 模型 · 知识版本</text><text x="530" y="435" class="tiny" text-anchor="middle">保存</text><rect x="680" y="320" width="260" height="140" class="box muted" rx="18"/><text x="810" y="365" class="label" text-anchor="middle">来源</text><text x="810" y="402" class="small" text-anchor="middle">输入资料 · 摘要 · 受控标识</text><text x="810" y="435" class="tiny" text-anchor="middle">保存</text><rect x="120" y="480" width="260" height="140" class="box muted" rx="18"/><text x="250" y="525" class="label" text-anchor="middle">权限</text><text x="250" y="562" class="small" text-anchor="middle">谁授权 · 范围 · 期限</text><text x="250" y="595" class="tiny" text-anchor="middle">保存</text><rect x="400" y="480" width="260" height="140" class="box muted" rx="18"/><text x="530" y="525" class="label" text-anchor="middle">批准</text><text x="530" y="562" class="small" text-anchor="middle">人工身份 · 时间 · 条件</text><text x="530" y="595" class="tiny" text-anchor="middle">保存</text><rect x="680" y="480" width="260" height="140" class="box muted" rx="18"/><text x="810" y="525" class="label" text-anchor="middle">工具调用</text><text x="810" y="562" class="small" text-anchor="middle">参数范围 · 状态 · 重试</text><text x="810" y="595" class="tiny" text-anchor="middle">保存</text><rect x="120" y="640" width="260" height="140" class="box muted" rx="18"/><text x="250" y="685" class="label" text-anchor="middle">外部结果</text><text x="250" y="722" class="small" text-anchor="middle">对账编号 · 影响对象</text><text x="250" y="755" class="tiny" text-anchor="middle">保存</text><rect x="400" y="640" width="260" height="140" class="box muted" rx="18"/><text x="530" y="685" class="label" text-anchor="middle">失败</text><text x="530" y="722" class="small" text-anchor="middle">降级路径 · 退出原因</text><text x="530" y="755" class="tiny" text-anchor="middle">保存</text><rect x="680" y="640" width="260" height="140" class="box muted" rx="18"/><text x="810" y="685" class="label" text-anchor="middle">补救</text><text x="810" y="722" class="small" text-anchor="middle">撤销 · 回滚 · 通知</text><text x="810" y="755" class="tiny" text-anchor="middle">保存</text><rect x="990" y="180" width="550" height="190" class="box green" rx="18"/><text x="1005" y="215" class="label" text-anchor="start">已保存</text><text x="1005" y="244" class="small" text-anchor="start">9 个核心字段,默认全留</text><text x="1005" y="285" class="small" text-anchor="start">·  任务 ID / 版本 / 计划</text><text x="1005" y="307" class="small" text-anchor="start">·  来源(摘要+受控标识)</text><text x="1005" y="329" class="small" text-anchor="start">·  权限 / 批准 / 工具调用</text><text x="1005" y="351" class="small" text-anchor="start">·  外部结果 / 失败 / 补救</text><rect x="990" y="390" width="550" height="120" class="box warm" rx="18"/><text x="1005" y="425" class="label" text-anchor="start">可选</text><text x="1005" y="454" class="small" text-anchor="start">取决于风险等级与合规要求</text><text x="1005" y="485" class="small" text-anchor="start">·  记忆点 / 上下文节选</text><text x="1005" y="507" class="small" text-anchor="start">·  关键判断的对话摘要</text><rect x="990" y="530" width="550" height="230" fill="#fbfaf7" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6" rx="18"/><text x="1005" y="565" class="label" text-anchor="start">不保存</text><text x="1005" y="594" class="small" text-anchor="start">默认丢弃  ·  避免新的敏感数据库</text><text x="1005" y="625" class="small" text-anchor="start">·  完整提示词(原文)</text><text x="1005" y="647" class="small" text-anchor="start">·  客户原始材料 / 个人敏感字段</text><text x="1005" y="669" class="small" text-anchor="start">·  中间推理 / 完整思维轨迹</text><text x="1005" y="691" class="small" text-anchor="start">·  未触发的备选方案细节</text><text x="800" y="805" class="small" text-anchor="middle">凭证 ≠ 免责文件:它记录事件,不能替代对输入事实、模型结论与公平性的独立判断</text><text x="800" y="838" class="small" text-anchor="middle">思维轨迹 = 不保存  ·  记忆点 = 可选  ·  外部结果 = 保存</text>
<text x="60" y="865" class="tiny">原创信息图 · v0.1 · 2026-08-03 · 适配单色印刷</text></svg>