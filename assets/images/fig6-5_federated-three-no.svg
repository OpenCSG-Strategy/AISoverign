<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图6-5 联邦检索 3 不回答 + 属地执行</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"联邦检索 + 属地执行"拆成 3 种不回答（无权限 / 无结论 / 不可组合）+ 4 种防侧信道（固定响应 / 查询预算 / 结果聚合 / 人工批准）+ 属地执行三步（外部请求 / 本地判断 / 返回凭证）。数据来源：第六章正文 06.4。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#7c2d12}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图6-5　联邦检索 3 不回答 + 属地执行</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">把问题送到资料所属部门 — 资料不必先汇到模型</text>

<!-- 上半：联邦检索流程 -->
<g>
  <line x1="60" y1="125" x2="1540" y2="125" class="line"/>
  <text x="800" y="160" class="label" text-anchor="middle">联邦检索：路由 → 部门域 → 答案</text>

  <rect x="60" y="180" width="200" height="180" class="box accent"/>
  <text x="160" y="220" class="label" text-anchor="middle">任务路由器</text>
  <text x="160" y="260" class="small" text-anchor="middle">判断需要哪些</text>
  <text x="160" y="285" class="small" text-anchor="middle">部门能力</text>
  <text x="160" y="320" class="tiny" text-anchor="middle" fill="#1f4e79">不是搜所有文档</text>

  <line x1="260" y1="270" x2="350" y2="270" class="line" marker-end="url(#arrow)"/>

  <rect x="350" y="180" width="200" height="180" class="box accent"/>
  <text x="450" y="220" class="label" text-anchor="middle">研发域</text>
  <text x="450" y="260" class="small" text-anchor="middle">本地策略</text>
  <text x="450" y="285" class="small" text-anchor="middle">本地索引</text>
  <text x="450" y="320" class="tiny" text-anchor="middle" fill="#1f4e79">本地更新 / 本地生效</text>

  <line x1="550" y1="270" x2="640" y2="270" class="line" marker-end="url(#arrow)"/>

  <rect x="640" y="180" width="200" height="180" class="box accent"/>
  <text x="740" y="220" class="label" text-anchor="middle">法务域</text>
  <text x="740" y="260" class="small" text-anchor="middle">另一套策略</text>
  <text x="740" y="285" class="small" text-anchor="middle">另一套索引</text>
  <text x="740" y="320" class="tiny" text-anchor="middle" fill="#1f4e79">不共享直接访问权</text>

  <line x1="840" y1="270" x2="930" y2="270" class="line" marker-end="url(#arrow)"/>

  <rect x="930" y="180" width="220" height="180" class="box green"/>
  <text x="1040" y="220" class="label" text-anchor="middle">上层智能体</text>
  <text x="1040" y="260" class="small" text-anchor="middle">组合答案 + 引用</text>
  <text x="1040" y="285" class="small" text-anchor="middle">+ 有效期</text>
  <text x="1040" y="320" class="tiny" text-anchor="middle" fill="#1f4e79">组合，但不见原索引</text>

  <line x1="1150" y1="270" x2="1240" y2="270" class="line" marker-end="url(#arrow)"/>

  <rect x="1240" y="180" width="240" height="180" class="box accent"/>
  <text x="1360" y="220" class="label" text-anchor="middle">调用方</text>
  <text x="1360" y="260" class="small" text-anchor="middle">只得到受约束的</text>
  <text x="1360" y="285" class="small" text-anchor="middle">制品 + 引用</text>
  <text x="1360" y="320" class="tiny" text-anchor="middle" fill="#1f4e79">不能横向移动</text>
</g>

<!-- 中：3 不回答 -->
<g>
  <line x1="60" y1="400" x2="1540" y2="400" class="line"/>
  <text x="800" y="435" class="label" text-anchor="middle" fill="#7c2d12">必须保留 3 种"不回答"，不能都用空字符串</text>

  <rect x="60"  y="460" width="490" height="110" class="box red"/>
  <text x="100" y="498" class="num" text-anchor="start">①</text>
  <text x="155" y="498" class="label" text-anchor="start">无权限</text>
  <text x="100" y="528" class="small" text-anchor="start">资料存在，但当前任务没资格知道</text>
  <text x="100" y="552" class="tiny" text-anchor="start" fill="#7c2d12">不能由模型猜 — 拒绝明确</text>

  <rect x="555" y="460" width="490" height="110" class="box red"/>
  <text x="595" y="498" class="num" text-anchor="start">②</text>
  <text x="650" y="498" class="label" text-anchor="start">无结论</text>
  <text x="595" y="528" class="small" text-anchor="start">部门数据不足 — 不能用猜测补齐</text>
  <text x="595" y="552" class="tiny" text-anchor="start" fill="#7c2d12">空白 ≠ 否定事实</text>

  <rect x="1050" y="460" width="490" height="110" class="box red"/>
  <text x="1090" y="498" class="num" text-anchor="start">③</text>
  <text x="1145" y="498" class="label" text-anchor="start">不可组合</text>
  <text x="1090" y="528" class="small" text-anchor="start">部门口径冲突 — 需人决定</text>
  <text x="1090" y="552" class="tiny" text-anchor="start" fill="#7c2d12">不能由模型合并</text>
</g>

<!-- 下半：属地执行 + 防侧信道 -->
<g>
  <line x1="60" y1="600" x2="1540" y2="600" class="line"/>
  <text x="800" y="635" class="label" text-anchor="middle">属地执行：工具部署在所属部门，外部只提交结构化请求</text>

  <rect x="60"  y="660" width="350" height="100" class="box warm"/>
  <text x="235" y="695" class="label" text-anchor="middle">外部智能体</text>
  <text x="235" y="725" class="small" text-anchor="middle">提交"冻结某供应商"</text>
  <text x="235" y="745" class="tiny" text-anchor="middle" fill="#7c2d12">结构化请求 / 不带凭证</text>

  <line x1="410" y1="710" x2="490" y2="710" class="line" marker-end="url(#arrow)"/>

  <rect x="490" y="660" width="350" height="100" class="box green"/>
  <text x="665" y="695" class="label" text-anchor="middle">部门域</text>
  <text x="665" y="725" class="small" text-anchor="middle">本地判断 + 人工确认</text>
  <text x="665" y="745" class="tiny" text-anchor="middle" fill="#1f4e79">本地执行 / 本地生效</text>

  <line x1="840" y1="710" x2="920" y2="710" class="line" marker-end="url(#arrow)"/>

  <rect x="920" y="660" width="320" height="100" class="box warm"/>
  <text x="1080" y="695" class="label" text-anchor="middle">外部智能体</text>
  <text x="1080" y="725" class="small" text-anchor="middle">收到状态 + 执行凭证</text>
  <text x="1080" y="745" class="tiny" text-anchor="middle" fill="#7c2d12">撤销可独立完成</text>

  <rect x="1250" y="660" width="290" height="100" class="box muted"/>
  <text x="1395" y="695" class="label" text-anchor="middle" fill="#1f4e79">防侧信道</text>
  <text x="1255" y="725" class="tiny" text-anchor="start">· 固定响应</text>
  <text x="1255" y="745" class="tiny" text-anchor="start">· 查询预算 / 结果聚合</text>
  <text x="1255" y="765" class="tiny" text-anchor="start">· 人工批准</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第六章正文 06.4</text>
</svg>
