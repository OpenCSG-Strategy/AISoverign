<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图7-2 租用结果 vs 吸收能力 — 5 项检查</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"租用结果 vs 吸收能力"画成左右两栏：左侧"只租到结果" — 供应商懂而企业不懂；右侧"内部能力" — 5 项企业掌握的检查（知识迁移 / 版本还原 / 决定追溯 / 异常有负责人 / 可替换）。AI 不会因为外部依赖而失去主权，也不会因为自建机房而自动获得。数据来源：第七章正文 07.1。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:32px;font-weight:700;fill:#7c2d12}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图7-2　租用结果 vs 吸收能力</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">外部智能 → 内部能力 — 5 项企业必须掌握的检查</text>

<!-- 左栏：只租到结果 -->
<g>
  <rect x="60" y="140" width="640" height="700" class="box red"/>
  <text x="100" y="185" class="label" text-anchor="start" fill="#7c2d12">"只租到结果"</text>
  <text x="100" y="220" class="small" text-anchor="start">系统只有供应商懂</text>

  <rect x="100" y="245" width="560" height="60" class="box accent"/>
  <text x="120" y="282" class="small" text-anchor="start" fill="#7c2d12">· 知识留在供应商平台</text>

  <rect x="100" y="315" width="560" height="60" class="box accent"/>
  <text x="120" y="352" class="small" text-anchor="start" fill="#7c2d12">· 系统版本不可还原</text>

  <rect x="100" y="385" width="560" height="60" class="box accent"/>
  <text x="120" y="422" class="small" text-anchor="start" fill="#7c2d12">· 关键决定无人追溯</text>

  <rect x="100" y="455" width="560" height="60" class="box accent"/>
  <text x="120" y="492" class="small" text-anchor="start" fill="#7c2d12">· 异常找不到负责人</text>

  <rect x="100" y="525" width="560" height="60" class="box accent"/>
  <text x="120" y="562" class="small" text-anchor="start" fill="#7c2d12">· 替换需要重新走流程</text>

  <text x="380" y="640" class="label" text-anchor="middle" fill="#7c2d12">演示漂亮 ≠ 可持续</text>
  <text x="100" y="680" class="tiny" text-anchor="start" fill="#1f4e79">英国政府 Copilot 试验：</text>
  <text x="100" y="700" class="tiny" text-anchor="start">2 万员工真实使用 — 部署≠生产率</text>
  <text x="100" y="720" class="tiny" text-anchor="start" fill="#1f4e79">OECD 5000 中小企业：</text>
  <text x="100" y="740" class="tiny" text-anchor="start">31% 用 GenAI → 仅 1/3 报告工作量减轻</text>
  <text x="100" y="775" class="tiny" text-anchor="start" fill="#7c2d12">"提高""营收"是自报 — 不是独立审计</text>
</g>

<!-- 箭头 -->
<g>
  <line x1="710" y1="490" x2="890" y2="490" class="line" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>
</g>

<!-- 右栏：内部能力 5 项 -->
<g>
  <rect x="900" y="140" width="640" height="700" class="box green"/>
  <text x="940" y="185" class="label" text-anchor="start" fill="#1f4e79">"内部能力"</text>
  <text x="940" y="220" class="small" text-anchor="start">数据、评测、流程、权限、责任 — 由企业掌握</text>

  <rect x="940" y="245" width="560" height="60" class="box green"/>
  <text x="970" y="282" class="small" text-anchor="start" font-weight="700">① 知识和流程能否迁移</text>

  <rect x="940" y="315" width="560" height="60" class="box green"/>
  <text x="970" y="352" class="small" text-anchor="start" font-weight="700">② 系统版本能否还原</text>

  <rect x="940" y="385" width="560" height="60" class="box green"/>
  <text x="970" y="422" class="small" text-anchor="start" font-weight="700">③ 关键决定能否追溯</text>

  <rect x="940" y="455" width="560" height="60" class="box green"/>
  <text x="970" y="492" class="small" text-anchor="start" font-weight="700">④ 异常是否有负责人</text>

  <rect x="940" y="525" width="560" height="60" class="box green"/>
  <text x="970" y="562" class="small" text-anchor="start" font-weight="700">⑤ 替换是否在企业掌控中</text>

  <text x="1220" y="640" class="label" text-anchor="middle" fill="#1f4e79">演示展示"模型会什么"</text>
  <text x="940" y="680" class="tiny" text-anchor="start">生产面对：</text>
  <text x="940" y="700" class="tiny" text-anchor="start">· 我们的数据上怎样表现</text>
  <text x="940" y="720" class="tiny" text-anchor="start">· 不知道时能否承认</text>
  <text x="940" y="740" class="tiny" text-anchor="start">· 谁允许它退款</text>
  <text x="940" y="760" class="tiny" text-anchor="start">· 供应商中断七天能否继续</text>
  <text x="1220" y="800" class="label" text-anchor="middle" fill="#1f4e79">企业能力 ≠ 多个 AI 工具的相加</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第七章正文 07.1</text>
</svg>
