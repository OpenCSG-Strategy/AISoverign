<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图7-6 智能稀缺性迁移 + FDE 角色</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"聪明不再唯一稀缺品"画成商品化边界前移（价格下降 2 数量级 + 任务扩散）+ 4 类成本（资源/任务/结果/治理）+ FDE（前线部署工程师）作为现场连接点。FDE 留下的不是配置，而是任务定义、评测基线、权限边界和退出路径。数据来源：第七章正文 07.5。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:30px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.red{fill:#fee2e2}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图7-6　智能稀缺性迁移 + FDE 角色</text>
<text x="800" y="100" class="label" text-anchor="middle" fill="#1f4e79">聪明不再稀缺 — 组织智能变得稀缺</text>

<!-- 上半：商品化边界前移 -->
<g>
  <line x1="60" y1="125" x2="1540" y2="125" class="line"/>
  <text x="800" y="160" class="label" text-anchor="middle">商品化边界持续前移</text>

  <rect x="60"  y="190" width="490" height="180" class="box accent"/>
  <text x="100" y="230" class="label" text-anchor="start" fill="#1f4e79">昨天</text>
  <text x="100" y="265" class="small" text-anchor="start">· 只有最强模型能完成</text>
  <text x="100" y="290" class="small" text-anchor="start">· 摘要 / 分类 / 检索 / 普通编程</text>
  <text x="100" y="315" class="small" text-anchor="start">· 必须调用云端大模型</text>
  <text x="100" y="350" class="tiny" text-anchor="start" fill="#1f4e79">价格：2 年下降 ≥ 2 数量级</text>

  <line x1="300" y1="380" x2="900" y2="380" class="line" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

  <rect x="1010" y="190" width="490" height="180" class="box green"/>
  <text x="1050" y="230" class="label" text-anchor="start" fill="#1f4e79">明天</text>
  <text x="1050" y="265" class="small" text-anchor="start">· 多个供给 — 不只一家</text>
  <text x="1050" y="290" class="small" text-anchor="start">· 本地小模型 / 确定性程序接管</text>
  <text x="1050" y="315" class="small" text-anchor="start">· 不再"有没有"而是"该选哪个"</text>
  <text x="1050" y="350" class="tiny" text-anchor="start" fill="#1f4e79">更复杂任务 + 更高采用率同时发生</text>
</g>

<!-- 中部：4 类成本 + FDE 出现 -->
<g>
  <line x1="60" y1="400" x2="1540" y2="400" class="line"/>
  <text x="800" y="435" class="label" text-anchor="middle">当企业面对几十种模型 + 上百个工具 + 不断出现的 Agent</text>
  <text x="800" y="465" class="label" text-anchor="middle" fill="#7c2d12">智能供给越丰富 — 组织智能越稀缺</text>

  <rect x="60"  y="490" width="730" height="180" class="box warm"/>
  <text x="100" y="528" class="label" text-anchor="start">FDE — Forward Deployed Engineer</text>
  <text x="100" y="560" class="small" text-anchor="start">· 横跨客户交付 + 平台开发</text>
  <text x="100" y="585" class="small" text-anchor="start">· 从问题发现 → 范围界定 → 系统设计 → 生产上线</text>
  <text x="100" y="615" class="small" text-anchor="start" fill="#1f4e79">关键：</text>
  <text x="100" y="640" class="small" text-anchor="start">· 与现场人员一起找任务边界 / 例外 / 可验证结果</text>
  <text x="100" y="660" class="small" text-anchor="start">· 再用工程把它们连成第一条可运行闭环</text>

  <rect x="810" y="490" width="730" height="180" class="box accent"/>
  <text x="850" y="528" class="label" text-anchor="start">FDE 的成败标准</text>
  <text x="850" y="560" class="small" text-anchor="start" font-weight="700">"他离开以后留下了什么"</text>
  <text x="850" y="585" class="small" text-anchor="start" fill="#7c2d12">失败：</text>
  <text x="850" y="610" class="small" text-anchor="start">只有供应商能解释的配置 + 不可导出工作流 + 对驻场个人的依赖</text>
  <text x="850" y="635" class="small" text-anchor="start" fill="#1f4e79">成功：</text>
  <text x="850" y="660" class="small" text-anchor="start">企业掌握任务定义 / 数据语义 / 评测基线 / 权限边界 / 退出路径</text>
</g>

<!-- 底部：4 类组织智能 -->
<g>
  <line x1="60" y1="700" x2="1540" y2="700" class="line"/>
  <text x="800" y="735" class="label" text-anchor="middle">企业需要的新型"组织智能"</text>

  <rect x="60"  y="760" width="350" height="100" class="box green"/>
  <text x="100" y="795" class="label" text-anchor="start" fill="#1f4e79">① 任务定义</text>
  <text x="100" y="820" class="small" text-anchor="start">把目标拆成任务</text>
  <text x="100" y="845" class="small" text-anchor="start">把能力放进正确边界</text>

  <rect x="425" y="760" width="350" height="100" class="box green"/>
  <text x="465" y="795" class="label" text-anchor="start" fill="#1f4e79">② 评测基线</text>
  <text x="465" y="820" class="small" text-anchor="start">真实任务成功率</text>
  <text x="465" y="845" class="small" text-anchor="start">完成时间 / 资源 / 业务采用率</text>

  <rect x="790" y="760" width="350" height="100" class="box green"/>
  <text x="830" y="795" class="label" text-anchor="start" fill="#1f4e79">③ 权限边界</text>
  <text x="830" y="820" class="small" text-anchor="start">能看什么 / 能做什么</text>
  <text x="830" y="845" class="small" text-anchor="start">高影响必人确认</text>

  <rect x="1155" y="760" width="385" height="100" class="box green"/>
  <text x="1195" y="795" class="label" text-anchor="start" fill="#1f4e79">④ 退出路径</text>
  <text x="1195" y="820" class="small" text-anchor="start">可迁移 / 可导出 / 可替换</text>
  <text x="1195" y="845" class="small" text-anchor="start">外部技术 → 内部能力</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第七章正文 07.5</text>
</svg>
