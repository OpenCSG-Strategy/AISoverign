<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图1-1　一次回答，其实经过两条生产线</text><text x="800" y="118" class="label" text-anchor="middle">Prefill 读题 → KV Cache 工作台 → Decode 作答</text><rect x="60" y="200" width="280" height="80" class="box muted"/><text x="200.0" y="242" class="label" text-anchor="middle">提示词</text><text x="200.0" y="278" class="small" text-anchor="middle">用户输入</text><rect x="60" y="295" width="280" height="80" class="box muted"/><text x="200.0" y="337" class="label" text-anchor="middle">历史对话</text><text x="200.0" y="373" class="small" text-anchor="middle">上下文累积</text><rect x="60" y="390" width="280" height="80" class="box muted"/><text x="200.0" y="432" class="label" text-anchor="middle">检索材料</text><text x="200.0" y="468" class="small" text-anchor="middle">RAG 结果</text><rect x="60" y="485" width="280" height="80" class="box muted"/><text x="200.0" y="527" class="label" text-anchor="middle">工具返回</text><text x="200.0" y="563" class="small" text-anchor="middle">函数 / 设备</text><rect x="60" y="600" width="280" height="80" class="box muted"/><text x="200.0" y="642" class="label" text-anchor="middle">输入组合</text><text x="200.0" y="678" class="small" text-anchor="middle">全部送入 Prefill</text><path d="M340,240 L420,240" class="line" marker-end="url(#arrow)"/><path d="M340,335 L420,335" class="line" marker-end="url(#arrow)"/><path d="M340,430 L420,430" class="line" marker-end="url(#arrow)"/><path d="M340,525 L420,525" class="line" marker-end="url(#arrow)"/><path d="M340,640 L420,640" class="line" marker-end="url(#arrow)"/><rect x="420" y="200" width="340" height="480" class="box accent"/><text x="590.0" y="242" class="label" text-anchor="middle"></text><text x="590" y="248" class="label" text-anchor="middle">Prefill</text><text x="590" y="286" class="small" text-anchor="middle">读题阶段</text><text x="590" y="340" class="small" text-anchor="middle">并 行 计 算</text><text x="590" y="380" class="tiny" text-anchor="middle">受计算能力约束</text><text x="590" y="408" class="tiny" text-anchor="middle">输入越长，首 Token</text><text x="590" y="428" class="tiny" text-anchor="middle">出现得越慢</text><text x="590" y="485" class="small" text-anchor="middle">→ 建立 KV Cache</text><text x="590" y="520" class="tiny" text-anchor="middle">（供后续生成复用</text><text x="590" y="540" class="tiny" text-anchor="middle">的中间状态）</text><text x="590" y="605" class="small" text-anchor="middle">PagedAttention</text><text x="590" y="635" class="tiny" text-anchor="middle">像操作系统那样分页</text><text x="590" y="658" class="small" text-anchor="middle">vLLM 吞吐 2–4×</text><path d="M760,440 L820,440" class="line" marker-end="url(#arrow)"/><rect x="820" y="200" width="280" height="480" class="box muted"/><text x="960.0" y="242" class="label" text-anchor="middle"></text><text x="960" y="248" class="label" text-anchor="middle">KV Cache</text><text x="960" y="286" class="small" text-anchor="middle">工作台</text><rect x="850" y="330" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="906" y="330" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="962" y="330" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="1018" y="330" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="850" y="386" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="906" y="386" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="962" y="386" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="1018" y="386" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="850" y="442" width="46" height="44" rx="6" fill="#fef3c7" stroke="#506273" stroke-width="2"/><rect x="906" y="442" width="46" height=