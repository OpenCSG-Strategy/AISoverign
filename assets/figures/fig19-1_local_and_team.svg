<text x="625" y="284" font-size="10" text-anchor="middle" font-weight="normal" fill="#555">沙箱</text>
<line x1="675" y1="236" x2="718" y2="268" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="676" y="270" width="84" height="70" rx="4" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="686" y="290" width="64" height="36" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="718" y="313" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">测试</text>
<text x="718" y="284" font-size="10" text-anchor="middle" font-weight="normal" fill="#555">沙箱</text>
<line x1="675" y1="236" x2="811" y2="268" stroke="#111" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="769" y="270" width="84" height="70" rx="4" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="779" y="290" width="64" height="36" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="811" y="313" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">文档</text>
<text x="811" y="284" font-size="10" text-anchor="middle" font-weight="normal" fill="#555">沙箱</text>
<text x="490" y="362" font-size="12" text-anchor="start" font-weight="normal" fill="#555">每个执行者默认在隔离的 Docker 沙箱里干活</text>
<text x="490" y="382" font-size="12" text-anchor="start" font-weight="normal" fill="#555">入口：浏览器工作台 · 飞书 · 微信 · Matrix</text>
<rect x="490" y="400" width="370" height="64" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="675" y="424" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">截至二〇二六年十月，说明文件还没写到</text>
<text x="675" y="446" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">细粒度授权 · 人工确认 · 断点恢复 · 整体导出</text>
</svg>
