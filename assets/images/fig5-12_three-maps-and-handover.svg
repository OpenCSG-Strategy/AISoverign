<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-12 一个人也在运行一张能力网络</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。上半：3 张小图（资料图 / 行动图 / 替代图）看清 OPC 的能力网络；下半：4 类数字交接，防止订阅取消变成业务断点。原则：能力网络让 1 个人获得规模，也需要 1 个人画清边界。数据来源：第五章正文 05.12。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e79"/></marker></defs>

<text x="60" y="55" class="title" text-anchor="start">图5-12　一个人也在运行一张能力网络</text>
<text x="800" y="100" class="label" text-anchor="middle">3 张小图看清网络 · 4 类交接防止"取消订阅 = 业务断点"</text>

<!-- 上：3 张小图 -->
<g>
  <text x="60" y="140" class="label" text-anchor="start" fill="#1f4e79">A · 看清网络的 3 张小图（不需要技术绘图软件，纸 + 箭头即可）</text>

  <!-- ① 资料图 -->
  <rect x="60"  y="160" width="490" height="280" class="box accent"/>
  <text x="100" y="195" class="num" text-anchor="start">①</text>
  <text x="160" y="195" class="label" text-anchor="start">资料图</text>
  <text x="100" y="220" class="small" text-anchor="start" fill="#8795a1">客户 / 私人 / 公开 / 财务 — 在哪里、谁可读</text>
  <line x1="100" y1="235" x2="510" y2="235" class="thin"/>
  <text x="80"  y="265" class="small" text-anchor="start" font-weight="700">客户材料</text>
  <text x="80"  y="290" class="small" text-anchor="start" fill="#1f4e79">→ CRM · 项目板</text>
  <text x="80"  y="320" class="small" text-anchor="start" font-weight="700">私人记录</text>
  <text x="80"  y="345" class="small" text-anchor="start" fill="#7c2d12">→ 仅本机 / 加密笔记</text>
  <text x="80"  y="375" class="small" text-anchor="start" font-weight="700">公开研究</text>
  <text x="80"  y="400" class="small" text-anchor="start" fill="#1f4e79">→ 研究助手 · 浏览抓取</text>
  <text x="80"  y="425" class="tiny" text-anchor="start" fill="#7c2d12">警示：研究助手为什么能看见付款资料？</text>

  <!-- ② 行动图 -->
  <rect x="555" y="160" width="490" height="280" class="box warm"/>
  <text x="595" y="195" class="num" text-anchor="start">②</text>
  <text x="655" y="195" class="label" text-anchor="start">行动图</text>
  <text x="595" y="220" class="small" text-anchor="start" fill="#8795a1">谁能建议 / 草稿 / 发送 / 付款 / 删除 / 发布</text>
  <line x1="595" y1="235" x2="1005" y2="235" class="thin"/>
  <text x="575" y="265" class="small" text-anchor="start" fill="#1f4e79">L1 建议</text>
  <text x="575" y="290" class="small" text-anchor="start" fill="#7c2d12">L2 草稿</text>
  <text x="575" y="315" class="small" text-anchor="start" fill="#7c2d12">L3 发送</text>
  <text x="575" y="340" class="small" text-anchor="start" fill="#7c2d12">L4 付款 / 删除 / 发布</text>
  <text x="760" y="265" class="small" text-anchor="start">所有助手可</text>
  <text x="760" y="315" class="small" text-anchor="start">少数助手可</text>
  <text x="760" y="340" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">必须经人确认</text>
  <text x="575" y="400" class="tiny" text-anchor="start" fill="#7c2d12">警示：发布平台为什么保存客户通讯录？</text>

  <!-- ③ 替代图 -->
  <rect x="1050" y="160" width="490" height="280" class="box green"/>
  <text x="1090" y="195" class="num" text-anchor="start">③</text>
  <text x="1150" y="195" class="label" text-anchor="start">替代图</text>
  <text x="1090" y="220" class="small" text-anchor="start" fill="#8795a1">某节点失效后，谁跟着停、最小接管路径</text>
  <line x1="1090" y1="235" x2="1500" y2="235" class="thin"/>
  <text x="1070" y="265" class="small" text-anchor="start" font-weight="700">模型失效</text>
  <text x="1070" y="290" class="small" text-anchor="start" fill="#1f4e79">→ 备用模型 / 本地弱模型</text>
  <text x="1070" y="320" class="small" text-anchor="start" font-weight="700">平台失效</text>
  <text x="1070" y="345" class="small" text-anchor="start" fill="#1f4e79">→ 备用平台 / 手工</text>
  <text x="1070" y="375" class="small" text-anchor="start" font-weight="700">账户失效</text>
  <text x="1070" y="400" class="small" text-anchor="start" fill="#7c2d12">→ 应急访问 / 别人可暂停</text>
  <text x="1070" y="425" class="tiny" text-anchor="start" fill="#7c2d12">警示：停用的测试 Agent 为何仍有网盘权限？</text>
</g>

<!-- 下：4 类数字交接 -->
<g>
  <line x1="60" y1="465" x2="1540" y2="465" class="line"/>
  <text x="60" y="500" class="label" text-anchor="start" fill="#1f4e79">B · Agent 离开之前，留下 4 类东西（数字交接）</text>
  <text x="60" y="525" class="small" text-anchor="start" fill="#7c2d12">人类员工离职会交还钥匙；数字角色替换却常常只取消订阅 — 这会留下业务断点</text>

  <rect x="60"  y="550" width="360" height="220" class="box warm"/>
  <text x="240" y="585" class="label" text-anchor="middle">① 职责</text>
  <text x="240" y="615" class="small" text-anchor="middle">它负责什么</text>
  <text x="240" y="640" class="small" text-anchor="middle" fill="#1f4e79">角色定义 · 任务边界</text>
  <text x="240" y="700" class="tiny" text-anchor="middle" fill="#8795a1">不只订阅合同，</text>
  <text x="240" y="725" class="tiny" text-anchor="middle" fill="#8795a1">是"这个角色是干什么的"</text>

  <rect x="430" y="550" width="360" height="220" class="box accent"/>
  <text x="610" y="585" class="label" text-anchor="middle">② 任务状态</text>
  <text x="610" y="615" class="small" text-anchor="middle">当前未完成任务</text>
  <text x="610" y="640" class="small" text-anchor="middle" fill="#1f4e79">进行中 · 等待中 · 已承诺</text>
  <text x="610" y="700" class="tiny" text-anchor="middle" fill="#8795a1">防止重复发信，</text>
  <text x="610" y="725" class="tiny" text-anchor="middle" fill="#8795a1">防止遗漏已承诺</text>

  <rect x="800" y="550" width="360" height="220" class="box green"/>
  <text x="980" y="585" class="label" text-anchor="middle">③ 资料 + 规则</text>
  <text x="980" y="615" class="small" text-anchor="middle">使用了哪些资料</text>
  <text x="980" y="640" class="small" text-anchor="middle" fill="#1f4e79">和判断规则</text>
  <text x="980" y="700" class="tiny" text-anchor="middle" fill="#8795a1">不是"全部历史对话"</text>
  <text x="980" y="725" class="tiny" text-anchor="middle" fill="#8795a1">是清晰的业务规则</text>

  <rect x="1170" y="550" width="370" height="220" class="box warm"/>
  <text x="1355" y="585" class="label" text-anchor="middle">④ 行动记录</text>
  <text x="1355" y="615" class="small" text-anchor="middle">已执行 / 等待中</text>
  <text x="1355" y="640" class="small" text-anchor="middle" fill="#7c2d12" font-weight="700">外部动作必须可追溯</text>
  <text x="1355" y="700" class="tiny" text-anchor="middle" fill="#8795a1">模型"思考过程"</text>
  <text x="1355" y="725" class="tiny" text-anchor="middle" fill="#8795a1">既不可靠也可能含敏感</text>
</g>

<!-- 底部论断 -->
<g>
  <line x1="60" y1="790" x2="1540" y2="790" class="line"/>
  <text x="800" y="830" class="label" text-anchor="middle" fill="#1f4e79">个人 AI 资产 = 角色 / 任务 / 边界 / 评测样例 / 交接格式</text>
  <text x="800" y="862" class="small" text-anchor="middle">不只某个 Agent 的名字；底层模型和工具可以更新，资产不能埋在平台内部</text>
</g>

<text x="60" y="895" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章正文 05.12</text>
</svg>
