<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图序-5 主权重新出现：能力 vs 自给自足</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"主权重新出现"画成双层对比：表层是 4 个常见误判（数据本地 / 一次采购 / 限制接口 / 写好合同），底层是真正需要具备的 6 项能力（理解 / 评价 / 选择 / 取得 / 改造 / 使用）。技术主权研究的清晰结论：自主不是独自制造全部技术，而是具备上述 6 项能力。数据来源：Floridi et al. (2020) 数字主权研究；Trujillo et al. (2024) 技术主权能力评估。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图序-5　主权重新出现：能力 vs 自给自足</text>
<text x="800" y="100" class="label" text-anchor="middle">"数据存在本地"不等于"系统在自己手里"；自主 = 能理解/评价/选择/取得/改造/使用，而不是独自造出全部技术</text>

<!-- 左侧：常见误判 -->
<rect x="60" y="140" width="640" height="540" class="box warm"/>
<text x="380" y="180" class="label" text-anchor="middle">常见误判：以为做到这些就够</text>
<line x1="100" y1="200" x2="660" y2="200" class="thin"/>

<text x="100" y="240" class="num" text-anchor="start" fill="#7c2d12">✗</text>
<text x="160" y="240" class="label" text-anchor="start">"数据存在本地"</text>
<text x="100" y="270" class="small" text-anchor="start">服务器在机房 ≠ 在自己手里</text>
<text x="100" y="290" class="small" text-anchor="start">模型更新 / 任务记忆 / 关键接口仍可能不在控制</text>

<text x="100" y="335" class="num" text-anchor="start" fill="#7c2d12">✗</text>
<text x="160" y="335" class="label" text-anchor="start">"一次性采购"</text>
<text x="100" y="365" class="small" text-anchor="start">许可证 ≠ 长期运行能力</text>
<text x="100" y="385" class="small" text-anchor="start">供应商改变条件后，能否继续运行？</text>

<text x="100" y="430" class="num" text-anchor="start" fill="#7c2d12">✗</text>
<text x="160" y="430" class="label" text-anchor="start">"限制接口就安全"</text>
<text x="100" y="460" class="small" text-anchor="start">接口有限 ≠ 解释能力有</text>
<text x="100" y="480" class="small" text-anchor="start">能问"为什么这么判断"和能调 API 是两件事</text>

<text x="100" y="525" class="num" text-anchor="start" fill="#7c2d12">✗</text>
<text x="160" y="525" class="label" text-anchor="start">"写好合同 = 主权落地"</text>
<text x="100" y="555" class="small" text-anchor="start">静态条款 ≠ 运行中成立</text>
<text x="100" y="575" class="small" text-anchor="start">决定权是"运行时"：谁签发身份、谁限制权限、谁叫停、谁取证据</text>

<text x="100" y="625" class="num" text-anchor="start" fill="#7c2d12" font-size="28px">→</text>
<text x="180" y="625" class="label" text-anchor="start">这些都只是主权的"门面"</text>
<text x="100" y="655" class="small" text-anchor="start">看见门面易，识别底下有没有能力难</text>

<!-- 右侧：6 项能力 -->
<rect x="720" y="140" width="820" height="540" class="box green"/>
<text x="1130" y="180" class="label" text-anchor="middle">真正的 AI 主权 = 具备 6 项能力</text>
<line x1="760" y1="200" x2="1500" y2="200" class="thin"/>

<text x="760" y="240" class="num" text-anchor="start">①</text>
<text x="820" y="240" class="label" text-anchor="start">理解</text>
<text x="900" y="240" class="small" text-anchor="start">能解释模型如何工作、为何这样输出</text>

<text x="760" y="285" class="num" text-anchor="start">②</text>
<text x="820" y="285" class="label" text-anchor="start">评价</text>
<text x="900" y="285" class="small" text-anchor="start">能独立测评、知道在哪些场景下不可信</text>

<text x="760" y="330" class="num" text-anchor="start">③</text>
<text x="820" y="330" class="label" text-anchor="start">选择</text>
<text x="900" y="330" class="small" text-anchor="start">能比较多个方案，决策不依赖单一供应商</text>

<text x="760" y="375" class="num" text-anchor="start">④</text>
<text x="820" y="375" class="label" text-anchor="start">取得</text>
<text x="900" y="375" class="small" text-anchor="start">能合法获得模型、权重、数据、算力</text>

<text x="760" y="420" class="num" text-anchor="start">⑤</text>
<text x="820" y="420" class="label" text-anchor="start">改造</text>
<text x="900" y="420" class="small" text-anchor="start">能微调、提示词工程、接工具、嵌入本地知识</text>

<text x="760" y="465" class="num" text-anchor="start" fill="#7c2d12">⑥</text>
<text x="820" y="465" class="label" text-anchor="start">使用</text>
<text x="900" y="465" class="small" text-anchor="start">真正落到工作流，能稳定运行并处理事故</text>

<text x="760" y="525" class="num" text-anchor="start" fill="#1f4e79" font-size="28px">≡</text>
<text x="820" y="525" class="label" text-anchor="start">自主 ≠ 独自制造</text>
<text x="900" y="525" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">6 项能力齐备即可，技术来源可以多样</text>
<text x="760" y="555" class="small" text-anchor="start">没有这 6 项，再多本地服务器也只是一台不透明的依赖品</text>
<text x="760" y="580" class="small" text-anchor="start" fill="#8795a1">技术主权研究早已区分能力与自给自足</text>
<text x="760" y="600" class="tiny" text-anchor="start" fill="#8795a1">Floridi et al. (2020)；Trujillo et al. (2024)</text>

<!-- 底部：核心论断 -->
<rect x="60" y="710" width="1480" height="130" class="box muted"/>
<text x="800" y="750" class="label" text-anchor="middle">当智能体取得工具和行动权限，这套判断变得更加具体：不再是"系统在哪里"，而是"谁能动、谁决定、谁兜底"</text>
<line x1="100" y1="770" x2="1500" y2="770" class="thin"/>
<text x="100" y="805" class="small" text-anchor="start">· 主权 = 运行时能力，不是合同条款</text>
<text x="100" y="828" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">· 上面 6 项能力缺一项，主权就有断点</text>

<text x="60" y="870" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · Floridi et al. (2020) 数字主权；Trujillo et al. (2024) 技术主权能力评估</text>
</svg>
