<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">补图A　个人记忆的三重边界</text><text x="800" y="115" class="label" text-anchor="middle">记忆不是静态数据库：事实、偏好和推断都要经过时间、场景与解释边界</text><circle cx="800" cy="470" r="240" fill="#e8eef5" stroke="#34495e" stroke-width="4"/><circle cx="800" cy="470" r="165" fill="#fef3c7" stroke="#34495e" stroke-width="4"/><circle cx="800" cy="470" r="90" fill="#dcfce7" stroke="#34495e" stroke-width="4"/><text x="800" y="465" class="label" text-anchor="middle">事实</text><text x="800" y="500" class="tiny" text-anchor="middle">本人提供 / 可核对</text><text x="800" y="350" class="label" text-anchor="middle">偏好</text><text x="800" y="380" class="tiny" text-anchor="middle">行为中形成 / 可修正</text><text x="800" y="230" class="label" text-anchor="middle">推断</text><text x="800" y="260" class="tiny" text-anchor="middle">模型生成 / 不等于事实</text><rect x="220" y="330" width="260" height="90" class="box accent"/><text x="350.0" y="372" class="label" text-anchor="middle">时间边界</text><text x="350.0" y="408" class="small" text-anchor="middle">多久有效？</text><rect x="1120" y="330" width="260" height="90" class="box warm"/><text x="1250.0" y="372" class="label" text-anchor="middle">场景边界</text><text x="1250.0" y="408" class="small" text-anchor="middle">在哪里适用？</text><rect x="220" y="610" width="260" height="90" class="box muted"/><text x="350.0" y="652" class="label" text-anchor="middle">解释边界</text><text x="350.0" y="688" class="small" text-anchor="middle">为何这样判断？</text><path d="M480,375 L620,430" class="line" marker-end="url(#arrow)"/><path d="M1120,375 L980,430" class="line" marker-end="url(#arrow)"/><path d="M480,655 L650,530" class="line" marker-end="url(#arrow)"/><rect x="1110" y="610" width="270" height="90" class="box green"/><text x="1245.0" y="652" class="label" text-anchor="middle">本人操作</text><text x="1245.0" y="688" class="small" text-anchor="middle">查看 · 纠正 · 删除</text><path d="M980,530 L1110,655" class="line" marker-end="url(#arrow)"/><text x="800" y="805" class="label" text-anchor="middle">过时偏好 → 推荐 → 行为强化；纠正必须能改变后续使用，而不是只改一条显示文字</text>
