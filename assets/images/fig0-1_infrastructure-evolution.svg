<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#faf9f6"/>
  <style>
    .title{font:700 34px sans-serif;fill:#18212b}.sub{font:400 19px sans-serif;fill:#52606d}.h{font:700 22px sans-serif;fill:#18212b}.b{font:400 18px sans-serif;fill:#334155}.small{font:400 16px sans-serif;fill:#64748b}.line{stroke:#52606d;stroke-width:5;fill:none}.node{fill:#e8eef2;stroke:#36566b;stroke-width:3}.accent{fill:#d9e9df;stroke:#39705a;stroke-width:3}
  </style>
  <text x="80" y="70" class="title">从动力基础设施到可治理委托</text>
  <text x="80" y="105" class="sub">每一层都保留在下一层的底部；变化是机器越来越多地参与选择、解释与行动。</text>
  <path d="M150 385 H1450" class="line"/>
  <g transform="translate(115,220)"><rect width="190" height="245" rx="18" class="node"/><text x="95" y="48" text-anchor="middle" class="h">机械化</text><text x="95" y="80" text-anchor="middle" class="small">电气化</text><text x="20" y="130" class="b">标准化能力</text><text x="20" y="158" class="small">动力与重复动作</text><text x="20" y="198" class="b">控制点</text><text x="20" y="226" class="small">设备、能源、工厂</text></g>
  <g transform="translate(345,220)"><rect width="190" height="245" rx="18" class="node"/><text x="95" y="48" text-anchor="middle" class="h">计算机化</text><text x="20" y="130" class="b">标准化能力</text><text x="20" y="158" class="small">计算、记录、规则</text><text x="20" y="198" class="b">控制点</text><text x="20" y="226" class="small">软件、权限、格式</text></g>
  <g transform="translate(575,220)"><rect width="190" height="245" rx="18" class="node"/><text x="95" y="48" text-anchor="middle" class="h">互联网化</text><text x="20" y="130" class="b">标准化能力</text><text x="20" y="158" class="small">传递、协作、分发</text><text x="20" y="198" class="b">控制点</text><text x="20" y="226" class="small">协议、入口、身份</text></g>
  <g transform="translate(805,220)"><rect width="190" height="245" rx="18" class="node"/><text x="95" y="48" text-anchor="middle" class="h">云平台化</text><text x="20" y="130" class="b">标准化能力</text><text x="20" y="158" class="small">存储、算力、软件</text><text x="20" y="198" class="b">控制点</text><text x="20" y="226" class="small">区域、接口、迁移</text></g>
  <g transform="translate(1035,220)"><rect width="190" height="245" rx="18" class="accent"/><text x="95" y="48" text-anchor="middle" class="h">模型化</text><text x="20" y="130" class="b">标准化能力</text><text x="20" y="158" class="small">生成、归纳、预测</text><text x="20" y="198" class="b">控制点</text><text x="20" y="226" class="small">权重、上下文、评测</text></g>
  <g transform="translate(1265,220)"><rect width="190" height="245" rx="18" class="accent"/><text x="95" y="48" text-anchor="middle" class="h">Agent化</text><text x="20" y="130" class="b">标准化能力</text><text x="20" y="158" class="small">规划、调用、行动</text><text x="20" y="198" class="b">控制点</text><text x="20" y="226" class="small">身份、授权、停止权</text></g>
  <text x="800" y="555" text-anchor="middle" class="h">人的责任迁移：写出每一步 → 规定目的、边界、证据与补救</text>
  <text x="800" y="610" text-anchor="middle" class="sub">原创示意图｜不代表技术阶段严格替代，也不以年份判断进步</text>
</svg>
