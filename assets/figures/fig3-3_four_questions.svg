<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="360" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">随身带着的四个问题</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">对一个人、一家企业、一座城市都管用</text>
<rect x="40" y="95" width="190" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="135" cy="128" r="15" fill="#111"/>
<text x="135" y="134" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="135" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">它能看到什么？</text>
<rect x="247" y="95" width="190" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="342" cy="128" r="15" fill="#111"/>
<text x="342" y="134" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="342" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">它能做什么？</text>
<rect x="454" y="95" width="190" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="549" cy="128" r="15" fill="#111"/>
<text x="549" y="134" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="549" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">谁能让它停下来？</text>
<rect x="661" y="95" width="190" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="756" cy="128" r="15" fill="#111"/>
<text x="756" y="134" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="756" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">出了事谁负责？</text>
<text x="40" y="252" font-size="15" text-anchor="start" font-weight="bold" fill="#111">“人在回路”：人点最后一下“确认”，三个条件同时满足才算数</text>
<rect x="40" y="275" width="256" height="56" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="168" y="309" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">有足够的时间理解</text>
<text x="306" y="310" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">+</text>
<rect x="316" y="275" width="256" height="56" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="444" y="309" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">有足够的信息判断</text>
<text x="582" y="310" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">+</text>
<rect x="592" y="275" width="256" height="56" rx="6" fill="#eee" stroke="#555" stroke-width="1.5"/>
<text x="720" y="309" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">按下停止键不会因此受罚</text>
</svg>
