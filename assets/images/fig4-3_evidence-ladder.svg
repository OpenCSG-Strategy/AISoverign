<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="1400" height="850" fill="#faf9f6"/>
  <style>.title{font:700 34px sans-serif;fill:#18212b}.sub{font:400 19px sans-serif;fill:#52606d}.h{font:700 22px sans-serif;fill:#18212b}.b{font:400 18px sans-serif;fill:#334155}.small{font:400 16px sans-serif;fill:#64748b}.step{fill:#e8eef2;stroke:#36566b;stroke-width:3}.risk{fill:#f2e3d9;stroke:#9b5e3b;stroke-width:3}.arrow{stroke:#52606d;stroke-width:4;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <text x="70" y="65" class="title">从输出到行动：证据强度的阶梯</text>
  <text x="70" y="100" class="sub">模型分数回答“在这个测试里怎样”；治理还要回答“谁授权、谁复核、出错后如何补救”。</text>
  <path d="M170 700 L170 160 L1240 160" class="arrow"/>
  <g transform="translate(240,585)"><rect width="820" height="105" rx="18" class="step"/><text x="30" y="40" class="h">1｜模型输出</text><text x="30" y="75" class="b">回答、分类、代码或生成内容</text><text x="620" y="75" class="small">能证明：生成了什么</text></g>
  <g transform="translate(300,465)"><rect width="820" height="105" rx="18" class="step"/><text x="30" y="40" class="h">2｜任务评测</text><text x="30" y="75" class="b">正常、边界、对抗与影响场景</text><text x="620" y="75" class="small">能证明：在何种条件下有效</text></g>
  <g transform="translate(360,345)"><rect width="820" height="105" rx="18" class="step"/><text x="30" y="40" class="h">3｜运行证据</text><text x="30" y="75" class="b">版本、权限、工具、来源、日志与人工接管</text><text x="620" y="75" class="small">能证明：怎样行动</text></g>
  <g transform="translate(420,225)"><rect width="820" height="105" rx="18" class="risk"/><text x="30" y="40" class="h">4｜公共结果</text><text x="30" y="75" class="b">申诉、纠错、事故、补救与可替换性</text><text x="620" y="75" class="small">能证明：谁承担后果</text></g>
  <text x="1180" y="760" text-anchor="end" class="sub">越向上，证据越接近现实，但成本、责任和复核要求也越高</text>
  <text x="70" y="805" class="small">原创示意图｜任何一层都不能单独替代其他层</text>
</svg>
