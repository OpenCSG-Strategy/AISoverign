<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="330" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">三本账</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">只看 Token 单价，会漏掉行动风险，也会漏掉没人用上的产出</text>
<rect x="40" y="90" width="260" height="210" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="60" y="125" font-size="18" text-anchor="start" font-weight="bold" fill="#111">资源账</text>
<text x="280" y="125" font-size="13" text-anchor="end" font-weight="normal" fill="#555">花了多少</text>
<text x="60" y="165" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· Token、算力</text>
<text x="60" y="195" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 工具调用次数</text>
<text x="60" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 人工分钟</text>
<line x1="60" y1="255" x2="280" y2="255" stroke="#555" stroke-width="1.5"/>
<text x="60" y="282" font-size="14" text-anchor="start" font-weight="bold" fill="#111">用来省钱</text>
<line x1="302" y1="195" x2="323" y2="195" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="325" y="90" width="260" height="210" rx="6" fill="#e8e8e8" stroke="#111" stroke-width="1.5"/>
<text x="345" y="125" font-size="18" text-anchor="start" font-weight="bold" fill="#111">任务账</text>
<text x="565" y="125" font-size="13" text-anchor="end" font-weight="normal" fill="#555">做得怎样</text>
<text x="345" y="165" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 成功率、耗时</text>
<text x="345" y="195" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 重试次数</text>
<text x="345" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 单任务总成本</text>
<line x1="345" y1="255" x2="565" y2="255" stroke="#555" stroke-width="1.5"/>
<text x="345" y="282" font-size="14" text-anchor="start" font-weight="bold" fill="#111">用来比较方案</text>
<line x1="587" y1="195" x2="608" y2="195" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="610" y="90" width="260" height="210" rx="6" fill="#c8c8c8" stroke="#111" stroke-width="1.5"/>
<text x="630" y="125" font-size="18" text-anchor="start" font-weight="bold" fill="#111">结果账</text>
<text x="850" y="125" font-size="13" text-anchor="end" font-weight="normal" fill="#555">换回了什么</text>
<text x="630" y="165" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 问题解决了没有</text>
<text x="630" y="195" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 返工、投诉、错付</text>
<text x="630" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#111">· 丢掉的生意</text>
<line x1="630" y1="255" x2="850" y2="255" stroke="#555" stroke-width="1.5"/>
<text x="630" y="282" font-size="14" text-anchor="start" font-weight="bold" fill="#111">老板真正关心</text>
</svg>
