<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图序-6 四级主权是一条能力与责任链</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把四级主权画成嵌套同心圆：个人 / 组织 / 企业 / 国家与城市 — 每层标注"能授权什么 / 责任不能外包"。以"AI 筛选简历"任务为统一例子，呈现同一项决定在四个层级产生四种不能互相替代的责任。能力可沿链条进入，风险可沿链条向下转嫁。数据来源：序章正文（综合自 OECD AI 治理建议 2019/2024；ILO-世行 2024 平台与劳动报告）。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图序-6　四级主权是一条能力与责任链</text>
<text x="800" y="100" class="label" text-anchor="middle">一次 AI 筛选简历的决定，在四个层级上产生四种不能互相替代的责任；能力可沿链条进入，风险也可沿链条向下转嫁</text>

<!-- 同心圆 4 层 -->
<g>
  <!-- 国家与城市 (外) -->
  <circle cx="800" cy="430" r="300" class="box muted" fill="#f0eee8"/>
  <text x="800" y="160" class="label" text-anchor="middle" fill="#1f4e79">国家 / 城市（公共边界与本地生态）</text>
  <text x="800" y="185" class="small" text-anchor="middle">规则 · 公共基础设施 · 救济</text>
  <text x="800" y="208" class="small" text-anchor="middle" fill="#7c2d12" font-weight="700">不能外包：劳动权利 / 数据使用 / 申诉救济</text>

  <!-- 企业 -->
  <circle cx="800" cy="430" r="225" class="box accent" fill="#dbeafe"/>
  <text x="800" y="240" class="label" text-anchor="middle">企业（技术底座 + 市场）</text>
  <text x="800" y="263" class="small" text-anchor="middle">供应商 / 评测 / 歧视风险 / 录用结果</text>
  <text x="800" y="285" class="small" text-anchor="middle" fill="#7c2d12" font-weight="700">不能外包：最终生产 + 学习能力</text>

  <!-- 组织 -->
  <circle cx="800" cy="430" r="150" class="box warm" fill="#fef3c7"/>
  <text x="800" y="320" class="label" text-anchor="middle">组织 / 部门（协同单元）</text>
  <text x="800" y="343" class="small" text-anchor="middle">数据隔离 · 流程 · 内部协同</text>
  <text x="800" y="365" class="small" text-anchor="middle" fill="#7c2d12" font-weight="700">不能外包：数据隔离 + 部门协同</text>

  <!-- 个人 (核心) -->
  <circle cx="800" cy="430" r="80" class="box green" fill="#dcfce7"/>
  <text x="800" y="425" class="label" text-anchor="middle">个人（行动者）</text>
  <text x="800" y="450" class="small" text-anchor="middle">拒绝 + 迁移</text>
</g>

<!-- 任务示例：AI 筛选简历 -->
<rect x="60" y="730" width="700" height="110" class="box accent"/>
<text x="410" y="760" class="label" text-anchor="middle">统一任务：AI 筛选简历（同一项决定在四层）</text>
<line x1="100" y1="778" x2="720" y2="778" class="thin"/>
<text x="100" y="805" class="small" text-anchor="start">· 候选人：资料如何使用 / 能否质疑结果</text>
<text x="100" y="828" class="small" text-anchor="start">· 人力部门：决定哪些字段可进入模型</text>
<text x="100" y="850" class="small" text-anchor="start">· 企业：供应商 + 评测 + 歧视风险 + 录用结果</text>
<text x="100" y="873" class="small" text-anchor="start">· 国家/城市：劳动权利 + 数据使用 + 生态回流 + 申诉救济</text>

<!-- 能力 vs 风险箭头 -->
<rect x="780" y="730" width="760" height="110" class="box warm"/>
<text x="1160" y="760" class="label" text-anchor="middle">嵌套委托链：能力可下传，风险也会下传</text>
<line x1="820" y1="778" x2="1500" y2="778" class="thin"/>
<text x="820" y="805" class="small" text-anchor="start">↑ 能力可沿链条进入（个人→部门→企业→国家/城市）</text>
<text x="820" y="828" class="small" text-anchor="start" fill="#7c2d12">↓ 风险也可沿链条向下转嫁（合规失败 → 用户被影响）</text>
<text x="820" y="850" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">AgenticOps 把这条责任链压到每一次运行上</text>
<text x="820" y="873" class="small" text-anchor="start">谁在委托 / 以谁身份行动 / 哪里越界 / 怎么恢复</text>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · OECD AI 治理建议 2019/2024；ILO-世行 2024</text>
</svg>
