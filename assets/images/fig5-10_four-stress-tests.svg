<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>图5-10 怎样判断个人系统仍可控：4 项压力测试</title><desc>《AI主权》原创信息图，v0.1，2026-08-06。把"判断个人系统可控"画成 4 项压力测试：失忆 / 换人 / 断权 / 追账。配 1 块恢复时间维度 —— "5 分钟恢复" 与 "3 个月重建" 不是同一种依赖。数据来源：第五章 05.10 正文。</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Noto Sans CJK SC, PingFang SC, sans-serif;fill:#1f2933}
.title{font-size:32px;font-weight:700}
.label{font-size:22px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.num{font-size:34px;font-weight:700;fill:#1f4e79}
.box{stroke:#34495e;stroke-width:2;rx:12}
.muted{fill:#f0eee8}
.accent{fill:#dbeafe}
.warm{fill:#fef3c7}
.green{fill:#dcfce7}
.line{stroke:#506273;stroke-width:3;fill:none}
.thin{stroke:#506273;stroke-width:1.5;fill:none}
</style>

<text x="60" y="55" class="title" text-anchor="start">图5-10　怎样判断个人系统仍可控：4 项压力测试</text>
<text x="800" y="100" class="label" text-anchor="middle">判断个人系统是否可控 —— 最好不依赖自我感觉，选择一个周末做 4 次压力测试</text>

<!-- 4 项压力测试 -->
<g>
  <rect x="60" y="160" width="730" height="180" class="box accent"/>
  <text x="100" y="200" class="num" text-anchor="start">①</text>
  <text x="160" y="200" class="label" text-anchor="start">失忆测试</text>
  <line x1="100" y1="220" x2="750" y2="220" class="thin"/>
<text x="100" y="250" class="small" text-anchor="start">关闭长期记忆 + 历史对话</text>
<text x="100" y="273" class="small" text-anchor="start">只提供自己整理的 1 页任务说明</text>
<text x="100" y="305" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">关键背景是否只在平台隐藏关联里？</text>
<text x="100" y="328" class="tiny" text-anchor="start" fill="#8795a1">完全无法开始 → 整理的不是聊天，是事实 / 偏好 / 承诺 / 来源</text>

  <rect x="810" y="160" width="730" height="180" class="box warm"/>
  <text x="850" y="200" class="num" text-anchor="start">②</text>
  <text x="910" y="200" class="label" text-anchor="start">换人测试</text>
  <line x1="850" y1="220" x2="1500" y2="220" class="thin"/>
<text x="850" y="250" class="small" text-anchor="start">同一任务 → 另一款模型 / 本地工具 / 亲自</text>
<text x="850" y="273" class="small" text-anchor="start">不追求文风相同，只看核心事实 / 步骤 / 交付物</text>
<text x="850" y="305" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">差异暴露：哪些能力来自模型，哪些来自自己</text>
  <text x="850" y="328" class="tiny" text-anchor="start" fill="#8795a1">看积累 vs 看能力</text>

  <rect x="60" y="360" width="730" height="180" class="box green"/>
  <text x="100" y="400" class="num" text-anchor="start">③</text>
  <text x="160" y="400" class="label" text-anchor="start">断权测试</text>
  <line x1="100" y1="420" x2="750" y2="420" class="thin"/>
<text x="100" y="450" class="small" text-anchor="start">撤销 Agent 对邮箱 / 日历 / 网盘 / 支付</text>
<text x="100" y="473" class="small" text-anchor="start">中一项权限</text>
<text x="100" y="505" class="small" text-anchor="start" fill="#1f4e79" font-weight="700">诚实失败 > 总能"想办法完成"</text>
<text x="100" y="528" class="tiny" text-anchor="start" fill="#8795a1">请求更窄授权 → 可信；绕行 → 不可信</text>

  <rect x="810" y="360" width="730" height="180" class="box accent"/>
  <text x="850" y="400" class="num" text-anchor="start" fill="#7c2d12">④</text>
  <text x="910" y="400" class="label" text-anchor="start" fill="#7c2d12">追账测试</text>
  <line x1="850" y1="420" x2="1500" y2="420" class="thin"/>
<text x="850" y="450" class="small" text-anchor="start">随机选一次已完成的高影响任务</text>
<text x="850" y="473" class="small" text-anchor="start">能否回答：谁发起 / 用了哪些资料</text>
<text x="850" y="495" class="small" text-anchor="start">调用什么工具 / 发生付款 / 发送 / 公开发布</text>
<text x="850" y="517" class="small" text-anchor="start">最终由谁确认？</text>
<text x="850" y="528" class="tiny" text-anchor="start" fill="#7c2d12" font-weight="700">只能找到聊天 → 行动记录还没发挥作用</text>
</g>

<!-- 底部：恢复时间 -->
<rect x="60" y="580" width="1480" height="280" class="box muted"/>
<text x="800" y="620" class="label" text-anchor="middle">恢复时间让"我太依赖它了"从情绪变成可逐步降低的指标</text>
<line x1="100" y1="640" x2="1500" y2="640" class="thin"/>

<g>
  <rect x="100" y="670" width="340" height="160" class="box accent"/>
  <text x="270" y="710" class="num" text-anchor="middle" fill="#1f4e79">5min</text>
  <text x="270" y="745" class="label" text-anchor="middle">轻依赖</text>
<line x1="140" y1="765" x2="400" y2="765" class="thin"/>
<text x="140" y="795" class="small" text-anchor="start">工具故障可快速恢复</text>
  <text x="140" y="818" class="small" text-anchor="start">只是效率问题</text>

  <rect x="460" y="670" width="340" height="160" class="box warm"/>
  <text x="630" y="710" class="num" text-anchor="middle" fill="#1f4e79">数小时</text>
<text x="630" y="745" class="label" text-anchor="middle">中依赖</text>
<line x1="500" y1="765" x2="760" y2="765" class="thin"/>
<text x="500" y="795" class="small" text-anchor="start">手工可完成 / 速度变慢</text>
<text x="500" y="818" class="small" text-anchor="start">但流程仍清楚</text>

  <rect x="820" y="670" width="340" height="160" class="box green"/>
  <text x="990" y="710" class="num" text-anchor="middle" fill="#7c2d12">数天</text>
<text x="990" y="745" class="label" text-anchor="middle" fill="#7c2d12">重依赖</text>
<line x1="860" y1="765" x2="1120" y2="765" class="thin"/>
<text x="860" y="795" class="small" text-anchor="start">需要重新配置</text>
<text x="860" y="818" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">单点失效开始</text>

  <rect x="1180" y="670" width="320" height="160" class="box accent"/>
  <text x="1340" y="710" class="num" text-anchor="middle" fill="#7c2d12">3个月+</text>
  <text x="1340" y="745" class="label" text-anchor="middle" fill="#7c2d12">失控</text>
<line x1="1220" y1="765" x2="1460" y2="765" class="thin"/>
<text x="1220" y="795" class="small" text-anchor="start">需要重建</text>
<text x="1220" y="818" class="small" text-anchor="start" fill="#7c2d12" font-weight="700">客户知识库/关系</text>
</g>

<text x="60" y="880" class="tiny">原创信息图 · v0.1 · 2026-08-06 · 适配单色印刷 · 第五章 05.10 正文</text>
</svg>
