<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="300" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<text x="40" y="40" font-size="20" text-anchor="start" font-weight="bold" fill="#111">宣布、签约、获批、在建、上线</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#555">读 AI 投资新闻时，五个阶段要分开看</text>
<rect x="40" y="120" width="120" height="64" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="100" y="159" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">宣布</text>
<line x1="162" y1="152" x2="208" y2="152" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="185" y="206" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">未必签了</text>
<text x="185" y="223" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">合同</text>
<rect x="210" y="120" width="120" height="64" rx="6" fill="#eaeaea" stroke="#111" stroke-width="1.5"/>
<text x="270" y="159" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">签约</text>
<line x1="332" y1="152" x2="378" y2="152" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="355" y="206" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">未必拿到</text>
<text x="355" y="223" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">许可</text>
<rect x="380" y="120" width="120" height="64" rx="6" fill="#d4d4d4" stroke="#111" stroke-width="1.5"/>
<text x="440" y="159" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">获批</text>
<line x1="502" y1="152" x2="548" y2="152" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="525" y="206" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">未必设备</text>
<text x="525" y="223" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">到货</text>
<rect x="550" y="120" width="120" height="64" rx="6" fill="#b8b8b8" stroke="#111" stroke-width="1.5"/>
<text x="610" y="159" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">在建</text>
<line x1="672" y1="152" x2="718" y2="152" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="695" y="206" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">电力、网络、</text>
<text x="695" y="223" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">软件、客户</text>
<text x="695" y="240" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">未必就位</text>
<rect x="720" y="120" width="120" height="64" rx="6" fill="#111" stroke="#111" stroke-width="1.5"/>
<text x="780" y="159" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">上线</text>
<text x="40" y="280" font-size="14" text-anchor="start" font-weight="bold" fill="#111">很多误读，来自把这五个阶段当成一回事</text>
</svg>
