<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506273"/></marker></defs><text x="60" y="65" class="title" text-anchor="start">图11-4　能力 × 权限边界</text><text x="800" y="115" class="label" text-anchor="middle">能力变强不等于权限自动放宽</text><path d="M150,420 C400,360 700,310 900,280 C1100,250 1300,220 1500,200" stroke="#3b82f6" stroke-width="5" fill="none"/><text x="1500" y="195" class="small" text-anchor="start">能力 ↑</text><path d="M150,720 C400,710 700,700 900,700 C1100,700 1300,700 1500,700" stroke="#ef4444" stroke-width="5" fill="none"/><text x="1500" y="690" class="small" text-anchor="start">权限 →</text><text x="60" y="200" class="label" text-anchor="start">能力放大（开放→持续领先）</text><text x="60" y="520" class="label" text-anchor="start">权限审查（按比例）</text><circle cx="450" cy="380" r="10" fill="#10b981"/><text x="450" y="405" class="small" text-anchor="middle">1</text><text x="1530" y="380" class="small" text-anchor="start">1　内部工具 → 边界变严</text><circle cx="900" cy="290" r="10" fill="#10b981"/><text x="900" y="315" class="small" text-anchor="middle">2</text><text x="1530" y="320" class="small" text-anchor="start">2　公共服务 → 高风险审查</text><circle cx="1300" cy="230" r="10" fill="#10b981"/><text x="1300" y="255" class="small" text-anchor="middle">3</text><text x="1530" y="260" class="small" text-anchor="start">3　公共系统门槛 → 多重审查</text><rect x="60" y="800" width="1480" height="90" class="box pink"/><text x="800.0" y="842" class="label" text-anchor="middle">高影响决定需要什么</text><text x="800.0" y="878" class="small" text-anchor="middle">① 审计日志 ② 申诉路径 ③ 定期复审；能力每升一级，权限不能自动放宽——门槛形式依组织而定</text>
